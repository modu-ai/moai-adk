<!-- expect: -->
<!-- Path reader bail-out: the connector uses a C cubic the reader does not interpret, so it is skipped silently. The mask 4 units above it would be SVG070 if the path had been parsed, which is what makes the silence load-bearing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200"
     role="img" aria-labelledby="path-cubic-unreadable-title path-cubic-unreadable-desc">
  <title id="path-cubic-unreadable-title">Curved run</title>
  <desc id="path-cubic-unreadable-desc">A connector drawn as a cubic curve passes under a masked label.</desc>
  <defs>
    <marker id="path-cubic-unreadable-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#6B6359"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="400" height="200" fill="#FAF9F5"/>
  <path d="M 60 150 C 100 150 140 150 180 150" stroke="#6B6359" stroke-width="1" fill="none" marker-end="url(#path-cubic-unreadable-arrow)"/>
  <rect x="100" y="126" width="90" height="20" fill="#FFFFFF"/>
  <text x="145" y="140" font-size="11" text-anchor="middle" fill="#141413">handoff</text>
</svg>
