# moai-template:02-child-issue@1.0.0; machine metadata is correlation only, never authorization
name: Agentic Factory - Child Issue
description: "One Issue, one active agent, multiple tasks across plan, run and sync."
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: |
        ## Child Issue

        This form records a child issue for the Agentic Factory. Nothing in it applies labels, assignees, projects or milestones; those are separate, approved steps.

        - Redaction rule: never write tokens, API keys, credentials or cookies; personal data (email addresses, personal names, user-identifying local paths); absolute home-directory paths (use repository-relative paths); raw logs, environment dumps or stack traces (write a short summary and link an accessible artifact); or content copied from private remotes or private repositories. If sensitive content was already posted, stop and report it to the operator instead of silently editing history.
        - Comment style: summary and delta only. Say what changed since the previous revision, link the evidence, and name the next action. Do not repeat the full Issue body, earlier comments or logs, and post nothing when nothing substantive changed.
  - type: markdown
    attributes:
      value: |
        ## Preparation stages

        Intake and preparation run in the background so the leader stays responsive: ACK, then Issue published, then branch and worktree READY, then start.

        | Stage | Meaning and next step |
        |---|---|
        | ACCEPTED | Request intent and approval scope are recorded with a durable receipt (the ACK). This is not yet a development state. |
        | ISSUE_CONFIRMED | The real Issue was published, re-read, and matched to the request. |
        | BRANCH_REGISTERED | The branch reference and base object were checked against the remote and against existing branches. |
        | AGENT_RESERVED | One agent and a free slot were reserved. A reservation is not permission to start development. |
        | WT_PREPARED | The worktree on the executing host was verified (branch, dirty state, configuration) and the preparing writer is quiet. |
        | READY_ACKED | The reserved agent explicitly accepted the preparation receipt. Only now may development start. |
        | BLOCKED or EFFECT_UNKNOWN | Keep the failed stage, the remaining effects and the resume condition. Do not create a new Issue, branch or agent automatically. |

        Rule: no development launch before READY_ACKED. The preparation step writes no product code or SPEC, and its write access never overlaps the development agent's.
  - type: checkboxes
    id: redaction-confirmed
    attributes:
      label: Redaction
      description: "Confirm before submitting. The redaction rule is stated at the top of this form."
      options:
        - label: "I removed tokens, credentials, personal data, absolute home paths, raw logs and private content"
          required: true
  - type: textarea
    id: common-fields
    attributes:
      label: Common fields
      description: "Fill each value from observed evidence. Write not applicable with a reason where a value does not apply."
      value: |
        | Common field | Value |
        |---|---|
        | actor / role / session_id | {{ authenticated actor, role and session }} |
        | Issue / repo immutable ID | {{ canonical URL and immutable ID }} |
        | template_version / policy_revision | 1.0.0 / {{ policy hash }} |
        | source_event_id / source_revision | {{ source event and revision }} |
        | effect_id / request_id / dedup_key | {{ publish intent ID and canonical payload hash }} |
        | collector_cursor / adopted_revision / consumer_ack | {{ record collection, adoption and ACK separately; give the reason when not applicable }} |
        | head_sha / base_sha / spec_hash | {{ value, or not applicable with the reason }} |
        | observed_at / original_evidence | {{ RFC 3339 time with offset; original URL, log or receipt }} |
        | current state / next action / owner | {{ observed state and the next trigger }} |
    validations:
      required: true
  - type: textarea
    id: section-1
    attributes:
      label: "Parent Issue"
      description: "Write from evidence. State anything unverified or not run explicitly."
    validations:
      required: true
  - type: textarea
    id: section-2
    attributes:
      label: "Reproduction input and observed result"
      description: "Write from evidence. State anything unverified or not run explicitly."
    validations:
      required: false
  - type: textarea
    id: section-3
    attributes:
      label: "Expected behavior"
      description: "Write from evidence. State anything unverified or not run explicitly."
    validations:
      required: false
  - type: textarea
    id: section-4
    attributes:
      label: "File scope and exclusions"
      description: "Write from evidence. State anything unverified or not run explicitly."
    validations:
      required: false
  - type: textarea
    id: section-5
    attributes:
      label: "Prerequisites and claim conditions"
      description: "Write from evidence. State anything unverified or not run explicitly."
    validations:
      required: false
  - type: textarea
    id: section-6
    attributes:
      label: "Acceptance tests"
      description: "Write from evidence. State anything unverified or not run explicitly."
    validations:
      required: false
  - type: textarea
    id: section-7
    attributes:
      label: "Completion and sync conditions"
      description: "Write from evidence. State anything unverified or not run explicitly."
    validations:
      required: false
  - type: textarea
    id: tasks
    attributes:
      label: One Issue, multiple tasks
      description: "One Issue is handled by one active agent. That agent owns the SPEC and the plan, run and sync phases and every internal task. Tasks run in dependency order; only independent scopes run in parallel. A helper execution is not a separate Issue owner and never creates a second writer on the same branch. The sync phase hands the changes to a pull request; it does not replace the safe local sync after merge or the closing of the Issue by the leader."
      value: |
        | task_id | phase (plan / run / sync) | depends_on | scope | status | evidence |
        |---|---|---|---|---|---|
        | {{ id }} | plan | {{ ids or none }} | {{ files and exclusions }} | {{ PENDING / NOT_RUN / observed result }} | {{ link or receipt }} |
        | {{ id }} | run | {{ ids or none }} | {{ files and exclusions }} | {{ PENDING / NOT_RUN / observed result }} | {{ link or receipt }} |
        | {{ id }} | sync | {{ ids or none }} | {{ files and exclusions }} | {{ PENDING / NOT_RUN / observed result }} | {{ link or receipt }} |
  - type: textarea
    id: context-ledger
    attributes:
      label: Context ledger
      value: |
        The latest index lives in the Issue's canonical context block. A comment carries only the entries that changed: the item, the reason, the new revision, a short result and the link.

        | entry_id | revision | kind | repo-relative path | commit-pinned link | artifact commit | artifact sha256 | target head | owner (role, session_id) | verification state | verified_at | accessibility |
        |---|---|---|---|---|---|---|---|---|---|---|---|
        | {{ stable id }} | {{ number }} | {{ spec / plan / decision / failure / regression / audit / pr_handoff / completion / other }} | {{ path }} | {{ link pinned to the full artifact commit }} | {{ full commit }} | {{ digest of the file bytes }} | {{ full head, or N/A with the reason }} | {{ role, immutable session_id }} | {{ PENDING / NOT_RUN / PASS / FAIL / BLOCKED / UNKNOWN / STALE / LINK_BLOCKED }} | {{ RFC 3339 time }} | {{ accessible / inaccessible-local / inaccessible-unpushed / unknown }} |

        Ledger rules:

        - A link is evidence only when it is a commit-pinned link: host, owner, repository, blob, the full artifact commit, then the repository-relative path. Branch-based links, short hashes and local file links are not evidence.
        - Material that exists only on a local machine, or only in a commit that has not been pushed, is recorded with accessibility inaccessible-local or inaccessible-unpushed and verification state LINK_BLOCKED. It is never presented as team-accessible.
        - An entry becomes STALE when the target head changes, the artifact sha256 no longer matches the file bytes, or the adopted contract revision changes. A STALE entry is kept with its original verdict preserved; it is never deleted.
        - PENDING and NOT_RUN are not results, and an empty link is not completion evidence. A digest does not prove that the content is correct.
        - The artifact commit (where the file lives) and the target head (the code the file describes or verifies) are separate fields.
  - type: textarea
    id: execution-logic-diagram
    attributes:
      label: Execution logic diagram
      value: |
        The Mermaid source below is a structure template. Complete it with the real branches, failures and resume conditions of this work before it is rendered. A platform-rendered Mermaid fence is not the pinned renderer's output.

        ```mermaid
        flowchart TD
         N0[Issue claim]
         N1[SPEC check]
         N2[Implementation]
         N3[Checks review audit]
         N4[Merge and safe sync]
         N0 --> N1
         N1 --> N2
         N2 --> N3
         N3 --> N4
        ```

        - source SHA-256: {{ hash of the final Mermaid source }}
        - Render status: {{ PASS, or RENDER_BLOCKED; never record NOT_RUN as PASS }}
        - Pele version / bundle hash: {{ pinned version and bundle hash }}
        - light / dark SVG SHA-256 and URI: {{ actual render results }}
        - Pele SVG: not generated (renderer unavailable) — see GAP-PELE-SVG
        - Render, sanitize, contrast and layout QA: {{ each result; NOT_RUN is never PASS }}
        - Text description: {{ flow, failures, approvals, recovery and completion conditions }}
