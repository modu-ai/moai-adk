llm:
  mode: ""
  team_mode: ""
  glm_env_var: "GLM_API_KEY"

  # Per-agent model+effort profile selection (set once during init/update).
  # Selects the active column of the profile matrix below for all sub-agents.
  #   high   - quality-first column (top)
  #   medium - balanced default column
  #   low    - economical column
  # Absent or empty resolves to medium (backward compatible). The superseded
  # top-column name "max" is still READ as an alias for "high", but is never
  # written back.
  profile: "medium"

  # Legacy performance tier (read-time alias only — `profile` supersedes it).
  # Retained so the separate Tier x Phase routing axis keeps a tier source.
  # Now that the top column is named "high", this axis shares the profile
  # vocabulary exactly, so no projection is applied (a legacy "max" folds to
  # "high"). Options: high, medium, low.
  performance_tier: "medium"

  # Profile matrix (transparency + editability). Each profile column maps each
  # retained agent NAME to a {model, effort} pair — 11 agents x 3 columns = 33
  # cells. The Go default (template.DefaultProfileMatrix) is the authoritative
  # fallback for any cell absent here. Agents not listed (any user-added agent)
  # stay model: inherit and are never injected.
  #
  # Column intent:
  #   high   - Fable carries reasoning/audit; Opus carries coding at xhigh
  #   medium - Opus at `high` (the vendor API default effort) — most predictable
  #   low    - Opus low/medium as the primary token-cost lever, then Sonnet
  #
  # manager-docs / manager-git / Explore are profile-invariant apart from the
  # docs row's high-column bump.
  #
  # The model value is injected as a per-spawn runtime arg ([1m]-safe). The
  # effort value reaches the agent through its frontmatter `effort:` (the Agent
  # tool has no effort parameter) or through Workflow `opts.effort`. Explore has
  # no agent file, so its effort is stated at call time, never persisted.
  profiles:
    high:
      manager-spec:    { model: fable,  effort: xhigh }
      plan-auditor:    { model: fable,  effort: xhigh }
      sync-auditor:    { model: fable,  effort: xhigh }
      manager-develop: { model: opus,   effort: xhigh }
      super-advisor:   { model: opus,   effort: xhigh }
      manager-design:  { model: fable,  effort: high }
      builder-harness: { model: opus,   effort: xhigh }
      e2e-tester:      { model: fable,  effort: high }
      manager-docs:    { model: sonnet, effort: high }
      manager-git:     { model: sonnet, effort: low }
      Explore:         { model: sonnet, effort: low }
    medium:
      manager-spec:    { model: opus,   effort: high }
      plan-auditor:    { model: opus,   effort: high }
      sync-auditor:    { model: opus,   effort: high }
      manager-develop: { model: opus,   effort: high }
      super-advisor:   { model: opus,   effort: high }
      manager-design:  { model: opus,   effort: medium }
      builder-harness: { model: opus,   effort: medium }
      e2e-tester:      { model: opus,   effort: medium }
      manager-docs:    { model: sonnet, effort: medium }
      manager-git:     { model: sonnet, effort: low }
      Explore:         { model: sonnet, effort: low }
    low:
      manager-spec:    { model: opus,   effort: low }
      plan-auditor:    { model: opus,   effort: low }
      sync-auditor:    { model: opus,   effort: low }
      manager-develop: { model: sonnet, effort: medium }
      super-advisor:   { model: opus,   effort: medium }
      manager-design:  { model: sonnet, effort: medium }
      builder-harness: { model: sonnet, effort: medium }
      e2e-tester:      { model: sonnet, effort: medium }
      manager-docs:    { model: sonnet, effort: medium }
      manager-git:     { model: sonnet, effort: low }
      Explore:         { model: sonnet, effort: low }

  # Harness-generation model+effort map, consumed by /moai:harness when it
  # generates a specialist agent. Keyed profile -> purpose class -> { effort }.
  #
  # Harness agents are MODEL-UNIFORM on purpose: they are persistent, user-owned
  # specialists whose differentiation is reasoning DEPTH, not model tier, so the
  # effort axis alone separates them. The model is always `opus` — a `model:`
  # value written here is ignored. Pinning is safe because every current
  # non-haiku model carries a 1M context window, so an explicit pin no longer
  # loses the 1M entitlement that inherit-by-default used to preserve.
  #
  # The purpose classes are the same 7 names as the `workflow_agents` taxonomy in
  # workflow.yaml, so the two surfaces share one vocabulary. Each effort is
  # derived from the profile-matrix row named in the comment; an absent cell
  # falls through to that row's effort.
  harness_agents:
    high:
      read-only-extract:    { effort: low }     # <- Explore row
      mechanical-transform: { effort: low }     # <- manager-git row
      synthesize:           { effort: high }    # <- manager-docs row
      research:             { effort: xhigh }   # <- plan-auditor row
      verify-judge:         { effort: xhigh }   # <- sync-auditor row
      implement:            { effort: xhigh }   # <- manager-develop row
      design-architecture:  { effort: high }    # <- manager-design row
    medium:
      read-only-extract:    { effort: low }
      mechanical-transform: { effort: low }
      synthesize:           { effort: medium }
      research:             { effort: high }
      verify-judge:         { effort: high }
      implement:            { effort: high }
      design-architecture:  { effort: medium }
    low:
      read-only-extract:    { effort: low }
      mechanical-transform: { effort: low }
      synthesize:           { effort: medium }
      research:             { effort: low }
      verify-judge:         { effort: low }
      implement:            { effort: medium }
      design-architecture:  { effort: medium }

  # Optional per-agent overrides, keyed by canonical agent name. Each override
  # {model, effort} pair wins over the active profile's cell for that agent.
  # Example (uncomment + edit to pin an agent):
  #   agent_overrides:
  #     manager-develop: { model: opus, effort: xhigh }
  agent_overrides: {}

  # GLM backend configuration
  glm:
    base_url: "https://api.z.ai/api/anthropic"
    models:
      high: "glm-5.2"         # 1M context — Opus slot (main session + inherit agents)
      medium: "glm-4.7"       # 202K context — Sonnet slot (balanced)
      low: "glm-4.5-air"      # 128K context — Haiku slot (lightweight)
      fable: "glm-5.2"        # 1M context — Fable tier (ANTHROPIC_DEFAULT_FABLE_MODEL)

    # ── GLM reasoning-effort mapping (documentation-only — the Go overlay at
    #    internal/template/glm_effort_overlay.go is the runtime SSOT) ──
    #
    # z.ai does NOT implement Claude's 5-level effort vocabulary. The overlay
    # collapses Claude effort onto z.ai's 3 reachable reasoning states:
    #
    #   thinking-off    thinking=disabled, reasoning_effort moot   ← Claude low
    #   reasoning-high  thinking=enabled,  reasoning_effort=high   ← Claude medium/high
    #   reasoning-max   thinking=enabled,  reasoning_effort=max    ← Claude xhigh/max
    #
    # Collapse table (5 Claude levels → 3 GLM states):
    #   low      → thinking-off
    #   medium   → reasoning-high
    #   high     → reasoning-high
    #   xhigh    → reasoning-max
    #   max      → reasoning-max
    #   (unrecognized → reasoning-max; totality clause — never under-reason)
    #
    # Coding-max override (z.ai "reasoning_effort: max for coding tasks"):
    #   manager-develop forces reasoning-max regardless of its collapse result.
    #
    # manager-git occupies the thinking-off tier (its effort is low across all
    # profile columns → CollapseClaudeEffortToGLM("low") = thinking-off).
    #
    # Wire state: the overlay is implemented and wired; live validation of z.ai
    # wire-effectiveness is pending.

    # Optional: override the statusline context window gauge per GLM model
    # (issue #653). Claude Code reports context_window_size based on the
    # Claude slot (Opus=1M, Sonnet/Haiku=200K) regardless of provider, so
    # the statusline over-reports headroom in GLM mode.
    #
    # Values are in tokens. Substring match: "glm-5.2" matches the high-slot id directly.
    # Set MOAI_STATUSLINE_CONTEXT_SIZE env for a one-shot override instead.
    # Reference (Z.AI official docs):
    #   glm-5.2     : 1000000 context / 131072 max output
    #   glm-4.7     : 202752 context (per OpenRouter mirror)
    #   glm-4.5-air : 128000 context
    # context_windows:
    #   glm-5.2: 1000000
    #   glm-4.7: 202752
    #   glm-4.5-air: 128000
