llm:
  mode: ""
  team_mode: ""
  glm_env_var: "GLM_API_KEY"

  # Per-agent model+effort profile selection (set once during init/update).
  # Selects the active column of the profile matrix below for all sub-agents.
  #   high   - quality-first column (top)
  #   medium - balanced default column
  #   low    - economical column
  # Absent or empty resolves to medium (backward compatible). The superseded
  # top-column name "max" is still READ as an alias for "high", but is never
  # written back.
  #
  # Under a GLM backend (team_mode: glm/cg), z.ai exposes a 3-level
  # reasoning_effort control (low/high/max; GLM-5.3 reasons ALWAYS — thinking
  # cannot be disabled). The agent effort from the profile column above
  # collapses onto it:
  #   effort low          -> reasoning_effort=low (thinking enabled)
  #   effort medium/high  -> reasoning_effort=max
  #   effort xhigh/max    -> reasoning_effort=max
  # So under GLM, every profile column's efforts above "low" converge on
  # reasoning_effort=max; only "low" stays at the low level. The
  # code-producing run-phase agent runs at reasoning_effort=max regardless
  # (coding-task recommendation).
  profile: "medium"

  # Legacy performance tier (read-time alias only — `profile` supersedes it).
  # Retained so the separate Tier x Phase routing axis keeps a tier source.
  # Now that the top column is named "high", this axis shares the profile
  # vocabulary exactly, so no projection is applied (a legacy "max" folds to
  # "high"). Options: high, medium, low.
  performance_tier: "medium"

  # Profile matrix (transparency + editability). Each profile column maps each
  # retained agent NAME to a {model, effort} pair — 11 agents x 3 columns = 33
  # cells. The Go default (template.DefaultProfileMatrix) is the authoritative
  # fallback for any cell absent here. Agents not listed (any user-added agent)
  # stay model: inherit and are never injected.
  #
  # Column intent (anchored on a long-horizon coding-agent benchmark measuring
  # score, cost per task, output tokens, and agent steps at every effort level,
  # then overridden by the phase-weighted policy below):
  #   high   - quality first. `max` is reserved for the two rare-but-
  #            decision-critical rows (run implementation, escalation advisor).
  #   medium - the working default. NOT the cost-minimal derivation: the
  #            benchmark anchor put manager-develop at `medium` and derived the
  #            rest from it, but the phase-weighted policy departs from that knee
  #            deliberately — run (manager-develop) and review (sync-auditor)
  #            take `high`, plan (manager-spec, plan-auditor) steps down to
  #            `high`, and sync (manager-docs) steps down to `low`. Do not
  #            re-derive back onto the anchor.
  #   low    - economical. Opus `low` still outscores Sonnet at any effort and
  #            costs less per task, so it is the floor for agentic rows.
  #
  # Two model rules the matrix encodes:
  #   - Opus is the model for every multi-turn agentic row. Sonnet needs a
  #     multiple of the agent steps and output tokens to finish the same
  #     long-horizon task, so it costs MORE per task despite the lower unit
  #     token price. Completion efficiency dominates unit price.
  #   - Sonnet is retained only for single-shot, input-dominated, non-agentic
  #     rows (Explore search, manager-git mechanics), where that multi-step
  #     failure does not apply and the lower input price does.
  #
  # `xhigh` is absent from the matrix on purpose: on Opus it scores the same as
  # `high` at materially higher cost, so it is strictly dominated. `max` is the
  # only level above `high`, so a row wanting more than `high` takes `max`.
  #
  # Under a GLM backend these cells are NOT what reaches the wire: z.ai's 3-state
  # reasoning control collapses {medium, high} onto one state and {xhigh, max}
  # onto another, but the delivery channel is session-global — one
  # ANTHROPIC_REASONING_EFFORT value per session, never a per-agent one. These
  # cells record per-agent intent and take effect on Claude-backed sessions,
  # where agent frontmatter carries the effort; they do not by themselves change
  # delivered GLM behavior.
  #
  # manager-git / Explore are profile-invariant.
  #
  # The model value is injected as a per-spawn runtime arg ([1m]-safe). The
  # effort value reaches the agent through its frontmatter `effort:` (the Agent
  # tool has no effort parameter) or through Workflow `opts.effort`. Explore has
  # no agent file, so its effort is stated at call time, never persisted.
  profiles:
    high:
      manager-spec:    { model: opus,   effort: high }
      plan-auditor:    { model: opus,   effort: high }
      sync-auditor:    { model: opus,   effort: high }
      manager-develop: { model: opus,   effort: max }
      super-advisor:   { model: opus,   effort: max }
      manager-design:  { model: opus,   effort: high }
      builder-harness: { model: opus,   effort: high }
      e2e-tester:      { model: opus,   effort: medium }
      manager-docs:    { model: opus,   effort: low }
      manager-git:     { model: sonnet, effort: low }
      Explore:         { model: sonnet, effort: low }
    medium:
      manager-spec:    { model: opus,   effort: high }
      plan-auditor:    { model: opus,   effort: high }
      sync-auditor:    { model: opus,   effort: high }
      manager-develop: { model: opus,   effort: high }
      super-advisor:   { model: opus,   effort: high }
      manager-design:  { model: opus,   effort: medium }
      builder-harness: { model: opus,   effort: medium }
      e2e-tester:      { model: opus,   effort: low }
      manager-docs:    { model: opus,   effort: low }
      manager-git:     { model: sonnet, effort: low }
      Explore:         { model: sonnet, effort: low }
    low:
      manager-spec:    { model: opus,   effort: low }
      plan-auditor:    { model: opus,   effort: low }
      sync-auditor:    { model: opus,   effort: low }
      manager-develop: { model: opus,   effort: low }
      super-advisor:   { model: opus,   effort: medium }
      manager-design:  { model: opus,   effort: low }
      builder-harness: { model: opus,   effort: low }
      e2e-tester:      { model: sonnet, effort: low }
      manager-docs:    { model: sonnet, effort: low }
      manager-git:     { model: sonnet, effort: low }
      Explore:         { model: sonnet, effort: low }

  # Harness-generation model+effort map, consumed by /moai:harness when it
  # generates a specialist agent. Keyed profile -> purpose class -> { effort }.
  #
  # Harness agents are MODEL-UNIFORM on purpose: they are persistent, user-owned
  # specialists whose differentiation is reasoning DEPTH, not model tier, so the
  # effort axis alone separates them. The model is always `opus` — a `model:`
  # value written here is ignored. Pinning is safe because every current
  # non-haiku model carries a 1M context window, so an explicit pin no longer
  # loses the 1M entitlement that inherit-by-default used to preserve.
  #
  # The purpose classes are the same 7 names as the `workflow_agents` taxonomy in
  # workflow.yaml, so the two surfaces share one vocabulary. Each effort is
  # derived from the profile-matrix row named in the comment; an absent cell
  # falls through to that row's effort.
  #
  # Keep these cells equal to the row they name. The resolver reads a cell here
  # FIRST and only falls through to the row when the cell is absent, so a stale
  # cell silently splits the two paths: a project carrying this file would get
  # the stale value while one without it got the row's current value.
  harness_agents:
    high:
      read-only-extract:    { effort: low }     # <- Explore row
      mechanical-transform: { effort: low }     # <- manager-git row
      synthesize:           { effort: low }     # <- manager-docs row
      research:             { effort: high }    # <- plan-auditor row
      verify-judge:         { effort: high }    # <- sync-auditor row
      implement:            { effort: max }     # <- manager-develop row
      design-architecture:  { effort: high }    # <- manager-design row
    medium:
      read-only-extract:    { effort: low }
      mechanical-transform: { effort: low }
      synthesize:           { effort: low }
      research:             { effort: high }
      verify-judge:         { effort: high }
      implement:            { effort: high }
      design-architecture:  { effort: medium }
    low:
      read-only-extract:    { effort: low }
      mechanical-transform: { effort: low }
      synthesize:           { effort: low }
      research:             { effort: low }
      verify-judge:         { effort: low }
      implement:            { effort: low }
      design-architecture:  { effort: low }

  # Optional per-agent overrides, keyed by canonical agent name. Each override
  # {model, effort} pair wins over the active profile's cell for that agent.
  # Example (uncomment + edit to pin an agent):
  #   agent_overrides:
  #     manager-develop: { model: opus, effort: xhigh }
  agent_overrides: {}

  # GLM backend configuration
  glm:
    base_url: "https://api.z.ai/api/anthropic"
    models:
      high: "glm-5.3"         # 1M context — Opus slot (main session + inherit agents)
      medium: "glm-5.3"       # 1M context — Sonnet slot (balanced)
      low: "glm-5.3"          # 1M context — Haiku slot (lightweight)
      fable: "glm-5.3"        # 1M context — Fable tier (ANTHROPIC_DEFAULT_FABLE_MODEL)

    # ── GLM reasoning-effort mapping (documentation-only — the Go overlay at
    #    internal/template/glm_effort_overlay.go is the runtime SSOT) ──
    #
    # z.ai does NOT implement Claude's 5-level effort vocabulary. GLM-5.3 reasons
    # ALWAYS — disabling reasoning is no longer supported, and a request that
    # asks for it fails — so the control is a single 3-level reasoning_effort:
    #
    #   low     thinking=enabled, reasoning_effort=low    ← Claude low
    #   high    thinking=enabled, reasoning_effort=high   ← legal wire value; no
    #                                                      Claude effort maps here
    #   max     thinking=enabled, reasoning_effort=max    ← Claude medium/high/
    #                                                      xhigh/max (omit-default)
    #
    # Collapse table (5 Claude levels → 2 reachable GLM levels):
    #   low      → low
    #   medium   → max
    #   high     → max
    #   xhigh    → max
    #   max      → max
    #   (unrecognized → max; totality clause — never under-reason)
    #
    # The `high` level stays a legal wire value and a selectable stored state
    # (settings widget), but no Claude effort collapses to it — every effort
    # above low converges on max.
    #
    # Coding-max override (z.ai "reasoning_effort: max for coding tasks"):
    #   manager-develop forces max regardless of its collapse result.
    #
    # manager-git occupies the low tier (its effort is low across all profile
    # columns → CollapseClaudeEffortToGLM("low") = low).
    #
    # Wire state: the overlay is implemented and wired. Measured against the
    # z.ai Anthropic-compat shim: the Anthropic `thinking` parameter is honored
    # (depth scales with the budget); a top-level z.ai-style reasoning_effort
    # field is ignored — the env reaches z.ai through the thinking-budget
    # mapping, not a native reasoning_effort passthrough. This block is
    # documentation-only; no code reads it at runtime.

    # Optional: override the statusline context window gauge per GLM model.
    # Claude Code reports context_window_size based on the
    # Claude slot (Opus=1M, Sonnet/Haiku=200K) regardless of provider, so
    # the statusline over-reports headroom in GLM mode.
    #
    # Values are in tokens. Substring match: "glm-5.3" matches the high-slot id directly.
    # Set MOAI_STATUSLINE_CONTEXT_SIZE env for a one-shot override instead.
    # Reference (Z.AI official docs):
    #   glm-5.3     : 1000000 context
    #   glm-4.7     : 202752 context (per OpenRouter mirror)
    #   glm-4.5-air : 128000 context
    # context_windows:
    #   glm-5.3: 1000000
    #   glm-4.7: 202752
    #   glm-4.5-air: 128000
