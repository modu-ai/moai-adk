    fetched: "2026-10-29"
    status: uncollated
    provenance: scratchpad-webfetch-summary
    note: The documented minimum pause between POST, PATCH, PUT and DELETE requests. A smaller configured value is rejected, not raised.

  - key: workflow.agentic_factory.github.rate_limit.secondary_unclassified_min_wait_seconds
    provider: github
    type: integer
    min: 60
    default: 60
    unit: seconds
    on_out_of_range: reject
    when_unresolved: UNKNOWN
    source_urls:
