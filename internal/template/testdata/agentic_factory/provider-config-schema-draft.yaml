      - https://docs.github.com/en/rest/using-the-rest-api/rate-limits-for-the-rest-api
    fetched: "2026-10-29"
    status: uncollated
    provenance: scratchpad-webfetch-summary
    note: Minimum wait when a rate-limit refusal carries neither a retry-after nor an exhausted x-ratelimit-remaining header. A smaller configured value is rejected.

