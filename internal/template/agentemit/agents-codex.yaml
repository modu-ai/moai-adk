# agents-codex.yaml — Codex mapping manifest for the agent dual-publication
# emitter (the neutral layer's Codex half; the .md files are the other half).
#
# Build input only: this file lives in the emitter package, NOT under
# templates/, and is never distributed to user projects.
#
# Codex-behavior facts herein are measured against codex-cli (M0/t91 report);
# the manifest records the measured version so a future upgrade knows which
# probe run to repeat. Fields whose value set is not probe-confirmed ship
# omitted (ship-omitted rule) — never guessed, because codex silently ignores
# unknown values (t91 section 1).

# codex-cli version the field semantics below were measured against.
codex_measured_version: "0.147.0"

# Where emitted agent TOMLs live under the project .codex/agents/ root.
# P-04 MEASURED (codex-cli 0.147.0): .codex/agents/ DOES scan subdirectories
# (a probe agent at agents/moai/x.toml registered and delegated) — the
# subdirectory layout is confirmed, flat + moai- prefix stays the fallback.
layout:
  mode: subdirectory
  subdirectory: moai
  flat_prefix: "moai-"

# Optional-field emission switches. A false switch means the field is omitted
# from every emitted TOML (Codex default inheritance).
fields:
  # model: omitted on all 11 agents in v1 (R-011). P-03 MEASURED (codex-cli
  # 0.147.0): an omitted model key registers and delegates (inherits the
  # subagent default); an arbitrary bogus model string is silently accepted
  # at parse — emitting a Claude alias would be accepted-but-wrong, so
  # omission is the only safe choice. Re-confirmed and strengthened on
  # codex-cli 0.153.4: the agent-file model is precedence-winning over BOTH
  # the parent default and the [agents] table default (tag-pinned docs;
  # agent_role_config.rs flattens ConfigToml per-role), so an emitted pin
  # becomes a dual-source hazard; valid model ids are never enumerated and
  # churn per release (0.153.4 adds "Astra", #42874); and open-bug #32587
  # shows the documented precedence is itself unstable (desktop app ignores
  # the agent-file model). Flipping fields.model.emit today is inert:
  # renderTOML (writer.go:87-155) has no model branch and the validator
  # (manifest.go:126-137) ignores unknown fields keys — a real flip = a new
  # writer branch + validator work + the AC-009 no-model golden inversion.
  # manager-git's "sonnet" pin is a documented drop below.
  model:
    emit: false
  # model_reasoning_effort: identity mapping, P-02 MEASURED (codex-cli
  # 0.147.0): all four values registered as agents AND belong to the binary's
  # reasoning-effort enum {minimal, low, medium, high, xhigh}. Unmapped source
  # effort fails emission (never a silent downgrade).
  model_reasoning_effort:
    emit: true
    map:
      low: low
      medium: medium
      high: high
      xhigh: xhigh
  # sandbox_mode: P-01 MEASURED (codex-cli 0.147.0): the runtime names the
  # accepted set verbatim on a bad value — "expected one of `read-only`,
  # `workspace-write`, `danger-full-access`" — and a bad value makes codex
  # drop the whole agent file (visible "Ignoring malformed agent role
  # definition" error). workspace-write is a measured member and
  # delegation-confirmed; a read-only sandbox would break the go-test-style
  # verification work the agent bodies mandate, so it ships for all 11.
  sandbox_mode:
    emit: true
    value: workspace-write
    accepted_values:
      - read-only
      - workspace-write
      - danger-full-access

# Semantic-class mapping for Claude tool tokens (R-007: every token appearing
# in any agent tools CSV must belong to a mapped class or emission fails).
# The key "mcp__moai__" (trailing underscores) is a PREFIX rule: any token
# starting with it maps to class moai-mcp (server-level grant, R-009).
tool_classes:
  Read: file-read
  Grep: file-read
  Glob: file-read
  Write: file-write
  Edit: file-write
  Bash: shell
  WebFetch: web
  WebSearch: web
  TaskCreate: task-list
  TaskUpdate: task-list
  TaskList: task-list
  TaskGet: task-list
  Skill: skill-loader
  Agent: subagent-spawn
  DesignSync: design-sync
  SendMessage: cross-session-messaging
  ListAgents: cross-session-messaging
  AskUserQuestion: question-channel
  mcp__moai__: moai-mcp

# Per-class dispositions — every semantic class carries exactly one, with
# rationale (AC-013: no silent discard).
classes:
  - class: file-read
    disposition: no-field
    rationale: >-
      Codex exposes built-in file read; no agent-TOML field exists or is
      needed. Access level is a sandbox_mode consequence.
  - class: file-write
    disposition: documented-drop
    rationale: >-
      The Read-vs-Write tool distinction is not mechanically preserved on
      Codex: its sandbox is workspace-level, not tool-level. Body prose
      already disciplines write behavior.
  - class: shell
    disposition: consequence
    rationale: >-
      Shell executes built-in on Codex. A read-only sandbox would break the
      go-test-style verification work the agent bodies mandate, so the
      P-01-measured member workspace-write ships via the sandbox_mode field
      (see fields.sandbox_mode).
  - class: web
    disposition: documented-drop
    rationale: >-
      No per-agent web field exists; web access is a global Codex
      feature/config outside agent TOML.
  - class: task-list
    disposition: documented-drop
    rationale: >-
      The Claude task-tool family has no known Codex equivalent; body prose
      degrades gracefully (workflows fall back to prose reporting).
  - class: skill-loader
    disposition: documented-drop
    rationale: >-
      Refreshed on codex-cli 0.153.4 (tag-pinned skills_config.rs): the
      per-role SkillConfig shape is {path?, name?, enabled} — an
      enable/disable OVERRIDE of already-discovered skills, not a grant —
      and enabled is required (t504 MEASURED at global scope: a missing
      enabled hard-fails every codex invocation, rc=1). t505 probes P4-P7
      MEASURED (0.153.4, isolated CODEX_HOME, zero model calls): an
      agent-TOML model, a bogus model, and skills.config both with and
      without enabled are ALL silent on codex debug prompt-input +
      doctor --json, so the value set stays unobservable and the
      ship-omitted rule still applies under either reading ("not read" vs
      "read leniently"). Measured on codex-cli 0.152.1 (retained finding,
      t452 m2-verdict.md:142): an agent-role skills key is not
      observable at all on the non-interactive path, so the ship-omitted rule
      applies and no skills field is emitted. Probes ran in an isolated /tmp
      project with an isolated CODEX_HOME. codex debug prompt-input renders
      the skill roots table but never the project agent roles; a session
      asked to print the spawn_agent tool schema returned one carrying no
      role-selection parameter; and two controls placed in turn at
      .codex/agents/moai/ and at .codex/agents/ — a known-bad sandbox_mode,
      the field this manifest records as producing a visible "Ignoring
      malformed agent role definition" on the earlier measured version, and a
      syntactically invalid TOML — both left codex exec silent at exit 0. A
      parser cannot silently accept invalid TOML, so the project agent-role
      directory is unread on that path and the value set is unobservable
      rather than merely unconfirmed. Session skill loading itself IS
      confirmed on this version (the roots table lists the project
      .agents/skills), so this drop is about the per-agent grant, not about
      skills reaching a session. Re-probe when an observable agent-role
      surface exists; the top-level codex_measured_version deliberately still
      names the earlier version, which is the one the fields above were
      measured against.
  - class: subagent-spawn
    disposition: documented-drop
    rationale: >-
      Codex delegation exists (internal collaboration* tools) but a per-agent
      spawn grant is not expressible in agent TOML; lead semantics survive in
      body prose and the internal tool names have low version stability.
  - class: design-sync
    disposition: documented-drop
    rationale: >-
      DesignSync is a Claude-specific MCP-backed tool with no Codex
      equivalent.
  - class: cross-session-messaging
    disposition: documented-drop
    rationale: >-
      SendMessage/ListAgents are Claude Code runtime session tools with no
      agent-TOML carrier on Codex. The Codex counterpart rides the moai MCP
      broker (session_msg_register/list/send/poll) under the existing
      server-level moai-mcp grant — manager-lead already carries
      mcp__moai__* tokens, so its TOML grants the server; the deputy's
      cross-session messaging doctrine lives in the agent body prose.
  - class: question-channel
    disposition: documented-drop
    rationale: >-
      Covers the Claude question channel: the AskUserQuestion tool and any
      future tokens naming that channel. Measured on codex-cli 0.150.1 probes:
      told to invoke the question tool, codex reported it unavailable and
      substituted a prose question; its own request_user_input tool errors
      "unavailable in Default mode" under the approval-never mode the project
      launcher runs. No per-agent agent-TOML carrier exists; the AGENTS.md
      capability-binding table directs the substitute behavior — return a
      blocker report instead of asking the user directly.
  - class: moai-mcp
    disposition: emit-field
    field: mcp_servers
    rationale: >-
      Agents carrying any mcp__moai__* token declare the server-level grant
      as a TOML table [mcp_servers.moai] with command+args (R-009).
      RUN-PHASE MEASURED CORRECTION: codex-cli 0.147.0 rejects the array
      form mcp_servers = ["moai"] with "invalid type: sequence, expected a
      map", dropping the whole agent file; the table form (same shape t91
      section 5 measured for the global config) registers cleanly. See
      mcp_server_grant below. Per-tool filtering inside one MCP server is
      unavailable — documented drop; the body prose already names which
      tools each agent uses.
  - class: effort
    disposition: emit-field
    field: model_reasoning_effort
    rationale: >-
      effort frontmatter maps to model_reasoning_effort through the measured
      identity enumeration (P-02-confirmed); unmapped values fail emission.
  - class: model
    disposition: omit
    rationale: >-
      The model field is omitted for all 11 agents in v1 (R-011): a Claude
      alias is not a Codex model id, so emitting it would be a guess.
      codex-cli 0.153.4 strengthens the judgment: the agent-file model is
      precedence-winning over both the parent and [agents] defaults, valid
      model ids churn per release (#42874), and open-bug #32587 leaves the
      documented semantics unstable — see the fields.model comment above
      for the full evidence set.
  - class: frontmatter-hooks
    disposition: documented-drop
    rationale: >-
      Codex has no per-agent hooks surface; hooks are project-level
      .codex/hooks.json. M3 owns the adapter.
  - class: memory-color-permission
    disposition: documented-drop
    rationale: >-
      memory:, color:, and permissionMode: have no Codex equivalent;
      permission semantics live in sandbox_mode plus Codex approval policy,
      memory/color are UI/session state.
  - class: explore-builtin
    disposition: correspondence-note
    rationale: >-
      Explore is an Anthropic built-in with no .md in the template tree; it
      corresponds to Codex's built-in explorer and no file is emitted for it.

# Explicit documented drops with their owning rationale.
documented_drops:
  - id: model-pin-manager-git
    rationale: >-
      manager-git pins the Claude alias "sonnet"; a Claude alias is not a
      Codex model id. Its cost intent already travels via effort: low, so the
      TOML omits model entirely. codex-cli 0.153.4: a Codex-side pin would
      additionally be precedence-winning over both the parent and [agents]
      defaults (dual-source hazard) against per-release model-id churn
      (#42874) — see the fields.model comment above.
  - id: per-tool-mcp-filtering
    rationale: >-
      Codex exposes an MCP server's tools as a unit; restricting which of the
      21 moai tools an agent may call is not expressible per-agent. Coarse
      server-level grant recorded in class moai-mcp.
  - id: read-vs-write-distinction
    rationale: >-
      Codex sandbox is workspace-level; the granular Read/Write tool split
      cannot be preserved mechanically.
  - id: per-agent-web-grants
    rationale: >-
      Web access is global Codex config; per-agent WebFetch/WebSearch grants
      have no carrier.
  - id: task-tool-family
    rationale: >-
      TaskCreate/TaskUpdate/TaskList/TaskGet have no Codex equivalent.
  - id: per-agent-hooks
    rationale: >-
      Claude frontmatter hooks map to project-level .codex/hooks.json on
      Codex; the adapter is M3's scope.
  - id: memory-scopes-and-ui-metadata
    rationale: >-
      memory scope, color, and permissionMode are Claude session/UI state
      with no Codex equivalent.

  # Judgment record — the global [agents] config.toml table (t505; this is
  # the explicit t494 A1 overturn carrier). codex-cli 0.153.4 MEASURED
  # per-key type map (.moai/reports/t505/probe-01534.md; isolated
  # CODEX_HOME per cell, zero model calls; wrong-typed controls went red by
  # design, so the schema check is alive):
  #   enabled: bool, default true — emitting true is a no-op; false would
  #     un-register the 11 moai agents.
  #   max_threads: usize — legacy alias of max_concurrent_threads_per_session
  #     (both parse); no moai codex resource policy exists, and limits
  #     written into a user-editable config.toml are invasive.
  #   max_concurrent_threads_per_session: usize — same grounds.
  #   max_depth: source-only (V1-unstable surface); no moai policy to carry.
  #   default_subagent_model: string — a SECOND precedence-winning model
  #     source (dual-source hazard, same shape as fields.model) and
  #     session-global.
  #   default_subagent_reasoning_effort: string — no-op for moai: all 11
  #     agents already carry per-agent model_reasoning_effort via the P-02
  #     identity map, which overrides the global default.
  #   interrupt_message: BOOL, default true — the docs' name implies a
  #     message string; MEASURED docs-schema mismatch (string value rc=1
  #     "invalid type: string, expected a boolean"; bool value rc=0).
  #   job_max_runtime_seconds: no-op per the source.
  #   unknown flat keys: parsed as ROLE entries (struct AgentRoleToml,
  #     measured P3) — [agents] is both a settings table and a role
  #     registration map; a wrong-typed KNOWN key bricks codex startup
  #     rc=1 (measured P2/B3b/B6).
  #   [agents.<name>] {config_file, description}: role registration —
  #     redundant with .codex/agents/ auto-discovery (t91 P-04 MEASURED).
  # Overturn record: t494 candidate A1 (.moai/reports/t494/
  # codex-doc-survey.md:266, section 5(d)) recommended ADOPTING this table
  # (default_subagent_model / default_subagent_reasoning_effort /
  # max_concurrent_threads_per_session) on a documentation read that
  # PREDATES the measured type map and the dual-source semantics. That
  # recommendation is OVERTURNED on the measured evidence above: every key
  # A1 named fails the wire test. Never re-adopt silently; re-measure at
  # the deciding codex version first (the schema churns per release).
  - id: codex-global-agents-table
    rationale: >-
      The global [agents] config.toml table is NOT wired. Per-key judgment
      (codex-cli 0.153.4 type map in the comment block above): enabled is a
      no-op or, flipped, a de-registration hazard; the thread-cap keys
      would write limits into a user-editable file moai has no policy for;
      default_subagent_model is a second precedence-winning model source
      (dual-source hazard, session-global); default_subagent_reasoning_effort
      is a no-op against moai's per-agent effort keys; interrupt_message is
      a measured docs-schema mismatch (bool, not a message string). Parsing
      is strict — a wrong-typed known key bricks codex startup rc=1 — and
      unknown flat keys parse as role entries, not settings. Role
      registration ([agents.<name>]) is redundant with .codex/agents/
      auto-discovery (t91 P-04). Wiring would also add a third merge
      surface into .codex/config.toml (alongside EnsureMCPTable /
      EnsureStatusLine, internal/codexwiring/configtoml.go) with new
      idempotence obligations. This record EXPLICITLY OVERTURNS t494
      candidate A1 (codex-doc-survey.md:266), which recommended adopting
      the table on a documentation read predating the measured type map
      and the dual-source semantics.

# The server-level MCP grant emitted as a TOML table on every agent carrying
# mcp__moai__* tools. Shape measured on codex-cli 0.147.0 (the array form is
# rejected; an empty table fails transport validation — the grant must carry
# the full definition, matching t91 section 5's global-config registration).
mcp_server_grant:
  server: moai
  command: moai
  args:
    - mcp-server

# Correspondence notes (no artifact emitted either side).
correspondence_notes:
  - id: explore-builtin
    note: >-
      Explore is an Anthropic built-in (no .md in the template tree); Codex
      ships its own built-in explorer. No TOML is emitted for it.
