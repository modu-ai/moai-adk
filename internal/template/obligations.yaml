    check: TestLiveHookFaultOutcome
    ac: AC-HPR-008
  - id: compact-checkpoint-roundtrip
    required: true
    claude_path: moai hook compact
    codex_path: moai hook compact --harness codex
    check: TestCodexCompactCheckpointRoundTrip
    ac: AC-HPR-009
  - id: compact-live-fires
    required: true
    claude_path: moai hook post-compact
    codex_path: moai hook post-compact --harness codex
    check: TestLiveCodexCompactFires
    ac: AC-HPR-009
  - id: permission-request-deny
    required: true
    claude_path: moai hook permission-request
    codex_path: moai hook permission-request --harness codex
    check: TestCodexPermissionRequestDenyPreserved
    ac: AC-HPR-010
  - id: permission-request-live-fires
    required: true
    claude_path: moai hook permission-request
    codex_path: moai hook permission-request --harness codex
    check: TestLiveCodexPermissionRequestFires
    ac: AC-HPR-010
  - id: interrupt-cancellation
    required: true
    claude_path: "UNSUPPORTED:design.md §D6 — the Claude Stop hook does not fire on user interrupt, and IsInterrupt rides PostToolUseFailure (spec.md §F exclusion)"
    codex_path: moai hook interrupt --harness codex
    check: TestCodexInterruptRecordsCancellation
    ac: AC-HPR-011
  - id: interrupt-live-fires
    required: true
    claude_path: "UNSUPPORTED:design.md §D6 — no Claude-side interrupt producer"
    codex_path: moai hook interrupt --harness codex
    check: TestLiveCodexInterruptFires
    ac: AC-HPR-011

