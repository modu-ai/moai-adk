    codex_path: "unverified:spec.md §F — the SessionStart multi-handler chain is not composed on Codex"
    check: TestNonStopChainsRecordedUnverified
    ac: AC-HPR-018
  - id: chain-subagent-stop
    required: true
    claude_path: moai hook subagent-stop
    codex_path: "unverified:spec.md §F — the SubagentStop multi-handler chain is not composed on Codex"
    check: TestNonStopChainsRecordedUnverified
    ac: AC-HPR-018
  - id: chain-user-prompt-submit
    required: true
    claude_path: moai hook user-prompt-submit
    codex_path: "unverified:spec.md §F — the UserPromptSubmit multi-handler chain is not composed on Codex"
    check: TestNonStopChainsRecordedUnverified
    ac: AC-HPR-018

  # ── M1 standing-policy obligations (operator decision Q1) ─────────────
  - id: policy-standing-delivery
