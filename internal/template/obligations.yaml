# Dual-harness obligation registry (SPEC-DUAL-HARNESS-HOOK-PARITY-001 design.md §D4).
#
# One row per required behavior: where Claude applies it, where Codex applies
# it (a concrete path, or a marker — UNSUPPORTED:<evidence>, blocked:<reason>,
# unverified:<reason>), and the Go test that verifies it. The whole catalog is
# registered (operator decision Q1): M2 obligations, M1 standing-policy rows as
# blocked:M1, the Claude interrupt source as UNSUPPORTED, and the non-Stop
# multi-handler chains as unverified. A path is a `moai …` command (resolved
# against the registered cobra commands) or a template-relative file.
#
# CheckObligationCoverage (AC-HPR-018) requires every row to resolve;
# AggregateParityVerdict (AC-HPR-019) reads it with the go-test actions and the
# verdict records and is PASS only when every required row is effect-verified.

obligations:
  # ── Stop chain (AC-HOOK-01) ────────────────────────────────────────────
  - id: stop-chain-inventory
    required: true
    claude_path: .claude/settings.json.tmpl
    codex_path: moai hook stop --harness codex
    check: TestStopChainInventoryMatchesClaudeTemplate
    ac: AC-HPR-001
  - id: stop-member1-dispatch
    required: true
    claude_path: moai hook stop
    codex_path: moai hook stop --harness codex
    check: TestCodexStopHandlerRunsTheChain
    ac: AC-HPR-002
  - id: stop-member2-sync-gate
    required: true
    claude_path: .claude/hooks/moai/sync-phase-quality-gate.sh
    codex_path: moai verify sync-gate
    check: TestStopChainEffectParityGolden
    ac: AC-HPR-002
  - id: stop-member3-goal
    required: true
    claude_path: moai hook stop-goal
    codex_path: moai hook stop --harness codex
    check: TestCodexGoalContinueUntilMet
    ac: AC-HPR-012
  - id: stop-member4-security-turn
    required: true
    claude_path: moai hook security-turn
    codex_path: moai hook stop --harness codex
    check: TestStopChainAdvisoryFailureRecorded
    ac: AC-HPR-005
  - id: stop-member5-security-commit
    required: true
    claude_path: moai hook security-commit
    codex_path: moai hook stop --harness codex
    check: TestStopChainAdvisoryFailureRecorded
    ac: AC-HPR-005
  - id: stop-member6-codex-review-gate
    required: true
    claude_path: moai hook codex-review-gate
    codex_path: moai verify codex-review
    check: TestStopChainEffectParityGolden
    ac: AC-HPR-002
  - id: stop-member7-multi-review-gate
    required: true
    claude_path: moai hook multi-review-gate
    codex_path: moai hook stop --harness codex
    check: TestStopChainEffectParityGolden
    ac: AC-HPR-002
  - id: stop-member8-harness-observe
    required: true
    claude_path: moai hook harness-observe-stop
    codex_path: moai hook stop --harness codex
    check: TestStopChainAdvisoryFailureRecorded
    ac: AC-HPR-005
  - id: stop-chain-no-claude-dependency
    required: true
    claude_path: moai hook stop
    codex_path: moai hook stop --harness codex
    check: TestStopChainGPTProfileNoClaudeDependency
    ac: AC-HPR-003
  - id: stop-chain-live-continuation
    required: true
    claude_path: moai hook stop-goal
    codex_path: moai hook stop --harness codex
    check: TestLiveStopChainGoalContinuation
    ac: AC-HPR-004

  # ── Decision preservation and event adaptation (AC-HOOK-02) ───────────
  - id: decision-never-loosens
    required: true
    claude_path: moai hook pre-tool
    codex_path: moai hook pre-tool --harness codex
    check: TestDecisionTranslationNeverLoosens
    ac: AC-HPR-006
  - id: needs-input-live-outcome
    required: true
    claude_path: moai hook pre-tool
    codex_path: moai hook pre-tool --harness codex
