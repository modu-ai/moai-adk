  # ── Non-Stop multi-handler chains: excluded from this SPEC (spec.md §F) ──
  - id: chain-post-tool-use
    required: true
    claude_path: moai hook post-tool
    codex_path: "unverified:spec.md §F — the PostToolUse multi-handler chain is not composed on Codex"
