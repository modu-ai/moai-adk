    ac: AC-HPR-007
  - id: needs-input-visible-deny
    required: true
    claude_path: moai hook pre-tool
    codex_path: moai hook pre-tool --harness codex
    check: TestNeedsInputVisibleDeny
    ac: AC-HPR-022
  - id: hook-fault-fail-closed
    required: true
    claude_path: moai hook pre-tool
