# Test pair for the hardcoded-credential family (one rule variant per language
# under one id). The go branch is exercised here.
#
# The javascript/typescript branches do parse their literals in this pipeline;
# the python branch does not (single language selection over inline snippets --
# see the injection family note). Python-side credential detection keeps its
# end-to-end verification through the pre-write scan-corpus deny rows.
id: sec-hardcoded-credential
valid:
  - |
    token := os.Getenv("OPENAI_API_KEY")
invalid:
  - |
    bearer := "sk-proj-demo"
