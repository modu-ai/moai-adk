# Minimal stand-in CI workflow for the phantom fixture — publishes the LEGIT
# required name `Lint` (job display name) so that, once M2's publishability
# dimension exists, the fixture rejects ONLY the phantom context and every
# legit context resolves (P2-G / audit iter-2 P1-3).
name: CI
on:
  pull_request:
    branches: [main]
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - run: "true"
  # Publishes the second legit required context (`Test (ubuntu-latest)`) so
  # BOTH fixtures (phantom + phantom-control) can satisfy every legit required
  # name post-M2 and the ONLY tree difference stays the SSoT context value
  # (leader-sanctioned post-ceiling repair, P1-1).
  test-ubuntu:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - run: "true"
