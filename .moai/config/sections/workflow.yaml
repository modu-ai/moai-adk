workflow:
    # agentic_loop: pipeline-level completion-loop iteration ceiling, loaded by
    # internal/config AgenticLoopConfig (types.go) with default from
    # DefaultAgenticLoopMaxIterations (defaults.go); also prose-read by the
    # orchestrator for the moai.md Agentic Completion Loop termination clause.
    # DISTINCT from loop_prevention.max_iterations (per-operation diagnostic
    # fix-loop bound) — separate blocks, separate semantics.
    agentic_loop:
        max_iterations: 10
    auto_clear:
        after_plan: true
        after_run: false
        enabled: true
        token_threshold: 150000
    # audit pins (SPEC-V3R6-AUDIT-MODEL-PIN-001): project-committed model+effort
    # for the cross-model audit backends — audit entry points only (codex_audit /
    # glm_audit / audit_multi), never codex_task / glm_task. Precedence per
    # backend: this pin > llm.yaml sync-auditor SSOT cell > empty. codex effort
    # vocabulary low|medium|high|xhigh|max; glm effort = z.ai states low|high|max.
    audit:
        codex:
            model: gpt-5.6-sol
            effort: high
        glm:
            model: glm-5.3
            effort: max
    default_mode: ""
    execution_mode: auto
    # context_folding: manager-lead's per-milestone Context-Folding trigger policy
    # (SPEC-HIERARCHICAL-TEAM-001 REQ-FOLD-001 OQ-1 decision). The fold procedure
    # itself reuses existing primitives (/compact + .moai/state/verify/ redirect +
    # progress.md §E.2 fold row); this flag governs WHEN manager-lead fires it.
    # Values: auto | opt-in | off. `auto` fires at every Tier L milestone
    # boundary; `opt-in` (default) requires manager-lead to decide per milestone;
    # `off` disables folding entirely (Tier L runs fall back to /clear + handoff).
    context_folding: opt-in
    # Iteration-ceiling precedence: CLI --max flag > ralph.yaml loop.max_iterations
    # > workflow.yaml loop_prevention.max_iterations (this block — the lowest-
    # precedence documented ceiling surface for the diagnostic fix-loop). The
    # memory-safe 50-iteration checkpoint (loop workflow Step 2) is an orthogonal
    # memory-pressure safeguard, not a fourth ceiling.
    loop_prevention:
        failure_pattern_detection: true
        max_iterations: 100
        max_retries_per_operation: 3
    token_budget:
        plan: 30000
        run: 180000
        sync: 40000
    # workflow_agents: dynamic-workflow purpose taxonomy -> {model, effort}
    # DEFAULTS. This block is the SSOT for workflow agent() model/effort
    # defaults; per-script literals in .claude/workflows/*.js override it.
    # Values are validated against the closed sets: model in
    # {inherit, sonnet, opus}, effort in {low, medium, high, xhigh, max}.
    workflow_agents:
        read-only-extract: {model: sonnet, effort: low}
        mechanical-transform: {model: opus, effort: low}
        synthesize: {model: opus, effort: low}
        research: {model: opus, effort: medium}
        verify-judge: {model: opus, effort: medium}
        implement: {model: opus, effort: medium}
        design-architecture: {model: opus, effort: high}
    # model_routing: LEGACY flat block (Tier x Phase -> {model, effort}).
    # DEPRECATED — retained as a `medium` profile alias for one backward-compat
    # cycle (plan.md §D D6, SPEC-AGENT-ARCH-V2-001 M3b). Values mirror the
    # `medium` profile below. New code reads `model_routing_profiles` via
    # RouteModelFor(specTier, phase, perfTier); this flat key is NOT read by
    # the 3-arg accessor. Existing external readers continue to work.
    # Key format: <TIER>-<phase> where Tier in {S, M, L} and Phase in
    # {plan, run, sync, mx}. Closed sets: model in
    # {inherit, sonnet, opus, glm, fable}, effort in {low, medium, high, xhigh, max}.
    model_routing:
        S-plan: {model: opus, effort: low}
        S-run: {model: opus, effort: medium}
        S-sync: {model: opus, effort: low}
        S-mx: {model: sonnet, effort: low}
        M-plan: {model: opus, effort: medium}
        M-run: {model: opus, effort: medium}
        M-sync: {model: opus, effort: low}
        M-mx: {model: sonnet, effort: low}
        L-plan: {model: opus, effort: high}
        L-run: {model: opus, effort: medium}
        L-sync: {model: opus, effort: medium}
        L-mx: {model: sonnet, effort: low}
    # model_routing_profiles: No-Haiku 3-tier policy (SPEC-AGENT-ARCH-V2-001
    # M3, design.md §D.5) — perfTier -> (Tier x Phase) -> {model, effort}.
    # 3 perfTiers (high/medium/low) × 12 cells (S/M/L × plan/run/sync/mx) = 36
    # entries. The orchestrator consults RouteModelFor(specTier, phase,
    # perfTier) at spawn time. `medium` is the default performance tier
    # (populated by `moai init --model-policy`). Closed sets: model in
    # {inherit, sonnet, opus, glm, fable}, effort in {low, medium, high, xhigh, max}.
    model_routing_profiles:
        high:
            S-plan: {model: opus, effort: medium}
            S-run: {model: opus, effort: high}
            S-sync: {model: opus, effort: low}
            S-mx: {model: sonnet, effort: low}
            M-plan: {model: opus, effort: high}
            M-run: {model: opus, effort: high}
            M-sync: {model: opus, effort: medium}
            M-mx: {model: sonnet, effort: low}
            L-plan: {model: opus, effort: high}
            L-run: {model: opus, effort: max}
            L-sync: {model: opus, effort: medium}
            L-mx: {model: sonnet, effort: low}
        medium:
            S-plan: {model: opus, effort: low}
            S-run: {model: opus, effort: medium}
            S-sync: {model: opus, effort: low}
            S-mx: {model: sonnet, effort: low}
            M-plan: {model: opus, effort: medium}
            M-run: {model: opus, effort: medium}
            M-sync: {model: opus, effort: low}
            M-mx: {model: sonnet, effort: low}
            L-plan: {model: opus, effort: high}
            L-run: {model: opus, effort: medium}
            L-sync: {model: opus, effort: medium}
            L-mx: {model: sonnet, effort: low}
        low:
            S-plan: {model: opus, effort: low}
            S-run: {model: opus, effort: low}
            S-sync: {model: sonnet, effort: low}
            S-mx: {model: sonnet, effort: low}
            M-plan: {model: opus, effort: low}
            M-run: {model: opus, effort: low}
            M-sync: {model: sonnet, effort: low}
            M-mx: {model: sonnet, effort: low}
            L-plan: {model: opus, effort: low}
            L-run: {model: opus, effort: medium}
            L-sync: {model: sonnet, effort: low}
            L-mx: {model: sonnet, effort: low}
    # project.continuation: /moai project Phase 14 완료 분기.
    # none | card | pipeline. 부재도 미매칭도 card 로 해석되며, 미매칭 값은
    # 완료 보고에 그대로 인용된다(런은 멈추지 않는다).
    project:
        continuation: card
    worktree:
        # 2026-05-22: auto_create false (user policy feedback_worktree_autonomous 정렬).
        # L1 worktree는 Claude Code runtime autonomous — MoAI orchestrator는 자동 생성 안함.
        # auto_merge 유지 (사용자 수동 worktree 생성 시에만 자동 머지).
        #
        # auto_cleanup: true → false (SPEC-WORKTREE-REAPER-001 M1 착지 조건).
        # M1이 gh no-answer 경로에서 git fallback을 되살리면서, 이 저장소의
        # 병합된 워크트리 ~98개가 `moai session list` 한 번에 제거 대상이 된다.
        # 그 일괄 삭제는 SPEC §G에서 범위 밖으로 선언돼 있으므로, 첫 스윕은
        # `moai session list`의 부수효과가 아니라 의도된 행위여야 한다.
        # 재활성화는 제거 예정 트리를 먼저 열거한 뒤 운영자가 판단할 것
        # (acceptance.md AC-WR-023(b)).
        auto_cleanup: false
        auto_create: false
        auto_merge: true
        session_name_pattern: moai-{ProjectName}-{SPEC-ID}
        tmux_preferred: true
    # branch_guard: primary checkout protection against branch-state mutations
    # (git switch, checkout, reset --hard, stash, rebase). Local opt-in for
    # multi-session shared checkouts; shipped default-false in template
    # (internal/config/defaults.go enforces this). The manager-git agent is
    # exempt via agent identity, allowing it to create worktrees even when
    # the guard is active.
    branch_guard:
        enabled: true
    # agent_stop_guard: SendMessage deny layer against revival of stopped
    # teammates (TaskStop does not reclaim the name address; one message
    # resumes a stopped agent from its transcript). Recording + observation +
    # advisory always run regardless of this flag; this local opt-in enables
    # the deny layer for dogfood. Shipped default-false in template
    # (internal/config/defaults.go enforces this).
    agent_stop_guard:
        enabled: true
