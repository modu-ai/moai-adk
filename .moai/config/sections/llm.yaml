llm:
    mode: ""
    team_mode: ""
    glm_env_var: GLM_API_KEY
    profile: medium
    performance_tier: medium
    profiles:
        max:
            spec_auditors: { model: fable, effort: medium }
            develop: { model: fable, effort: low }
            advisor: { model: fable, effort: medium }
            design_harness_e2e: { model: opus, effort: high }
            docs: { model: sonnet, effort: medium }
            git: { model: sonnet, effort: low }
        medium:
            spec_auditors: { model: opus, effort: high }
            develop: { model: opus, effort: high }
            advisor: { model: fable, effort: low }
            design_harness_e2e: { model: opus, effort: medium }
            docs: { model: sonnet, effort: medium }
            git: { model: sonnet, effort: low }
        low:
            spec_auditors: { model: opus, effort: low }
            develop: { model: opus, effort: medium }
            advisor: { model: opus, effort: high }
            design_harness_e2e: { model: opus, effort: low }
            docs: { model: sonnet, effort: medium }
            git: { model: sonnet, effort: low }
    agent_overrides: {}
    glm:
        base_url: https://api.z.ai/api/anthropic
        models:
            high: glm-5.2
            medium: glm-4.7
            low: glm-4.5-air
            fable: glm-5.2
            opus: glm-5.2
            sonnet: glm-4.7
            haiku: glm-4.5-air
    default_model: ""
    quality_model: ""
    speed_model: ""
