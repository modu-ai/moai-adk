# Ralph Engine Settings
# Automated feedback loop with LSP diagnostics and AST-grep integration.
#
# Every key below maps to a RalphConfig struct field read by Go code:
#   - max_iterations  → RalphConfig.MaxIterations     (internal/cli/deps.go, loop.NewLoopController ceiling)
#   - auto_converge   → RalphConfig.AutoConverge       (internal/ralph/engine.go Decide stagnation detection)
#   - human_review    → RalphConfig.HumanReview        (internal/ralph/engine.go Decide review breakpoint)
#   - lint_as_instruction → RalphConfig.LintAsInstruction (internal/hook/post_tool.go, inject errors as instruction)
#   - warn_as_instruction → RalphConfig.WarnAsInstruction (internal/hook/post_tool.go, inject warnings as instruction)
#
# LSP bridge configuration lives in lsp.yaml (gopls); AST-grep gate configuration
# lives in gate.yaml. The former ralph.lsp.* / ralph.ast_grep.* / ralph.loop.* /
# ralph.hooks.* / ralph.enabled blocks were inert (the non-strict loader silently
# ignored them) and have been removed so this file is an honest contract between
# user intent and engine behavior.

ralph:
  # Maximum number of feedback loop iterations. Compiled default: 5.
  # Iteration-ceiling precedence: CLI --max flag > this key > workflow.yaml loop_prevention.max_iterations.
  max_iterations: 5

  # When true, the engine auto-converges on stagnation instead of spinning iterations.
  # Compiled default: true.
  auto_converge: true

  # When true, the engine breaks for human review at the review phase.
  # Compiled default: true.
  human_review: true

  # Inject LSP diagnostics as systemMessage so the AI receives errors as its next prompt.
  # Default: true.
  lint_as_instruction: true

  # Include warnings in the systemMessage when there are no errors.
  # Default: false (errors only).
  warn_as_instruction: false
