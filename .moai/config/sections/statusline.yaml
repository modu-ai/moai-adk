statusline:
  # Theme — exactly 2 themes exist: catppuccin-mocha (seeded) | catppuccin-latte
  theme: "catppuccin-mocha"

  # Forge opt-out for THIS repo (SPEC-STATUSLINE-PROFILE-RESPECT-001 M7,
  # t293): stops both the forge-pair render and the detached refresh child.
  # OPERATIONAL AND KNOWINGLY EPHEMERAL — this file lives under the
  # template-managed .moai/config root, which `moai update`
  # (CleanMoaiManagedPaths) wipes and re-deploys, so this hand-added key
  # silently vanishes on the next update (CLAUDE.local.md §2.3). Deliberately
  # NOT mirrored to internal/template/templates/ (template neutrality).
  forge: "none"

  # Individual segment toggles — the only runtime lever.
  # All 16 segments default-on; graceful no-output handles inactive states.
  segments:
    # Line 1: model + version + session metadata
    model: true
    context: true
    output_style: true
    claude_version: true
    moai_version: true
    session_time: true
    effort_thinking: true
    # Cache-read-vs-cache-creation hit ratio indicator (early-warning of
    # prompt-prefix churn). Config-toggleable; set false to hide.
    cache_hit: true
    # Line 2: context window + API usage bars
    usage_5h: true
    usage_7d: true
    # Line 3: directory + git + workflow + PR
    directory: true
    git_status: true
    git_branch: true
    worktree: true
    # Task segment — active SPEC workflow info. Renders as
    # "📋 [<command> <SPEC-ID>-<stage>]" only when
    # ~/.moai/state/last-session-state.json `active_task` is set.
    task: true
    # PR segment — renders as "#<number> ⌥<review_state>" only when stdin
    # JSON includes a pr.* object.
    pr: true
