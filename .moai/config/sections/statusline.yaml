statusline:
  # Theme — exactly 2 themes exist: catppuccin-mocha (seeded) | catppuccin-latte
  theme: "catppuccin-mocha"
  # Which hosting service the `github` segment counts open work against.
  # Leave unset to decide from the origin remote's host: github.com selects
  # `gh`, gitlab.com selects `glab`. A self-hosted instance carries no signal
  # in its name, so set this explicitly there.
  #   github | gitlab | none
  # An unrecognised value renders nothing rather than falling back to
  # detection, so a typo shows as an absent segment instead of a wrong count.
  # forge: gitlab

  # Individual segment toggles — the only runtime lever.
  # All 16 segments default-on; graceful no-output handles inactive states.
  segments:
    # Line 1: model + version + session metadata
    model: true
    context: true
    output_style: true
    claude_version: true
    moai_version: true
    session_time: true
    effort_thinking: true
    # Cache-read-vs-cache-creation hit ratio indicator (early-warning of
    # prompt-prefix churn). Config-toggleable; set false to hide.
    cache_hit: true
    # Line 2: context window + API usage bars
    usage_5h: true
    usage_7d: true
    # Line 3: directory + git + workflow + PR
    directory: true
    git_status: true
    git_branch: true
    worktree: true
    # Task segment — active SPEC workflow info. Renders as
    # "📋 [<command> <SPEC-ID>-<stage>]" only when
    # ~/.moai/state/last-session-state.json `active_task` is set.
    task: true
    # PR segment — renders as "#<number> ⌥<review_state>" only when stdin
    # JSON includes a pr.* object.
    pr: true
