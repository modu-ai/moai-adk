# DORMANT: this config is typed and loaded, but no runtime hot path enforces these
# conditions yet. The Go loader emits a once-per-session DORMANT notice. Preserved for
# forward compatibility; behavioral enforcement awaits an activation SPEC.
sunset:
    conditions:
        - action: advisor
          description: Switch to advisory mode after 50 consecutive passes
          gate: vet
          metric: consecutive_passes
          threshold: 50
        - action: advisor
          description: Switch to advisory mode after 30 consecutive passes
          gate: lint
          metric: consecutive_passes
          threshold: 30
        - action: advisor
          description: Switch to advisory mode after 20 consecutive passes (never fully remove)
          gate: test
          metric: consecutive_passes
          threshold: 20
    enabled: true
