# MoAI label list for a project that uses MoAI's Issue forms.
# Every label an Issue form sets is in this list: GitHub drops a form label that does not
# exist in the repository, so create these labels before the forms are used.
#
# Axes an Issue carries:
#   type:*      exactly one (the form sets it)
#   priority:*  exactly one (P0..P3)
#   area:*      one or more, defined by the project itself (no area is seeded here)
#   host:*      when the work must be verified on that host
#   needs:decision  a user decision is pending; work waits for it
# Status is never a label: it lives in the Issue's own report comment. Parent tracking uses
# native sub-issues and ordering uses native issue dependencies, not labels.
schema_version: 2
labels:
- name: type:feature
  color: a2eeef
  description: New feature or behaviour
- name: type:fix
  color: d73a4a
  description: Defect fix
- name: type:docs
  color: 0075ca
  description: Documentation only
- name: type:chore
  color: ededed
  description: Maintenance with no behaviour change
- name: type:ci
  color: 5319e7
  description: CI and release automation
- name: type:test
  color: bfd4f2
  description: Tests only
- name: type:refactor
  color: c5def5
  description: Restructure with no behaviour change
- name: type:design
  color: f9d0c4
  description: Investigation or design before implementation
- name: priority:P0
  color: b60205
  description: Blocks the current release
- name: priority:P1
  color: d93f0b
  description: Needed for the current release
- name: priority:P2
  color: fbca04
  description: Planned, can move to the next release
- name: priority:P3
  color: c2e0c6
  description: Nice to have
- name: host:claude
  color: d4a5ff
  description: Must be verified on Claude Code
- name: host:codex
  color: 74d2ff
  description: Must be verified on Codex
- name: needs:decision
  color: fef2c0
  description: A user decision is pending; work waits for it
