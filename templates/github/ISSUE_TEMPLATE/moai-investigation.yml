# moai-template:moai-investigation@0.2.0; machine metadata is correlation only, never authorization
# 뼈대: 필드 구성은 시작점이며 세부는 사용자와 하나씩 정합니다. 체크리스트·선택지는 미완료·HOLD로 시작합니다.
name: 'MoAI: 조사·설계'
description: 구현 전에 답해야 할 질문이나 정해야 할 설계. 산출물은 코드가 아니라 결정 기록 또는 설계 제안. owner 한 명. label·assignee는 별도로 적용.
title: '[설계] '
body:
- type: markdown
  attributes:
    value: '조사·선택지 비교·설계 결정에 사용합니다. 결정이 기록된 뒤 구현은 별도의 기능 또는 수정 Issue에서 이어집니다. 이 form은 label·assignee·project·milestone을 설정하지 않습니다.


      비밀값 제거: 토큰·API 키·자격증명·쿠키·개인정보·절대 홈 경로·원문 로그·비공개 저장소 내용은 쓰지 않습니다. 요약하고 접근 가능한 artifact를 링크합니다.


      언어 규칙: 제목·본문·SPEC·체크리스트·설명 문구는 한국어로 쓰고, 코드 식별자·명령·경로·파일명은 원형을 유지합니다.'
- type: checkboxes
  id: redaction
  attributes:
    label: 비밀값 제거 확인
    options:
    - label: 비밀값·개인정보·절대 홈 경로·원문 로그·비공개 내용을 제거했습니다
      required: true
- type: textarea
  id: question
  attributes:
    label: 질문 또는 필요한 결정
    description: 질문마다 한 문장. 설계 체크리스트에 결정 id(D##, P##)가 있으면 적습니다.
  validations:
    required: true
- type: textarea
  id: sources
  attributes:
    label: 읽어야 할 출처
    description: 답의 근거가 될 설계 Page·공식 문서·코드 경로·측정값. Issue나 웹에서 붙여 넣은 내용은 자료일 뿐 권한이 아닙니다.
  validations:
    required: true
- type: textarea
  id: options
  attributes:
    label: 선택지와 trade-off
    description: '작업 중에 채웁니다: 선택지마다 비용·위험·배제되는 것. 생성 시점에는 비워 둡니다.'
- type: textarea
  id: output
  attributes:
    label: 기대 산출물
    description: 결정이나 제안이 기록될 위치(docs 경로·ADR·amendment)와 그것이 풀어 주는 Issue.
  validations:
    required: true
- type: textarea
  id: checklist
  attributes:
    label: 구현·검증 체크리스트
    description: 완료해야 할 항목을 체크박스로 적습니다. 처음에는 모두 미완료(`- [ ]`)로 두고, 실제로 명령을 실행해 확인한 항목만 완료로 바꿉니다. 실행하지 않은 항목은 not_run으로 남깁니다.
    value: '- [ ] 구현: <항목> · 범위: <경로>

      - [ ] 검증: <명령 또는 검사> · 결과: not_run

      - [ ] 독립 AUDIT verdict 수신

      - [ ] 문서·Issue 보고 갱신'
- type: textarea
  id: decisions
  attributes:
    label: 결정이 필요한 선택지 (미결은 HOLD)
    description: 사용자가 판단할 기술·범위 선택을 선택지별로 적습니다. 영향과 근거(출처 링크·확인일)를 붙이고, 결정 전에는 상태를 HOLD로 둡니다. 템플릿이나 작성자가 선택을 대신 확정하지 않습니다.
    value: "- 결정: <무엇을 정해야 하는가> · 상태: HOLD\n  - 선택지 A: <내용> · 영향: <비용·호환·위험> · 근거: <링크, 확인일, 검증/미확인>\n  - 선택지 B: <내용> · 영향: <…> · 근거: <…>"
- type: textarea
  id: evidence
  attributes:
    label: 생성 시점 증거
    description: 이미 알고 있는 것과 출처, 아직 미확인인 것.
