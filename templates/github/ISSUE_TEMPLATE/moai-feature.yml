# moai-template:moai-feature@0.2.0; machine metadata is correlation only, never authorization
# 뼈대: 필드 구성은 시작점이며 세부는 사용자와 하나씩 정합니다. 체크리스트·선택지는 미완료·HOLD로 시작합니다.
name: 'MoAI: 새 기능'
description: 새 기능 또는 동작. Issue 하나에 실행 owner 한 명, 진행은 소유 댓글 하나로 보고. label·assignee는 별도로 적용.
title: '[기능] '
body:
- type: markdown
  attributes:
    value: 'Issue 하나는 작업 하나이고 한 번에 한 명의 실행 owner만 가집니다. 이 form은 label·assignee·project·milestone을 설정하지 않습니다.


      비밀값 제거: 토큰·API 키·자격증명·쿠키·개인정보·절대 홈 경로·원문 로그·비공개 저장소 내용은 쓰지 않습니다. 요약하고 접근 가능한 artifact를 링크합니다.


      언어 규칙: 제목·본문·SPEC·체크리스트·설명 문구는 한국어로 쓰고, 코드 식별자·명령·경로·파일명은 원형을 유지합니다.'
- type: checkboxes
  id: redaction
  attributes:
    label: 비밀값 제거 확인
    options:
    - label: 비밀값·개인정보·절대 홈 경로·원문 로그·비공개 내용을 제거했습니다
      required: true
- type: textarea
  id: goal
  attributes:
    label: 목표와 사용자 가치
    description: 이 작업이 무엇을 누구에게 제공하는지 한두 문장.
  validations:
    required: true
- type: textarea
  id: non-goals
  attributes:
    label: 비목표
    description: 이 작업에서 명시적으로 제외하는 것.
- type: textarea
  id: spec
  attributes:
    label: SPEC 참조
    description: 승인된 SPEC revision과 digest, 또는 설계 문서 URL과 절. 승인 snapshot이 없으면 `미승인 초안`으로 적고 승인으로 간주하지 않습니다.
    placeholder: 'design: <url> §<section> · revision: <rev> · digest: sha256:<...> · status: unapproved draft'
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: 인수 기준과 검증
    description: 기준 한 줄마다 그것을 증명하는 실제 명령이나 검사를 짝지어 적습니다. 실행하지 않은 검사는 passed가 아니라 not_run입니다.
    value: '- AC-1: <기준> · 검증: <명령 또는 검사> · 결과: not_run

      - AC-2: <기준> · 검증: <명령 또는 검사> · 결과: not_run'
  validations:
    required: true
- type: textarea
  id: checklist
  attributes:
    label: 구현·검증 체크리스트
    description: 완료해야 할 항목을 체크박스로 적습니다. 처음에는 모두 미완료(`- [ ]`)로 두고, 실제로 명령을 실행해 확인한 항목만 완료로 바꿉니다. 실행하지 않은 항목은 not_run으로 남깁니다.
    value: '- [ ] 구현: <항목> · 범위: <경로>

      - [ ] 검증: <명령 또는 검사> · 결과: not_run

      - [ ] 독립 AUDIT verdict 수신

      - [ ] 문서·Issue 보고 갱신'
- type: textarea
  id: decisions
  attributes:
    label: 결정이 필요한 선택지 (미결은 HOLD)
    description: 사용자가 판단할 기술·범위 선택을 선택지별로 적습니다. 영향과 근거(출처 링크·확인일)를 붙이고, 결정 전에는 상태를 HOLD로 둡니다. 템플릿이나 작성자가 선택을 대신 확정하지 않습니다.
    value: "- 결정: <무엇을 정해야 하는가> · 상태: HOLD\n  - 선택지 A: <내용> · 영향: <비용·호환·위험> · 근거: <링크, 확인일, 검증/미확인>\n  - 선택지 B: <내용> · 영향: <…> · 근거: <…>"
- type: textarea
  id: scope
  attributes:
    label: 쓰기 범위와 제외
    description: 이 작업이 바꿀 수 있는 저장소 상대 경로와 건드리면 안 되는 경로.
    value: '- 변경 가능: <경로>

      - 변경 금지: <경로>'
  validations:
    required: true
- type: input
  id: dependencies
  attributes:
    label: 의존성
    description: 먼저 닫혀야 하는 Issue, 없으면 `없음`.
    placeholder: '#12, #15'
- type: dropdown
  id: hosts
  attributes:
    label: host 범위
    description: 이 작업을 검증해야 하는 host.
    options:
    - both (Claude Code and Codex)
    - claude
    - codex
    - host-neutral
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: 생성 시점 증거
    description: 이미 실행한 명령·exit code·개수, 그리고 not_run·blocked인 검사.
