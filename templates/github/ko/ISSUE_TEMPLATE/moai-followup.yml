# moai-template:moai-followup@0.1.0; machine metadata is correlation only, never authorization
# Follow-up or repair of an existing Issue or PR. It sets no label: the type follows the
# original work, chosen by the leader.
name: 'MoAI: 후속·수리'
description: 기존 Issue·PR에서 남은 일, 감사 FAIL의 수리, 리뷰에서 갈라진 후속. 원 작업을 링크하고 남은 일만 적습니다. 라벨은 리더가 붙입니다.
title: '[후속] '
body:
- type: markdown
  attributes:
    value: '원 Issue·PR에서 갈라진 일 하나를 적습니다. 원 작업의 본문을 다시 쓰지 말고 링크와 남은 일만 적습니다. 이 form은 라벨을 붙이지 않습니다. type·priority·area·host 라벨과 assignee·project·milestone은 리더가 붙입니다.


      비밀값 제거: 토큰·API 키·자격증명·쿠키·개인정보·절대 홈 경로·원문 로그·비공개 저장소 내용은 쓰지 않습니다. 요약하고 접근 가능한 artifact를 링크합니다.'
- type: checkboxes
  id: redaction
  attributes:
    label: 비밀값 제거 확인
    options:
    - label: 비밀값·개인정보·절대 홈 경로·원문 로그·비공개 내용을 제거했습니다
      required: true
- type: input
  id: outcome
  attributes:
    label: 한 줄 결과
    description: 이 Issue가 닫히면 무엇이 참이 되는가, 한 문장.
  validations:
    required: true
- type: textarea
  id: origin
  attributes:
    label: 원 작업
    description: 원 Issue·PR 번호, 원 인수 기준(AC) id, 이 일을 낳은 판정·리뷰 댓글 링크와 그 head SHA.
    placeholder: '원 Issue: #<n> · PR: #<n> · AC: <AC-n> · 근거: <댓글 URL> · head: <40hex>'
  validations:
    required: true
- type: textarea
  id: remaining
  attributes:
    label: 남은 일
    description: 원 작업에서 끝나지 않은 것만. 이미 끝난 것은 적지 않습니다.
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: 범위
    description: 바꿀 수 있는 저장소 상대 경로, 건드리면 안 되는 경로, 이번에 하지 않는 일, 그리고 어디서부터 읽으면 되는지(파일·함수·명령).
    value: '- 변경 가능: <경로>

      - 변경 금지: <경로>

      - 비범위: <이번에 하지 않는 일>

      - 탐색 단서: <파일·함수·명령>'
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: 인수 기준과 검증
    description: 기준 한 줄마다 그것을 증명하는 실제 명령이나 검사, 그리고 경계·실패 때 기대 동작을 짝지어 적습니다. 실행하지 않은 검사는 passed가 아니라 not_run입니다.
    value: '- AC-1: <기준> · 검증: <명령 또는 검사> · 경계·실패 동작: <입력 → 기대> · 결과: not_run'
  validations:
    required: true
- type: input
  id: dependencies
  attributes:
    label: 선행 Issue
    description: 먼저 닫혀야 하는 Issue, 없으면 `없음`. 리더가 native dependency로도 연결합니다.
    placeholder: '#12, #15'
- type: textarea
  id: decisions
  attributes:
    label: 결정이 필요한 선택지 (미결은 HOLD)
    description: 사용자가 판단할 기술·범위 선택을 선택지별로 적습니다. 영향과 근거(출처 링크·확인일)를 붙이고, 결정 전에는 상태를 HOLD로 둡니다. 템플릿이나 작성자가 선택을 대신 확정하지 않습니다.
    value: "- 결정: <무엇을 정해야 하는가> · 상태: HOLD\n  - 선택지 A: <내용> · 영향: <비용·호환·위험> · 근거: <링크, 확인일, 검증/미확인>\n  - 선택지 B: <내용> · 영향: <…> · 근거: <…>"
- type: textarea
  id: checklist
  attributes:
    label: 완료 정의
    description: 완료해야 할 항목을 체크박스로 적습니다. 처음에는 모두 미완료(`- [ ]`)로 두고, 실제로 명령을 실행해 출력을 확인한 항목만 완료로 바꿉니다. 실행하지 않은 항목은 not_run으로 남깁니다.
    value: '- [ ] 구현: <항목> · 범위: <경로>

      - [ ] 검증: <명령 또는 검사> · 출력 관측 · 결과: not_run

      - [ ] 독립 AUDIT verdict 수신

      - [ ] 원 Issue·PR에 연결 댓글, 소유 보고 댓글 갱신'
- type: textarea
  id: evidence
  attributes:
    label: 생성 시점 증거
    description: 이미 실행한 명령·exit code, 그리고 not_run·blocked인 검사.
