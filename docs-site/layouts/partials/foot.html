{{ if default false .Site.Params.geekdocMermaid }}
<script>
(function(){
  // 페이지에 mermaid 다이어그램이 없으면 종료 (불필요한 ~640KB 로드 방지)
  function findBlocks() {
    return document.querySelectorAll('pre.gdoc-mermaid, pre.mermaid, .mermaid');
  }

  // 라이트 테마 단일화 — 다크 분기 제거 (2026-05-13)
  // v2 팔레트 마이그레이션 (SPEC-DESIGN-DOCSV2-001 M4): warm-cream 값 제거
  // → v2 achromatic neutral + primary #3d7d5f. lines/signals 회색 de-emphasis(#9fa0a0),
  // primary/actor 테두리만 green 유지, note/cluster 테두리 neutral.
  var lightTheme = {
    primaryColor: '#eef4f0',
    primaryTextColor: '#060606',
    primaryBorderColor: '#3d7d5f',
    nodeTextColor: '#060606',
    textColor: '#060606',
    mainBkg: '#eef4f0',
    lineColor: '#9fa0a0',
    secondaryColor: '#e6e6e6',
    tertiaryColor: '#f4f4f4',
    noteBkgColor: '#e6e6e6',
    noteTextColor: '#060606',
    noteBorderColor: '#b5b5b5',
    edgeLabelBackground: '#ffffff',
    clusterBkg: '#f4f4f4',
    clusterBorder: '#d1d1d1',
    titleColor: '#060606',
    actorTextColor: '#060606',
    actorBorder: '#3d7d5f',
    actorBkg: '#eef4f0',
    signalColor: '#9fa0a0',
    signalTextColor: '#060606',
    labelBoxBkgColor: '#f4f4f4',
    labelBoxBorderColor: '#d1d1d1',
    labelTextColor: '#060606',
    loopTextColor: '#060606',
    activationBorderColor: '#b5b5b5',
    activationBkgColor: '#eef4f0',
    sequenceNumberColor: '#060606'
  };
  var flowchartConfig = {
    htmlLabels: true,
    nodeSpacing: 50,
    rankSpacing: 60,
    padding: 14,
    wrappingWidth: 260,
    useMaxWidth: true,
    curve: 'basis'
  };

  function runMermaid() {
    if (typeof window.mermaid === 'undefined') {
      console.warn('[mermaid] bundle loaded but window.mermaid undefined');
      return;
    }
    try {
      window.mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        theme: 'base',
        themeVariables: lightTheme,
        flowchart: flowchartConfig
      });
      // .mermaid 클래스를 가진 모든 <pre>를 SVG로 렌더링
      window.mermaid.run({ querySelector: 'pre.gdoc-mermaid, pre.mermaid, .mermaid' });
    } catch (e) {
      console.error('[mermaid] render error:', e);
    }
  }

  function loadMermaidBundle() {
    var blocks = findBlocks();
    if (!blocks.length) return; // 페이지에 다이어그램 없음

    if (typeof window.mermaid !== 'undefined') {
      runMermaid();
      return;
    }
    // bundle 동적 로드 (head에 한 번만)
    if (document.querySelector('script[data-mermaid-bundle]')) {
      // 이미 로드 중 — onload 콜백 대기 (다른 script 태그가 이미 추가됨)
      return;
    }
    {{- /* geekdoc 내장 번들은 window.mermaid 를 노출하지 않아 코랄 themeVariables 가
           적용되지 않음(기본 라벤더로 자체 렌더). window.mermaid 를 노출하는 CDN UMD
           빌드를 로드해야 아래 runMermaid 의 coral theme:'base' init 이 동작한다. */ -}}
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
    s.setAttribute('data-mermaid-bundle', '1');
    s.onload = runMermaid;
    s.onerror = function() { console.error('[mermaid] CDN load failed'); };
    document.head.appendChild(s);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadMermaidBundle);
  } else {
    loadMermaidBundle();
  }
})();
</script>
{{ end }}
