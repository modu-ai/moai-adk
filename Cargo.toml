[package]
name = "moai-cli"
version = "2026.11.0-rc.1"
edition = "2021"
publish = false
# Package metadata (Issue #2500, #2435 decision 5-A). Each value restates LICENSE or the README
# opening sentence and Facts block; tests/cargo_metadata_test.py keeps them equal.
description = "MoAI ADK is an open-source development kit that runs one workflow (read → plan → run → verify → audit → sync) inside Claude Code and Codex through a single shared moai skill, with GitHub Issues as the work ledger."
license = "Apache-2.0"
repository = "https://github.com/modu-ai/moai-adk"
homepage = "https://adk.mo.ai.kr"

# The public CLI name is `moai` (user RC2 instruction, Issue #1975 comment 6859326988); the
# name `moai-cli` stays as an alias that existing hooks, skills and receipts call (#2790 R1,
# design #2725 comment 6863726387). Both binaries run the one `main` of `src/main.rs`
# (`src/bin/moai.rs` loads it as a module) and print the same output; the library crate
# stays `moai_cli`.
[[bin]]
name = "moai-cli"
path = "src/main.rs"

[[bin]]
name = "moai"
path = "src/bin/moai.rs"

[dependencies]
# `wrap_help` (Issue #2805, leader decision 6866652365 (가)): help text wraps to the terminal
# width; it adds `terminal_size` (MIT OR Apache-2.0; its unix `rustix` and windows
# `windows-sys` are already locked).
clap = { version = "=4.6.1", features = ["derive", "wrap_help"] }
# Human output styles (Issue #2803): already locked through clap_builder at this version,
# so this adds no crate to the tree. MIT OR Apache-2.0.
anstyle = "=1.0.14"
# Display width of table cells, Hangul and other wide characters as two cells (Issue #2805,
# leader decision 6866652365 (가)). MIT OR Apache-2.0, no dependencies.
unicode-width = "=0.2.2"
serde = { version = "=1.0.228", features = ["derive"] }
# preserve_order keeps object keys in file order, so a merged host settings file keeps the
# user's layout (Issue #1992, leader RC1 decision H1 = B).
serde_json = { version = "=1.0.150", features = ["preserve_order"] }
sha2 = "=0.10.9"
# Format-preserving TOML for `.codex/config.toml` (Issue #2240): comments, order and every
# key MoAI does not manage survive an edit. MIT OR Apache-2.0; default features only.
toml_edit = "=0.25.3"
# Replacing the running binary, Windows included (Issue #2195, decision 16:1x(11-08)).
# Apache-2.0; MSRV 1.63. windows-sys and fastrand are pulled only on Windows targets.
self-replace = "=1.5.1"
# C6 F3: directory-handle-relative no-follow reads on Unix and Windows; see
# docs/index-generation.md for the source, checksums and dependency rationale.
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
chacha20poly1305 = "=0.10.1"
tempfile = "=3.27.0"
# The local project ledger (Issue #3068 P1, schema contract comment 6896940106): one SQLite file
# per project. `bundled` compiles the SQLite the crate ships, so `unixepoch()` (3.38+), `STRICT`
# tables (3.37+) and the JSON functions exist on every machine and no system library is needed;
# it needs a C compiler at build time (the `cc` build dependency). No default features: no
# statement cache and no extra type conversions. MIT.
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
# Already locked transitively; O_NONBLOCK prevents FIFO opens from waiting.
libc = "=0.2.189"

# Dev and test builds keep only line tables in their debug info (user decision 2026-11-21):
# backtraces still carry file names and line numbers, while variable and type info is dropped,
# so the .o files and the incremental cache stay small and stop feeding fseventsd tens of
# thousands of file events per test run. Release-side profiles (release, dist) are untouched.
[profile.dev]
debug = "line-tables-only"

# The built-in test profile inherits dev; naming it keeps the value visible where a reader
# looks for it instead of relying on the inheritance rule.
[profile.test]
debug = "line-tables-only"

# Dependencies carry no debug info at all in dev and test builds (leader word 2026-11-22): we do
# not debug their code, so their frames keep function names only. `"*"` never matches this
# crate, which keeps its line tables above.
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false

# Debug builds hash the running moai-cli binary on every update/recovery operation
# (`update::current_install_id`, ~28 MB in debug). Unoptimized sha2 made that ~2.2 s of CPU
# per launch, which a loaded machine stretched to minutes per test (Issue #2507). Optimizing
# only this crate in dev builds changes no behavior and no lock entry; release is untouched.
[profile.dev.package.sha2]
opt-level = 3

# The profile that 'dist' will build with (cargo-dist 0.34, E1 #2193)
[profile.dist]
inherits = "release"
lto = "thin"

# cargo-dist: publish = false hides binaries, so mark this package explicitly
[package.metadata.dist]
dist = true
