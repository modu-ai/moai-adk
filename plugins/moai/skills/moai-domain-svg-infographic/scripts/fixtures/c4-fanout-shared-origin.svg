<!-- expect: -->
<!-- C4 arrival-only: the 2.3 fan-out emits every connector from the identical point (120,100) on the source right edge. Departures are not compared; the three arrivals land on three different boxes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200"
     role="img" aria-labelledby="c4-fanout-shared-origin-title c4-fanout-shared-origin-desc">
  <title id="c4-fanout-shared-origin-title">Fan-out</title>
  <desc id="c4-fanout-shared-origin-desc">One source branches to three targets through a shared trunk.</desc>
  <defs>
    <marker id="c4-fanout-shared-origin-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#6B6359"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="400" height="200" fill="#FAF9F5"/>
  <rect x="20" y="80" width="100" height="40" fill="#FAF9F5" stroke="#D9CDBE"/>
  <path d="M 120 100 H 180 V 60 H 230" stroke="#6B6359" stroke-width="1" fill="none" marker-end="url(#c4-fanout-shared-origin-arrow)"/>
  <path d="M 120 100 H 180 V 100 H 230" stroke="#6B6359" stroke-width="1" fill="none" marker-end="url(#c4-fanout-shared-origin-arrow)"/>
  <path d="M 120 100 H 180 V 140 H 230" stroke="#6B6359" stroke-width="1" fill="none" marker-end="url(#c4-fanout-shared-origin-arrow)"/>
  <rect x="240" y="40" width="120" height="40" fill="#FBE9DF" stroke="#D97757"/>
  <rect x="240" y="80" width="120" height="40" fill="#FBE9DF" stroke="#D97757"/>
  <rect x="240" y="120" width="120" height="40" fill="#FBE9DF" stroke="#D97757"/>
</svg>
