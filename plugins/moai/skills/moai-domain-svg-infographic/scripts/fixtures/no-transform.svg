<!-- expect: -->
<!-- Transform aggregate: a diagram with zero transformed elements emits no aggregate note at all. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200"
     role="img" aria-labelledby="no-transform-title no-transform-desc">
  <title id="no-transform-title">Plain flow</title>
  <desc id="no-transform-desc">A client calls an API across one connector.</desc>
  <defs>
    <marker id="no-transform-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#6B6359"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="400" height="200" fill="#FAF9F5"/>
  <path d="M 160 100 H 230" stroke="#6B6359" stroke-width="1" fill="none" marker-end="url(#no-transform-arrow)"/>
  <rect x="40" y="70" width="120" height="60" rx="12" fill="#FAF9F5" stroke="#D9CDBE"/>
  <text x="100" y="105" font-size="11" text-anchor="middle" fill="#141413">client</text>
  <rect x="240" y="70" width="120" height="60" rx="12" fill="#FBE9DF" stroke="#D97757"/>
  <text x="300" y="105" font-size="11" text-anchor="middle" fill="#141413">api</text>
</svg>
