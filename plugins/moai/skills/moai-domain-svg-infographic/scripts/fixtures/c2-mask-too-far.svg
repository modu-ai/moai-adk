<!-- C2: clearance 16, above the 10-unit band edge and on the outer edge of the 16-unit association window (10 + 6). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200"
     role="img" aria-labelledby="c2-mask-too-far-title c2-mask-too-far-desc">
  <title id="c2-mask-too-far-title">Stage handoff</title>
  <desc id="c2-mask-too-far-desc">One connector carries a masked label between two stages.</desc>
  <defs>
    <marker id="c2-mask-too-far-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#6B6359"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="400" height="200" fill="#FAF9F5"/>
  <path d="M 60 120 H 340" stroke="#6B6359" stroke-width="1" fill="none" marker-end="url(#c2-mask-too-far-arrow)"/>
  <rect x="150" y="84" width="90" height="20" fill="#FFFFFF"/>
  <text x="195" y="98" font-size="11" text-anchor="middle" fill="#141413">handoff</text>
</svg>
