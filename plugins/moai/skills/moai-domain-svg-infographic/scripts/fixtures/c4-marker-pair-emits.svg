  </defs>
  <rect x="0" y="0" width="400" height="200" fill="#FAF9F5"/>
  <path d="M 40 98 H 230" stroke="#6B6359" stroke-width="1" fill="none" marker-end="url(#c4-marker-pair-emits-arrow)"/>
  <path d="M 40 102 H 230" stroke="#6B6359" stroke-width="1" fill="none" marker-end="url(#c4-marker-pair-emits-arrow)"/>
