version: 1
# SSoT for required CI status checks (REQ-CIAUT-027 / AC-CIAUT-021).
# Consumed by:
#   - internal/cli/branch_protection.go (renders gh api PUT branch protection JSON)
#   - Wave 2 CI watch loop (filters required vs auxiliary failures)
# Update: edit this file ONLY. Hardcoding contexts elsewhere is prohibited (AC-CIAUT-021).
#
# Values corrected by SPEC-CI-VERDICT-INTEGRITY-001 M2 against the
# deterministically published check names (plan ledger E13 live observation +
# E21 trigger facts; release/* resolution per decision-index Q1):
#   - Test (macos-latest) / Test (windows-latest) removed (PR matrix is
#     ubuntu-only; cross-platform runtime verification runs at release time
#     inside Release PR Multi-OS Gate)
#   - CodeQL replaced by Analyze (Go) (go) (the composite job display name
#     actually published by codeql.yml's matrix)
#   - Release PR Multi-OS Gate added (published on every main-targeting PR)
branches:
  main:
    contexts:
      - Lint
      - "Test (ubuntu-latest)"
      - "Build (linux/amd64)"
      - "Build (linux/arm64)"
      - "Build (darwin/amd64)"
      - "Build (darwin/arm64)"
      - "Build (windows/amd64)"
      - "Analyze (Go) (go)"
      - "Release PR Multi-OS Gate"
  release/*:
    # Decision-index Q1 (micro-card t1543 resolution): this key lists ONLY
    # contexts that publish on release-TARGETING pull requests. All three
    # producing workflows restrict their pull_request triggers to main, so
    # the published set for release-base PRs is empty. Trigger expansion is
    # the release-pipeline scope (t1536); revisit this list if that lands.
    contexts: []
# Auxiliary checks run on PRs but DO NOT block merge (advisory only).
# Wave 2 watch loop reads this list to discriminate failures.
auxiliary:
  - docs-i18n-check
