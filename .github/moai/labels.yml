# MoAI RC label taxonomy for modu-ai/moai-adk (Issue #2434, user decisions 1-4 = A,
# recorded in Issue comment 6783612809 on 2026-11-11).
# `moai-label-sync` reads this file: a dry run on every PR that touches it, and a manual apply
# that only CREATES the missing `added` labels. Nothing here edits, renames, recolours or
# deletes a remote label.
#
# Axes an Issue carries (rules: `.github/moai/README.md`, section "Labels"):
#   type:*      exactly one
#   priority:*  exactly one (P0..P3)
#   area:*      one or more (prefer one or two)
#   host:*      when the work must be verified on that host
#   needs:decision  gate marker: a user decision is pending, lanes do not proceed.
#                   The authority is the decisions log and the Issue's HOLD line; the label
#                   is a search aid only.
# Status is never a label: it lives in the Issue's owned report comment (labels and
# assignees are not a distributed lock). Parent tracking uses native sub-issues and
# ordering uses native issue dependencies, not labels.
schema_version: 1
reused:
  type:
    - type:feature
    - type:fix
    - type:docs
    - type:chore
    - type:ci
    - type:test
    - type:refactor
  priority:
    - priority:P0
    - priority:P1
    - priority:P2
    - priority:P3
  area:
    - area:ci
    - area:cli
    - area:config
    - area:docs-site
    - area:hooks
    - area:security
    - area:templates
    - area:workflow
  functional:
    - security
    - duplicate
    - wontfix
added:
  - name: host:claude
    color: d4a5ff
    description: Must be verified on Claude Code
  - name: host:codex
    color: 74d2ff
    description: Must be verified on Codex
  - name: area:setup
    color: c2e0c6
    description: "SETUP: project profile, AGENTS.md generation, host projections"
  - name: type:design
    color: c5def5
    description: Investigation or design; the output is a decision record, not code
  - name: needs:decision
    color: b60205
    description: A user decision is pending (HOLD); lanes do not proceed until it is recorded
  - name: area:atlas
    color: c2e0c6
    description: Core Brain, Code Atlas, map and graph
  - name: area:design
    color: c2e0c6
    description: Design documents and their consistency with the design Space
  - name: area:runtime
    color: c2e0c6
    description: Model adapters, judge backends, Desktop and Pi runtimes
  - name: area:router
    color: c2e0c6
    description: Common skill router, routes.json and workflow files
  - name: area:update
    color: c2e0c6
    description: "UPDATE: installed-host preflight, 3-way merge, partial recovery"
  - name: area:forge
    color: c2e0c6
    description: GitHub/GitLab Issues ledger, reports and reconciliation
# Every proposed label was promoted to `added` by #2434; new proposals go here first.
proposed_not_created: []
# Remote labels from the previous generation that RC Issues do not use (decision 3 = A).
# They are documented, not deleted or renamed; review after the stable release.
not_used:
  type_duplicates:
    - bug
    - enhancement
    - feature
    - feature-request
    - improvement
    - documentation
    - docs
    - chore
    - ci
    - config
    - test
    - tests
    - testing
    - refactor
    - hooks
    - templates
    - go
    - spec
    - type:performance
    - type:security
  priority_duplicates:
    - critical
    - high
    - medium
    - low
    - priority:critical
    - priority:high
    - priority:medium
    - priority:low
    - priority:P4
  state:
    - blocked
    - in-progress
    - ready
    - review
    - done
    - triage
    - planning
    - status:blocked
    - status:in-progress
    - status:needs-info
    - status:review
  previous_generation_area:
    - area:astgrep
    - area:lsp
    - area:mx
    - area:harness
    - area:deps
