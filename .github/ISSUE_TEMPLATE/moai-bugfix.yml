# moai-template:moai-bugfix@0.3.0; machine metadata is correlation only, never authorization
# Fields follow Issue #2434 (decisions 1-4 = A): one-line outcome, scope with non-scope and
# search hints, AC with verification and boundary behaviour, prerequisites, HOLD, done definition.
name: 'MoAI: 오류 수정'
description: 관측된 결함. 먼저 재현하고, 회귀 시험과 함께 최소 수정. Issue 하나에 실행 owner 한 명. type 라벨만 자동으로 붙고 priority·area 라벨은 리더가 붙입니다.
title: '[수정] '
labels:
- type:fix
body:
- type: markdown
  attributes:
    value: 'Issue 하나는 결함 하나이고 한 명의 실행 owner만 가집니다. 이 form은 `type:fix` 라벨 하나만 붙입니다. priority·area·host 라벨과 assignee·project·milestone은 리더가 붙입니다.


      에이전트가 이 Issue만 읽고 무엇을·어디까지·어떻게 검증할지 알 수 있게 짧고 자기완결적으로 씁니다.


      비밀값 제거: 토큰·API 키·자격증명·쿠키·개인정보·절대 홈 경로·원문 로그·비공개 저장소 내용은 쓰지 않습니다. 요약하고 접근 가능한 artifact를 링크합니다.


      언어 규칙: 제목·본문·SPEC·체크리스트·설명 문구는 한국어로 쓰고, 코드 식별자·명령·경로·파일명은 원형을 유지합니다.'
- type: checkboxes
  id: redaction
  attributes:
    label: 비밀값 제거 확인
    options:
    - label: 비밀값·개인정보·절대 홈 경로·원문 로그·비공개 내용을 제거했습니다
      required: true
- type: input
  id: outcome
  attributes:
    label: 한 줄 결과
    description: 이 Issue가 닫히면 무엇이 참이 되는가, 한 문장.
    placeholder: '<조건>에서 <명령>이 더 이상 <결함>을 내지 않고 <기대>를 낸다'
  validations:
    required: true
- type: textarea
  id: observed
  attributes:
    label: 관측된 동작
    description: 실제로 무슨 일이 어디서(명령·host·파일) 어느 revision에서 일어나는지.
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: 기대 동작과 그 출처
    description: 무엇이 일어나야 하는지와 그렇게 정한 SPEC·설계 절·시험. 출처가 없으면 없다고 적고 만들어 내지 않습니다.
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: 재현
    description: 재현하는 정확한 단계나 명령과 관측된 exit code·출력. 실행하지 않은 재현은 not_run으로 표시.
  validations:
    required: true
- type: textarea
  id: regression-test
  attributes:
    label: 회귀 시험
    description: 수정 전에 실패하고 수정 후 통과하는 시험(RED → GREEN). 파일이 생기면 이름을 적습니다.
- type: textarea
  id: scope
  attributes:
    label: 범위
    description: 바꿀 수 있는 저장소 상대 경로, 건드리면 안 되는 경로, 이번에 하지 않는 일, 그리고 어디서부터 읽으면 되는지(파일·함수·명령).
    value: '- 변경 가능: <경로>

      - 변경 금지: <경로>

      - 비범위: <이번에 하지 않는 일>

      - 탐색 단서: <파일·함수·명령>'
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: 인수 기준과 검증
    description: 기준 한 줄마다 그것을 증명하는 실제 명령이나 검사, 그리고 경계·실패 때 기대 동작을 짝지어 적습니다. 실행하지 않은 검사는 passed가 아니라 not_run입니다.
    value: '- AC-1: <결함이 사라짐> · 검증: <회귀 시험 명령> · 경계·실패 동작: <입력 → 기대> · 결과: not_run'
  validations:
    required: true
- type: input
  id: dependencies
  attributes:
    label: 선행 Issue
    description: 먼저 닫혀야 하는 Issue, 없으면 `없음`. 리더가 native dependency로도 연결합니다.
    placeholder: '#12, #15'
- type: textarea
  id: decisions
  attributes:
    label: 결정이 필요한 선택지 (미결은 HOLD)
    description: 사용자가 판단할 기술·범위 선택을 선택지별로 적습니다. 영향과 근거(출처 링크·확인일)를 붙이고, 결정 전에는 상태를 HOLD로 둡니다. 템플릿이나 작성자가 선택을 대신 확정하지 않습니다.
    value: "- 결정: <무엇을 정해야 하는가> · 상태: HOLD\n  - 선택지 A: <내용> · 영향: <비용·호환·위험> · 근거: <링크, 확인일, 검증/미확인>\n  - 선택지 B: <내용> · 영향: <…> · 근거: <…>"
- type: textarea
  id: checklist
  attributes:
    label: 완료 정의
    description: 완료해야 할 항목을 체크박스로 적습니다. 처음에는 모두 미완료(`- [ ]`)로 두고, 실제로 명령을 실행해 출력을 확인한 항목만 완료로 바꿉니다. 실행하지 않은 항목은 not_run으로 남깁니다.
    value: '- [ ] 구현: <항목> · 범위: <경로>

      - [ ] 검증: <명령 또는 검사> · 출력 관측 · 결과: not_run

      - [ ] 독립 AUDIT verdict 수신

      - [ ] 소유 보고 댓글 갱신'
- type: dropdown
  id: hosts
  attributes:
    label: host 범위
    options:
    - both (Claude Code and Codex)
    - claude
    - codex
    - host-neutral
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: 생성 시점 증거
    description: 이미 실행한 명령·exit code, 그리고 not_run·blocked인 검사.
