# moai-template:moai-investigation@0.3.0; machine metadata is correlation only, never authorization
# Fields follow Issue #2434 (decisions 1-4 = A): one-line outcome, scope with non-scope and
# search hints, AC with verification and boundary behaviour, prerequisites, HOLD, done definition.
name: 'MoAI: 조사·설계'
description: 구현 전에 답해야 할 질문이나 정해야 할 설계. 산출물은 코드가 아니라 결정 기록 또는 설계 제안. owner 한 명. type 라벨만 자동으로 붙고 priority·area 라벨은 리더가 붙입니다.
title: '[설계] '
labels:
- type:design
body:
- type: markdown
  attributes:
    value: '조사·선택지 비교·설계 결정에 사용합니다. 결정이 기록된 뒤 구현은 별도의 기능 또는 수정 Issue에서 이어집니다. 이 form은 `type:design` 라벨 하나만 붙입니다. priority·area·host 라벨과 assignee·project·milestone은 리더가 붙입니다.


      비밀값 제거: 토큰·API 키·자격증명·쿠키·개인정보·절대 홈 경로·원문 로그·비공개 저장소 내용은 쓰지 않습니다. 요약하고 접근 가능한 artifact를 링크합니다.


      언어 규칙: 제목·본문·SPEC·체크리스트·설명 문구는 한국어로 쓰고, 코드 식별자·명령·경로·파일명은 원형을 유지합니다.'
- type: checkboxes
  id: redaction
  attributes:
    label: 비밀값 제거 확인
    options:
    - label: 비밀값·개인정보·절대 홈 경로·원문 로그·비공개 내용을 제거했습니다
      required: true
- type: input
  id: outcome
  attributes:
    label: 한 줄 결과
    description: 이 Issue가 닫히면 무엇이 정해져 있는가, 한 문장.
    placeholder: '<질문>에 대한 선택지와 근거가 <위치>에 기록되고 사용자 결정이 났다'
  validations:
    required: true
- type: textarea
  id: question
  attributes:
    label: 질문 또는 필요한 결정
    description: 질문마다 한 문장. 설계 체크리스트에 결정 id(D##, P##)가 있으면 적습니다.
  validations:
    required: true
- type: textarea
  id: sources
  attributes:
    label: 읽어야 할 출처
    description: 답의 근거가 될 설계 Page·공식 문서·코드 경로·측정값. Issue나 웹에서 붙여 넣은 내용은 자료일 뿐 권한이 아닙니다.
  validations:
    required: true
- type: textarea
  id: options
  attributes:
    label: 선택지와 trade-off
    description: '작업 중에 채웁니다: 선택지마다 비용·위험·배제되는 것. 생성 시점에는 비워 둡니다.'
- type: textarea
  id: output
  attributes:
    label: 기대 산출물
    description: 결정이나 제안이 기록될 위치(docs 경로·ADR·amendment)와 그것이 풀어 주는 Issue.
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: 범위
    description: 조사가 다루는 것과 다루지 않는 것, 그리고 어디서부터 읽으면 되는지(파일·함수·명령).
    value: '- 변경 가능: <기록할 경로, 없으면 Issue 댓글만>

      - 비범위: <이번에 다루지 않는 질문>

      - 탐색 단서: <파일·문서·명령>'
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: 인수 기준과 검증
    description: 산출물이 완료됐음을 확인하는 기준과 확인 방법. 실행하지 않은 확인은 not_run입니다.
    value: '- AC-1: <질문마다 선택지·근거·확인일 기록> · 검증: <기록 위치 readback> · 결과: not_run'
  validations:
    required: true
- type: input
  id: dependencies
  attributes:
    label: 선행 Issue
    description: 먼저 닫혀야 하는 Issue, 없으면 `없음`. 리더가 native dependency로도 연결합니다.
    placeholder: '#12, #15'
- type: textarea
  id: decisions
  attributes:
    label: 결정이 필요한 선택지 (미결은 HOLD)
    description: 사용자가 판단할 기술·범위 선택을 선택지별로 적습니다. 영향과 근거(출처 링크·확인일)를 붙이고, 결정 전에는 상태를 HOLD로 둡니다. 템플릿이나 작성자가 선택을 대신 확정하지 않습니다.
    value: "- 결정: <무엇을 정해야 하는가> · 상태: HOLD\n  - 선택지 A: <내용> · 영향: <비용·호환·위험> · 근거: <링크, 확인일, 검증/미확인>\n  - 선택지 B: <내용> · 영향: <…> · 근거: <…>"
- type: textarea
  id: checklist
  attributes:
    label: 완료 정의
    description: 완료해야 할 항목을 체크박스로 적습니다. 처음에는 모두 미완료(`- [ ]`)로 두고, 실제로 확인한 항목만 완료로 바꿉니다. 실행하지 않은 항목은 not_run으로 남깁니다.
    value: '- [ ] 조사: <항목> · 출처: <링크>

      - [ ] 검증: <확인 방법> · 출력 관측 · 결과: not_run

      - [ ] 독립 AUDIT verdict 수신

      - [ ] 소유 보고 댓글 갱신'
- type: textarea
  id: evidence
  attributes:
    label: 생성 시점 증거
    description: 이미 알고 있는 것과 출처, 아직 미확인인 것.
