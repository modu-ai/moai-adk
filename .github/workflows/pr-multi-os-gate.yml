name: PR Multi-OS Gate

# SPEC-GITHUB-FLOW-CI-RESIDUE-001 M2 (REQ-GFC-009..012, design D-2): PRs
# touching platform-sensitive packages get a real macOS + Windows `go test`
# run through a single aggregate gate, instead of waiting for the release PR
# matrix (release-pr-multi-os.yml) to discover a platform regression.
#
# The gate is a NEW workflow file rather than a ci.yml matrix extension
# (design D-2): one-file revert, and the release-time matrix stays visibly
# separate from the PR-time gate. The detection idiom — dorny/paths-filter at
# a pinned SHA, continue-on-error, and the matrix keyed on `!= 'false'` — is
# release-pr-multi-os.yml's, on purpose: if the filter cannot evaluate, the
# output is empty, `!= 'false'` is true, and the matrix RUNS. An abnormal
# filter can never silently skip the verification (REQ-GFC-011); the matrix
# is skipped only on a positively observed non-platform diff.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: the workflow runs the Go test matrix and touches no
# GITHUB_TOKEN write surface.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Detect: proceed unless the diff is positively free of platform-relevant
  # changes. The filter scopes to the OS-sensitive packages (design D-2.2):
  # internal/hook (Windows path handling) and internal/cli/worktree
  # (platform-specific git invocation). Deliberately NOT ./... — the matrix
  # runs TARGETED packages, so the filter matches the same surface.
  # ---------------------------------------------------------------------------
  detect-platform:
    name: Detect Platform-Relevant Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # paths-filter reads the PR's changed files through the GitHub API on
    # pull_request events; without pull-requests: read the query is denied
    # and the empty filter output makes even a docs-only PR run the two-OS
    # matrix (leader repair #31, 2026-10-07). Read-only widening of this
    # job only; the workflow-level least privilege is unchanged.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go_code: ${{ steps.f.outputs.go_code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        continue-on-error: true
        with:
          filters: |
            go_code:
              - 'internal/hook/**'
              - 'internal/cli/worktree/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/pr-multi-os-gate.yml'

  # ---------------------------------------------------------------------------
  # The macOS + Windows matrix over the platform-sensitive packages. Every leg
  # blocks the gate: there is no continue-on-error and no exclusion — the
  # declared OS list IS the effective OS set (AC-GFC-009 (d)).
  # ---------------------------------------------------------------------------
  multi-os-test:
    name: Multi-OS Test (${{ matrix.os }})
    needs: detect-platform
    if: needs.detect-platform.outputs.go_code != 'false'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # ast-grep supplies the `sg` binary that the internal/hook quality
      # guards shell out to; without it those guards fail here rather than
      # skip. Mirrors ci.yml / release-pr-multi-os.yml — keep the pinned
      # version in step with them.
      - name: Install ast-grep (provides `sg`)
        run: npm install -g @ast-grep/cli@0.40.5

      - name: Run go vet
        run: go vet ./internal/hook/... ./internal/cli/worktree/...

      # The runtime verification the gate exists for: real `go test` on the
      # OS-sensitive packages (REQ-GFC-009, AC-GFC-009 (e)). A cross-compile
      # build does NOT stand in for this (REQ-GFC-012).
      - name: Run go test
        run: go test -timeout 25m ./internal/hook/... ./internal/cli/worktree/...

  # ---------------------------------------------------------------------------
  # The single aggregate check branch protection registers (REQ-GFC-010).
  # `if: always()` lets the gate REPORT on docs-only PRs — where the matrix
  # was legitimately skipped — but the step below is strict about what it
  # accepts: the verification-needing path requires the matrix result to be
  # exactly `success`, and only a POSITIVELY observed non-platform diff
  # (detect's go_code == 'false') may pass with a skipped matrix. A
  # `cancelled` matrix is therefore a failed gate, not a passed one (leader
  # repair #30, 2026-10-07 — the t1534 "cancelled reads as success" class).
  # ---------------------------------------------------------------------------
  multi-os-runtime-gate:
    name: Multi-OS Runtime Gate
    needs: [detect-platform, multi-os-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the matrix ran and passed
        run: |
          if [ "${{ needs.detect-platform.result }}" != "success" ]; then
            echo "::error::Platform detection did not succeed before the matrix could run — not treating a skipped matrix as verification"
            exit 1
          fi
          if [ "${{ needs.multi-os-test.result }}" != "success" ]; then
            if [ "${{ needs.multi-os-test.result }}" = "skipped" ] && [ "${{ needs.detect-platform.outputs.go_code }}" = "false" ]; then
              echo "✓ Multi-OS runtime verification SKIPPED (positively non-platform diff)"
              exit 0
            fi
            echo "::error::Multi-OS runtime verification did not succeed (matrix result: ${{ needs.multi-os-test.result }}) — a cancelled or failed matrix is not a passed gate"
            exit 1
          fi
          echo "✓ Multi-OS runtime verification PASSED"
