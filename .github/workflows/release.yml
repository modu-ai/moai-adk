# HeadVer release plan and build check (SPEC-20261125-headver-weekly-release, which replaces the
# branch and numbering rules of SPEC-20261119-headver-release-workflow; user decisions of
# 2026-11-25).
#
# A person starts it by pushing one branch named after the release version:
#
#   git push origin <sha>:refs/heads/release/v{head}.{yearweek}.{n}       a release
#   git push origin <sha>:refs/heads/release/rc/v{head}.{yearweek}.{n}    a release candidate
#
# The version is `{head}.{release week}.{serial}`: `head` from the tracked HEADVER file of the
# pushed commit, `yearweek` the ISO week-year and week of the NEXT Monday after one UTC clock
# reading (the Monday the release ships, so 2026-12-28 gives 2653 and 2027-01-04 gives 2701), and
# `n` counts the releases of that head and week from 0: the lowest serial no tag
# `moai-adk-v{head}.{yearweek}.*` uses yet. The plan stops unless the branch name spells exactly
# that version, so a name never claims a number another release holds. It also stops unless the
# pushed commit is on the remote NeXT branch.
#
# `workflow_dispatch` is not used: it needs the file on the default branch, which has no
# workflows (the same reason as candidate.yml). A push runs this file from the pushed commit.
# The branch is deleted after use.
#
# What it does: (1) `plan` numbers the release and names the tag `moai-adk-v{version}` (no
# suffix; a `release/rc/…` branch marks a pre-release); (2) `build` builds the commit with
# `MOAI_RELEASE_VERSION` (never `MOAI_LOCAL_BUILD` or `MOAI_BUILD_NUMBER`, so `--version` says
# `release build`), fails unless both binaries and the tag agree on the version, and writes the
# release note to the job summary.
#
# What it never does: create a tag, create or publish a release, upload anything, call the
# GitHub API or read a secret; its token is read-only. Pushing the tag and publishing the
# release are the person's steps (guarded, confirmed each time). Rules this file keeps
# (tests/release_branch_version.rs pins them):
#   - no `${{ }}` inside a `run:` script: every value reaches the shell through `env:`;
#   - no `concurrency`: a newer run never cancels an older one;
#   - every `uses` is pinned to a full commit SHA, the one ci.yml uses.
name: release

on:
  push:
    branches: ['release/**']

permissions:
  contents: read

jobs:
  plan:
    name: release / plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      head: ${{ steps.plan.outputs.head }}
      yearweek: ${{ steps.plan.outputs.yearweek }}
      serial: ${{ steps.plan.outputs.serial }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      epoch: ${{ steps.plan.outputs.epoch }}
    steps:
      # The tags and every branch come with the checkout, so the plan reads the tags and the
      # remote NeXT branch from the clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Number the release
        id: plan
        env:
          REF_NAME: ${{ github.ref_name }}
          PUSHED: ${{ github.sha }}
        run: |
          fail() { echo "$1" >&2; exit 1; }

          # The branch name says release or release candidate and spells the version.
          shape='^release/(rc/)?v(0|[1-9][0-9]{0,3})\.([0-9]{4})\.(0|[1-9][0-9]{0,9})$'
          [[ "$REF_NAME" =~ $shape ]] \
            || fail "the branch must be release/v{head}.{yearweek}.{n} or release/rc/v{head}.{yearweek}.{n} (for example release/v4.2649.0); ${REF_NAME} is not"
          if [ -n "${BASH_REMATCH[1]}" ]; then prerelease=true; else prerelease=false; fi
          branch_version="${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.${BASH_REMATCH[4]}"
          [ "${BASH_REMATCH[4]}" -le 4294967295 ] \
            || fail "the serial ${BASH_REMATCH[4]} is over 4294967295"
          [[ "$PUSHED" =~ ^[0-9a-f]{40}$ ]] || fail "the pushed commit is not 40 lowercase hex characters"

          # The pushed commit must already be on the remote NeXT branch (a landed commit).
          next="${NEXT_REF:-refs/remotes/origin/NeXT}"
          git rev-parse --verify --quiet "${next}^{commit}" > /dev/null \
            || fail "the remote NeXT branch (${next}) is not in this clone: push NeXT before a release branch"
          git merge-base --is-ancestor "$PUSHED" "$next" \
            || fail "the pushed commit ${PUSHED} is not on the remote NeXT branch"

          # head: the one line of HEADVER, 0 to 9999, no sign, no leading zero (headver::parse_head).
          [ -f HEADVER ] || fail "HEADVER refused: the file is missing"
          text="$(cat HEADVER; printf x)"
          text="${text%x}"
          if [[ "$text" == *$'\r\n' ]]; then line="${text%$'\r\n'}"; elif [[ "$text" == *$'\n' ]]; then line="${text%$'\n'}"; else line="$text"; fi
          if [[ ! "$line" =~ ^(0|[1-9][0-9]{0,3})$ ]]; then
            fail "HEADVER refused: it must hold one line with the HeadVer head, a decimal number from 0 to 9999 without a sign or leading zero"
          fi
          head="$line"

          # One clock reading. The release week is the ISO week of the next Monday after it, so
          # a push on a Monday still names the following week. The arithmetic is plain integer
          # math on whole days (the date commands of Linux and macOS differ), checked against
          # headver::yearweek over a table of dates by tests/release_branch_version.rs.
          epoch="${SOURCE_DATE_EPOCH:-$(date -u +%s)}"
          [[ "$epoch" =~ ^[0-9]{1,12}$ ]] || fail "SOURCE_DATE_EPOCH refused: whole seconds since 1970-01-01 UTC"
          days=$(( epoch / 86400 ))
          weekday=$(( (days + 3) % 7 + 1 ))    # Monday is 1, Sunday is 7; 1970-01-01 was a Thursday
          monday=$(( days + 8 - weekday ))     # the next Monday, always after the clock's day
          thursday=$(( monday + 3 ))           # the Thursday of that ISO week names its year
          z=$(( thursday + 719468 ))
          era=$(( z / 146097 ))
          doe=$(( z - era * 146097 ))
          yoe=$(( (doe - doe / 1460 + doe / 36524 - doe / 146096) / 365 ))
          doy=$(( doe - (365 * yoe + yoe / 4 - yoe / 100) ))
          mp=$(( (5 * doy + 2) / 153 ))
          month=$(( mp < 10 ? mp + 3 : mp - 9 ))
          year=$(( yoe + era * 400 + (month <= 2 ? 1 : 0) ))
          # Day count of January 1st of that year.
          prior=$(( year - 1 ))
          era1=$(( prior / 400 ))
          yoe1=$(( prior - era1 * 400 ))
          jan1=$(( era1 * 146097 + yoe1 * 365 + yoe1 / 4 - yoe1 / 100 + 306 - 719468 ))
          week=$(( (thursday - jan1) / 7 + 1 ))
          yearweek="$(printf '%02d%02d' $(( year % 100 )) "$week")"

          # The serial: 0 for the first release of this head and week, else one above the highest
          # serial a tag of the same head and week uses. A tag of that family with another shape
          # stops the plan instead of being skipped.
          highest=-1
          while IFS= read -r existing; do
            [ -n "$existing" ] || continue
            if [[ ! "$existing" =~ ^moai-adk-v${head}\.${yearweek}\.(0|[1-9][0-9]{0,9})$ ]]; then
              fail "the tag ${existing} does not match moai-adk-v${head}.${yearweek}.{serial}: the serial is 0 or from 1 without a leading zero"
            fi
            [ "${BASH_REMATCH[1]}" -le 4294967295 ] \
              || fail "the tag ${existing} carries the serial ${BASH_REMATCH[1]} over 4294967295"
            if [ "${BASH_REMATCH[1]}" -gt "$highest" ]; then highest="${BASH_REMATCH[1]}"; fi
          done < <(git for-each-ref --format='%(refname:strip=2)' "refs/tags/moai-adk-v${head}.${yearweek}.*")
          serial=$(( highest + 1 ))
          version="${head}.${yearweek}.${serial}"
          tag="moai-adk-v${version}"

          # The name must spell the expected version exactly: a wrong head, week or serial stops
          # here, and a serial a tag already uses is never reused.
          [ "$branch_version" = "$version" ] \
            || fail "the branch spells ${branch_version}, but the version of this release is ${version} (head ${head} from HEADVER, release week ${yearweek}, serial ${serial}); push release/v${version}"

          {
            echo "sha=${PUSHED}"
            echo "head=${head}"
            echo "yearweek=${yearweek}"
            echo "serial=${serial}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
            echo "epoch=${epoch}"
          } >> "$GITHUB_OUTPUT"
          echo "planned ${tag} (pre-release: ${prerelease}) for ${PUSHED}"

  build:
    name: release / build
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      # A release build takes its whole version from the plan, and the plan's clock reading for
      # its build date. MOAI_LOCAL_BUILD and MOAI_BUILD_NUMBER stay unset.
      MOAI_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # The same toolchain step as ci.yml (rust-toolchain.toml, at most 3 attempts).
      - name: Toolchain (rust-toolchain.toml)
        run: |
          channel="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          for attempt in 1 2 3; do
            echo "toolchain install attempt ${attempt}/3 (${channel})"
            rustup toolchain uninstall "$channel" || true
            if rustup toolchain install; then break; fi
            if [ "$attempt" = 3 ]; then
              echo "toolchain install failed after 3 attempts (${channel})" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          rustc -V
      - name: Build
        run: cargo build --release --locked
      - name: Binaries, tag and release note agree
        id: verify
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SERIAL: ${{ needs.plan.outputs.serial }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          fail() { echo "$1" >&2; exit 1; }

          [ "$TAG" = "moai-adk-v${VERSION}" ] || fail "the tag ${TAG} does not spell the version: expected moai-adk-v${VERSION}"
          [ "${VERSION##*.}" = "$SERIAL" ] || fail "the serial ${SERIAL} is not the last number of ${VERSION}"
          case "$REF_NAME" in
            "release/v${VERSION}"|"release/rc/v${VERSION}") ;;
            *) fail "the branch ${REF_NAME} does not spell release/v${VERSION}" ;;
          esac
          for name in moai-cli moai; do
            path="target/release/${name}"
            [ -x "$path" ] || fail "${path} is missing"
            out="$("$path" --version)" || fail "${path} --version failed"
            first="$(printf '%s\n' "$out" | sed -n 1p)"
            second="$(printf '%s\n' "$out" | sed -n 2p)"
            case "$first" in
              "moai ${VERSION} (rust)"|"moai-cli ${VERSION} (rust)") ;;
              *) fail "${path} reports '${first}', expected 'moai ${VERSION} (rust)' or 'moai-cli ${VERSION} (rust)'" ;;
            esac
            case "$second" in
              "release build ${SERIAL} (MOAI_RELEASE_VERSION), built "*) ;;
              *) fail "${path} second line is '${second}', expected it to begin 'release build ${SERIAL} (MOAI_RELEASE_VERSION), built'" ;;
            esac
          done

          if [ "$PRERELEASE" = "true" ]; then mark="yes"; else mark="no"; fi
          {
            echo "## Release note: ${TAG}"
            echo
            echo "- version: ${VERSION}"
            echo "- tag: ${TAG}"
            echo "- commit: ${SHA}"
            echo "- serial: ${SERIAL} (the release number inside its week, counted from 0)"
            echo "- --version: ${first}; release build ${SERIAL} (MOAI_RELEASE_VERSION)"
            echo "- pre-release: ${mark}"
            echo
            echo "This run made no tag and no release and uploaded nothing. Pushing the tag and publishing the release are the person's steps."
          } >> "$GITHUB_STEP_SUMMARY"
