name: SPEC Lint

on:
  pull_request:
    paths:
      - '.moai/specs/**'
      - 'internal/spec/**'
      - '.github/workflows/spec-lint.yml'
      # The baseline file is this gate's own control surface (t525
      # REQ-SLGS-010). Without this path a rebaseline commit that touched
      # nothing else would change the verdict with no run to check it.
      - '.moai/spec-lint-baseline.json'
  # Under GitHub Flow main is the integration branch and lane work reaches it
  # through card PRs, which the pull_request trigger above already covers; the
  # push trigger keeps the lint running on main itself. The retired remote
  # develop branch is no longer listed here.
  push:
    branches:
      - main
    paths:
      - '.moai/specs/**'
      - 'internal/spec/**'
      - '.github/workflows/spec-lint.yml'
      - '.moai/spec-lint-baseline.json'

permissions:
  contents: read

# One slot per ref, for pushes as well as pull requests: on a push to main
# `github.ref` is `refs/heads/main`, so every main push shares a slot and
# a newer push cancels an older run. The comment previously said "for the same
# PR", which is what the group meant before the push trigger existed — and a
# reading of this file went looking for that PR when diagnosing cancellations
# that were in fact job timeouts (t874).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-lint:
    runs-on: ubuntu-latest
    # The lint step alone runs 527-571s (measured across runs 34775055880 and
    # 35260236027), so a 10-minute cap raced the job: every cancelled run sat at
    # 617-622s and every success at 502-601s, split exactly on the 600s line.
    # A cancelled run is neither success nor failure, so the gate stopped
    # producing a verdict at all — two real failures were read past that way.
    # Raising the cap does not weaken the lint; it lets the lint finish and say
    # what it found (t874).
    timeout-minutes: 25
    steps:
      # Version alignment with ci.yml: actions/checkout@v7, actions/setup-go@v7.
      - uses: actions/checkout@v7
        with:
          # SPEC-SPECLINT-GITBLIND-001 (t371) REQ-SLGB-008: full history so
          # StatusGitConsistency and OwnershipTransition walk the real log
          # windows instead of a depth-1 truncation that silently blinds them.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Explicit integration-ref fetch (REQ-SLGB-008). Whether actions/checkout at
      # fetch-depth: 0 populates refs/remotes/origin/* is NOT a verified
      # assumption (SPEC-SPECLINT-GITBLIND-001 §2.3) — this repo integrates
      # through main under GitHub Flow, and the lint's base-ref chain needs a
      # local origin/main either way. Redundant when checkout already fetched
      # it, the fetch costs one command; missing, it costs the lint its eyes
      # again. The former develop refspec was dropped with the GitHub Flow
      # cutover — fetching the retired remote branch failed the whole job with
      # "couldn't find remote ref develop" (run 37316160167).
      - name: Fetch integration refs
        run: git fetch origin main:refs/remotes/origin/main
      - name: Select SPEC lint policy
        id: policy
        shell: bash
        # The policy script previously carried two git-flow branches — a
        # release/* snapshot check keyed to origin/develop and a non-strict
        # path for develop pushes. Both keyed on the retired remote develop
        # branch, so both went with the GitHub Flow cutover: every pull
        # request and main push now takes the default strict, baseline-gated
        # gate.
        run: |
          set -euo pipefail
          strict=true
          reason="default gate for main pushes and ordinary pull requests"
          echo "strict=$strict" >> "$GITHUB_OUTPUT"
          echo "SPEC lint policy: strict=$strict ($reason)"
      - name: Run baseline-gated SPEC lint
        if: steps.policy.outputs.strict == 'true'
        # Invoke the freshly built binary directly via go run instead of
        # `make install` (which pollutes $GOPATH/bin and is unnecessary for
        # a one-shot lint invocation).
        #
        # SPEC-SPECLINT-GATE-SIGNAL-001 (t525) REQ-SLGS-010: gate on the CHANGE,
        # not on the standing inventory. `--strict` escalates every non-advisory
        # warning, so a single standing one makes this gate permanently red and
        # the person who broke something sees the same red as the person who
        # changed nothing. `--baseline` fails only a rule that rose above its
        # recorded count (naming the rule and its delta), always fails an error
        # regardless of the baseline, and prints the warning inventory even
        # while green — so the standing debt stays observable.
        #
        # The path is repo-root-relative: this job sets no working-directory, so
        # it resolves against the checkout root. `--strict` is NOT passed here —
        # the two flags gate the same dimension and the CLI rejects the pair
        # with exit 3; the flag itself is retained for non-CI callers.
        run: go run ./cmd/moai spec lint --baseline .moai/spec-lint-baseline.json
      - name: Run error-only SPEC lint
        if: steps.policy.outputs.strict == 'false'
        # Existing corpus warnings remain visible, while any error still makes
        # the command fail. The baseline gate remains mandatory whenever the
        # inputs, the baseline file, or the implementation of the SPEC linter
        # changed.
        run: go run ./cmd/moai spec lint
