name: Release Drafter

# Enhanced GitHub Flow §18.9 자동화
# PR이 main에 머지될 때마다 next release의 draft notes를 자동 업데이트.
# Draft 내용은 수동으로 CHANGELOG.md에 반영한 후 ./scripts/release.sh 실행.

on:
  push:
    branches:
      - main
  # pull_request 트리거 제거 (2026-05): GitHub Releases API 가 PR ref(refs/pull/N/merge)를
  # target_commitish 로 받지 못하므로 모든 PR check 가 빨간 X 노이즈로 남는 문제 발생.
  # main push 시에만 draft 갱신; PR 단계에서 preview 가 필요하면 workflow_dispatch 사용.
  workflow_dispatch:

permissions:
  contents: read

# Own ref-independent literal group, different from release-drafter-cleanup.yml's
# (SPEC-RELEASE-PIPELINE-001 REQ-RPC-012, amended v0.8.0). GitHub keeps one
# running and one pending run per group, and a newer pending run replaces the
# older pending one, so a group shared with the cleanup would let a drafter run
# replace the pending weekly cleanup. The key must not vary with github.ref (a
# dispatched drafter on any ref must land in the same group), and
# cancel-in-progress stays false. Trade-off, recorded in both workflows
# (plan.md B6): rapid main pushes queue drafter updates serially within this
# group instead of cancelling the older run, and the drafter and the cleanup may
# run at the same time, with the cleanup's per-tag re-query plus idempotent
# delete carrying the safety between them.
concurrency:
  group: release-drafter-mutations
  cancel-in-progress: false

jobs:
  update_release_draft:
    name: Update Release Draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run Release Drafter
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
