# RC repository check set (00-E #2020; OS matrix rc.2 E2 #2194). The targets are the three
# supported platforms (user decision 2026-11-17, SPEC-20261117-supported-platforms, replacing
# the four Unix targets of decision 01:1x(11-09)): Linux x86_64 and macOS arm64 run the check
# set below, Windows x86_64 is windows-build. C-20 (SPEC-20261119-ci-check-set-legs) splits
# that set into two parallel legs per target (`ci / <target> / nextest` and `… / rest`,
# LOCAL_CHECK_LEG in tools/local_check.sh), because nextest and the python unittest were
# 94–97% of its wall time; the required check names are untouched. User decision U10
# (#2554, #1975 comment 6827126248) moves the timing, not the content: a PR to v2026.11.0
# runs linux-x86_64 only — until C-76 (SPEC-20261119-macos-on-pr): a PR whose merged diff
# touches a platform-sensitive path also runs macos-arm64 before merge; the push that merges
# into v2026.11.0 (and workflow_dispatch) always runs linux-x86_64 and macos-arm64 plus
# windows-build with the same check set. The `ci` job
# aggregates the targets of its run so one `ci` check reports the result: the integration
# ruleset 26791615 requires both `moai/audit` and `ci`, the latter from the GitHub Actions app
# (`gh api repos/modu-ai/moai-adk/rules/branches/v2026.11.0`, read 2026-11-17 10:11Z).
# Runner labels: standard GitHub-hosted runners for public repositories, free and unlimited
# (https://docs.github.com/en/actions/reference/runners/github-hosted-runners, read 2026-11-09).
# For `pull_request`, GITHUB_REF is the PR merge branch (refs/pull/<n>/merge), so this runs
# before the RC branch reaches the default branch; first observed on the 00-E PR (AC-00E-2).
name: ci

on:
  pull_request:
    branches: [v2026.11.0]
  push:
    branches: [v2026.11.0]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. A post-merge run on v2026.11.0 is never
# cancelled as a whole: each one is the full-matrix result of one merge (#2554). Only its
# macOS targets may be skipped while still waiting, when a newer merge queues (job-level
# concurrency on `check` below, #2554 D8 (a)).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # C-76 (SPEC-20261119-macos-on-pr): decide the `check` matrix before it runs.
  # #2554 (U10) made a PR run linux-x86_64 only, so a change that breaks only on
  # macOS reached the tip: 47 of the 68 post-merge push failures were macOS-only
  # (.moai/cards-pending/pr-history-analysis-20261117.md). tools/ci_scope.py now
  # answers macos_needed for the PR's merged diff, so a platform-sensitive PR
  # runs macos-arm64 before merge and the aggregate `ci` requires it (it is a
  # `check` matrix entry, like on a push). push and workflow_dispatch keep the
  # full matrix whatever the paths say. Fail-safe: a diff, classifier or parse
  # failure keeps the full matrix; if this job itself fails, `check` is skipped
  # and `ci` goes red — never silently linux-only.
  targets:
    name: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Decide check matrix
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          # C-20 (SPEC-20261119-ci-check-set-legs): every target entry is multiplied by the
          # two legs of the check set, so the check job runs the set as two parallel jobs
          # per target — `ci / <target> / nextest` (fetch, test, doctest) and
          # `ci / <target> / rest` (fetch, clippy, fmt, fmt-ops, unittest, diff-check).
          # nextest and the python unittest were 94–97% of the check set's wall time (card
          # note 2833); the split turns linux ≈15m→9m, macOS ≈36m→20m. Runner and timeout
          # stay per target: the nextest leg is each target's longest pole, and a slow day
          # must not turn into a timeout failure.
          full='[{"target":"linux-x86_64","runner":"ubuntu-24.04","timeout":30,"leg":"nextest"},{"target":"linux-x86_64","runner":"ubuntu-24.04","timeout":30,"leg":"rest"},{"target":"macos-arm64","runner":"macos-15","timeout":45,"leg":"nextest"},{"target":"macos-arm64","runner":"macos-15","timeout":45,"leg":"rest"}]'
          linux='[{"target":"linux-x86_64","runner":"ubuntu-24.04","timeout":30,"leg":"nextest"},{"target":"linux-x86_64","runner":"ubuntu-24.04","timeout":30,"leg":"rest"}]'
          matrix="$full"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ok=0
            # The scope tool is the base checkout's copy (the job checks out the base
            # commit), so a PR never executes its own copy of the rule — the check-guard
            # precedent. Changed paths come from the files API — filename AND
            # previous_filename, so renames and deletions are judged. The API serves at
            # most 3000 files; the truncation guard compares API items (`--jq length`,
            # summed over the pages) with the true total — never the path lines, which a
            # rename serves two of for one item (audit B1). A truncated list keeps the
            # fail-safe full matrix instead of judging a partial one, as does an empty
            # one, a failed API call or a failed total — the runner shell runs this step
            # with -e and pipefail, so every failing call is caught here, not fatal.
            if ! gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --paginate \
              --jq '.[] | (.filename, (.previous_filename // empty))' \
              | sort -u > "$RUNNER_TEMP/ci-scope-files.txt"; then
              echo "ci-scope: the files API failed; full matrix (fail-safe)" >&2
            elif ! listed="$(gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --paginate --jq 'length' | awk '{s += $1} END { print s + 0 }')"; then
              echo "ci-scope: the files API item count failed; full matrix (fail-safe)" >&2
            elif ! total="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json changedFiles --jq .changedFiles)"; then
              echo "ci-scope: the changed-file total failed; full matrix (fail-safe)" >&2
            elif [ "${listed:-0}" -lt "${total:-0}" ]; then
              echo "ci-scope: the files API served $listed of $total changed files; full matrix (fail-safe)" >&2
            elif [ -s "$RUNNER_TEMP/ci-scope-files.txt" ] \
               && result="$(python3 tools/ci_scope.py < "$RUNNER_TEMP/ci-scope-files.txt")" \
               && macos="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["macos_needed"])')"; then
              ok=1
              printf '%s\n' "$result" | python3 -c 'import json,sys; [print("target-reason:", r) for r in json.load(sys.stdin)["macos_reasons"]]'
            fi
            if [ "$ok" = 1 ] && [ "$macos" = "False" ]; then
              matrix="$linux"
            fi
            # ok=0 (truncated or empty listing, API failure, classifier or parse failure)
            # or macos=True: full matrix.
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "matrix: $matrix"

  check:
    name: ci / ${{ matrix.target }} / ${{ matrix.leg }}
    needs: [targets]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    # #2554 D8 (a): on a push, each macOS target shares one group across runs. A running
    # job is never cancelled; a job still waiting is replaced when a newer merge queues
    # ("any existing pending job ... in the same concurrency group will be canceled",
    # docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/
    # control-workflow-concurrency, read 2026-11-13). The newer run's tree contains the
    # skipped merge, so every merge still gets a macOS result, just later (measured before:
    # 12-21 min of macOS runner wait when merges piled up, #2554 comment 6831048630).
    # Only a run's first attempt shares the group: a re-run of an older SHA (the same-SHA
    # re-run that tells a flaky failure apart) would otherwise queue in it and replace the
    # current tip's waiting job, and the tip watch counts that cancel as red (#2739 audit
    # F1, src/flow.rs `tip_ci_judgment`). C-20 (SPEC-20261119-ci-check-set-legs REQ-7):
    # the group is per (macOS target, leg) — the two legs of one target sharing a group
    # would serialize the split inside its own run. Every other job gets a group of its
    # own (run id + attempt + target + leg), so nothing else changes.
    concurrency:
      group: >-
        ${{ github.event_name == 'push' && github.run_attempt == '1'
        && startsWith(matrix.target, 'macos-')
        && format('ci-push-{0}-{1}', matrix.target, matrix.leg)
        || format('ci-run-{0}-{1}-{2}-{3}', github.run_id, github.run_attempt, matrix.target, matrix.leg) }}
      cancel-in-progress: false
    strategy:
      # Every target is a measurement: one failure must not cancel the others.
      fail-fast: false
      # C-76: the `targets` job above decides the list — linux-x86_64 only for a
      # PR with no platform-sensitive path (#2554 U10), linux-x86_64 and
      # macos-arm64 for a platform-sensitive PR and for every push and
      # workflow_dispatch (SPEC-20261117-supported-platforms). C-20: each entry also
      # names its leg of the split check set (SPEC-20261119-ci-check-set-legs).
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: "1"
      # SPEC-20261117-headver-ci-number: HeadVer's build number is the run number on the
      # first attempt only; a re-run keeps run_number, so it builds unnumbered instead.
      MOAI_BUILD_NUMBER: ${{ github.run_attempt == '1' && github.run_number || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # `git diff --check` compares against the PR base commit
      # Docs-only light CI (#2527, design comment 6822993459): classify the diff and
      # skip the heavy steps when every changed path is under a verified-safe doc root.
      # Fail-safe: any git or parse failure, or an unrecognized path, keeps scope "full".
      - name: Scope (docs-only detection)
        shell: bash
        run: |
          CI_SCOPE=full
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          # --no-renames (#2538 B1): a rename must reach the classifier as
          # delete(old)+add(new) so renaming or deleting a test-consumed doc still
          # exposes the denied source path; plain --name-only omits the source.
          if paths="$(git diff --name-only --no-renames "${base}...${GITHUB_SHA}" 2>/dev/null)"; then
            result="$(printf '%s\n' "$paths" | python3 tools/ci_scope.py)"
            CI_SCOPE="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["scope"])')"
            printf '%s\n' "$result" | python3 -c 'import json,sys; [print("scope-reason:", r) for r in json.load(sys.stdin)["reasons"]]'
          else
            echo "scope-reason: git diff failed; defaulting to full"
          fi
          echo "CI_SCOPE=$CI_SCOPE" >> "$GITHUB_ENV"
          echo "scope: $CI_SCOPE"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install PyYAML (tests/github_assets_test.py)
        if: ${{ env.CI_SCOPE == 'full' }}
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
      - name: Install and verify ripgrep (C10a baseline)
        if: ${{ env.CI_SCOPE == 'full' }}
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            case "$RUNNER_OS" in
              Linux)
                exec bash tools/ci-install-ripgrep.sh
                ;;
              macOS)
                brew install ripgrep
                ;;
              *)
                echo "ripgrep installation is not configured for $RUNNER_OS" >&2
                exit 1
                ;;
            esac
          fi
          rg --version
      # rustup reads rust-toolchain.toml (#2029). A runner can start with a partially installed
      # copy of the pinned toolchain (rustup#4724); repairing it in place can fail with a
      # component file conflict (rustup#2417), so remove it first and install explicitly, with
      # at most 3 attempts (#2490, user decision 6813237309 item 3 = B; analysis #2457 6812694378).
      - name: Toolchain (rust-toolchain.toml)
        if: ${{ env.CI_SCOPE == 'full' }}
        shell: bash
        run: |
          channel="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          for attempt in 1 2 3; do
            echo "toolchain install attempt ${attempt}/3 (${channel})"
            rustup toolchain uninstall "$channel" || true
            if rustup toolchain install; then break; fi
            if [ "$attempt" = 3 ]; then
              echo "toolchain install failed after 3 attempts (${channel})" >&2
              exit 1
            fi
            echo "toolchain install attempt ${attempt}/3 failed; removing ${channel} and retrying" >&2
            sleep $((attempt * 10))
          done
          rustc -V
          rustup show
      # Dependency cache (#2554; replaces the RC1 interim strategy B, decisions 2026-11-08
      # 17:4x, released by the leader in #2554 comment 6827136046). Swatinem/rust-cache keeps
      # ~/.cargo and the dependencies' build output only — workspace crates are always
      # rebuilt — keyed by rustc host/version, Cargo.lock/Cargo.toml and the toolchain file.
      # Only push runs on v2026.11.0 save; a PR run restores the base branch's entry and
      # cannot write it (GitHub scopes a PR's cache to refs/pull/<n>/merge).
      - name: Dependency cache
        id: cache
        if: ${{ env.CI_SCOPE == 'full' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Leader repair N2 (2026-11-19): one entry per leg. The legs are separate jobs
          # with one target folder each, so a shared key would have the two leg jobs of a
          # push overwrite each other's saved entry; the prefix keeps the entries apart.
          key: leg-${{ matrix.leg }}
          save-if: ${{ github.event_name == 'push' }}
      # #2554 2-1 (leader 6827616388): `cargo test` runs the ~120 test binaries one after
      # another (11-25 min of run time per target); cargo-nextest runs them in parallel with
      # the same tests. Pinned release assets of nextest-rs/nextest `cargo-nextest-0.9.151`,
      # checked against the sha256 recorded here (equal to the release's .sha256 files, read
      # 2026-11-12). A download or checksum failure fails the job; there is no fallback.
      # C-20 (SPEC-20261119-ci-check-set-legs REQ-6): the nextest leg only — the rest leg
      # runs no nextest step, so it downloads nothing.
      - name: cargo-nextest (pinned, sha256-checked)
        if: ${{ env.CI_SCOPE == 'full' && matrix.leg == 'nextest' }}
        shell: bash
        run: |
          version=0.9.151
          case "${{ matrix.target }}" in
            linux-x86_64) asset=x86_64-unknown-linux-gnu; sum=1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4 ;;
            macos-arm64) asset=universal-apple-darwin; sum=d1d7d025d4bfc9fb154cd76aea3949bd78534829a0589abefa6e5dd4edb135dd ;;
            *) echo "no pinned cargo-nextest asset for ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          file="$RUNNER_TEMP/cargo-nextest-${version}-${asset}.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$file" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${version}/cargo-nextest-${version}-${asset}.tar.gz"
          actual="$( (sha256sum "$file" 2>/dev/null || shasum -a 256 "$file") | cut -d' ' -f1)"
          if [ "$actual" != "$sum" ]; then
            echo "cargo-nextest checksum mismatch: expected $sum, got $actual" >&2
            exit 1
          fi
          mkdir -p "$HOME/.cargo/bin"
          tar xzf "$file" -C "$HOME/.cargo/bin" cargo-nextest
          cargo nextest --version
      # C-20 (SPEC-20261119-ci-check-set-legs): the rest leg's python unittest runs tests
      # that execute ${CARGO_TARGET_DIR:-target}/debug/moai-cli (tests/self_audit_run.py,
      # tests/heavy_check_slot_test.py and friends). The single check set relied on nextest
      # having linked that binary earlier in the same job; the rest leg never links one
      # (clippy checks, it does not codegen), so build it here — without `--offline`,
      # because on a cold dependency cache (a PR whose Cargo.lock moved past the base's
      # cache entry) the runner has fetched nothing yet. The nextest leg needs no build:
      # its own steps link every test binary.
      - name: Build moai-cli (unittest input)
        if: ${{ env.CI_SCOPE == 'full' && matrix.leg == 'rest' }}
        shell: bash
        run: cargo build --locked --bin moai-cli
      - name: Check set
        shell: bash
        env:
          # C-20 (SPEC-20261119-ci-check-set-legs REQ-6): the leg reaches the script
          # through env:, never an expression inside run:.
          LOCAL_CHECK_LEG: ${{ matrix.leg }}
        run: |
          set -u
          # Docs-only light CI (#2527, design comment 6822993459): heavy steps are skipped
          # above via CI_SCOPE; here run only the whitespace check and emit a minimal
          # summary (runner + scope), then succeed. Fail-safe: anything not classified
          # docs-only takes the full path below, unchanged.
          if [ "$CI_SCOPE" = "docs-only" ]; then
            {
              echo "## ci / ${{ matrix.target }} / ${LOCAL_CHECK_LEG}"
              echo
              echo "- runner: \`${{ matrix.runner }}\` · \`$(uname -sm)\` · scope: \`docs-only\`"
              echo
              echo "docs-only: 3 heavy steps skipped (paths all under verified-safe doc roots)"
            } >> "$GITHUB_STEP_SUMMARY"
            git diff --check "${{ github.event.pull_request.base.sha || 'HEAD~1' }}...${{ github.event.pull_request.head.sha || 'HEAD' }}"
            exit 0
          fi
          summary="$GITHUB_STEP_SUMMARY"
          failed=0
          {
            echo "## ci / ${{ matrix.target }} / ${LOCAL_CHECK_LEG}"
            echo
            echo "- runner: \`${{ matrix.runner }}\` · \`$(uname -sm)\` · rust host \`$(rustc -vV | sed -n 's/^host: //p')\`"
            echo "- tree: \`${{ github.event.pull_request.head.sha || github.sha }}\` (head) · merge ref \`$GITHUB_SHA\`"
            echo "- toolchain: \`$(rustc --version)\` · \`$(cargo --version)\` · \`$(python --version)\`"
            # The dependency cache above only saves the download and dependency build; the
            # set fetches once against Cargo.lock and then runs offline.
            echo "- dependencies: rust-cache hit \`${{ steps.cache.outputs.cache-hit }}\` (saved by push runs only); fetched with \`cargo fetch --locked\` before the offline steps"
            # #2452: test threads get 8 MiB. In debug builds `Cli::command()` needs about 2000 KiB
            # of the 2 MiB default (measured on #2016 comment 6790101536) and grows about 4 KiB per
            # subcommand. RUST_MIN_STACK sets the stack of spawned threads, which libtest uses
            # (https://doc.rust-lang.org/std/thread/index.html, read 2026-11-11).
            echo "- test threads: \`RUST_MIN_STACK=8388608\` (#2452)"
            echo
            echo "| step | command | exit |"
            echo "| --- | --- | --- |"
          } >> "$summary"
          # #2906 S5a (AC20): the check steps live in tools/local_check.sh, the one local check
          # set lanes also run, so CI and the local run cannot drift apart. KEEP_GOING keeps
          # this job's rule (every step runs and gets a summary row with its exit); the
          # script's last line is its `local-check:` record. The step shell runs with
          # -e -o pipefail, so the exit is kept, not raised. This checkout already is the merge
          # ref, so the script runs in place (#3066 P2); a local run checks a candidate
          # (the head merged with the latest base tip) instead.
          LOCAL_CHECK_MODE=in-place LOCAL_CHECK_KEEP_GOING=1 LOCAL_CHECK_BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}" LOCAL_CHECK_DIFF_HEAD="${{ github.event.pull_request.head.sha || 'HEAD' }}" bash tools/local_check.sh || failed=1
          # macOS-only cases (#2194): cfg(target_os = "macos") Rust tests are compiled out on
          # Linux and darwin-gated Python tests are skipped; report per target which of them
          # ran, so a Linux pass is never read as a macOS-only measurement (AC-08C-7).
          # C-20 (SPEC-20261119-ci-check-set-legs): each leg reports only its own cases —
          # the Rust rows read the nextest leg's ci-test.log, the python rows the rest leg's
          # ci-unittest.log; a leg without that log never reports the other leg's cases.
          # The step shell is `bash -eo pipefail`: a grep with no match exits 1, so every
          # grep below ends in `|| true` (without it the Linux targets failed after a green
          # check set, CI run 42618040618).
          {
            echo
            echo "### macOS-only cases"
            echo
            echo "| case | gate | outcome on this leg |"
            echo "| --- | --- | --- |"
            if [ "${LOCAL_CHECK_LEG:-}" != rest ]; then
              for t in e2e_never_writes_outside_temp_home privacy_06_operations_need_no_network; do
                # nextest line: `PASS [   0.282s] ( 1/25) moai-cli::<binary> <test>`; report its status word.
                line=$({ grep -E "^ *[A-Z-]+ +\[[^]]*\] +(\([^)]*\) +)?[^ ]+ ${t}\$" ci-test.log || true; } | head -n 1 | awk '{print $1}')
                echo "| \`${t}\` | \`#[cfg(target_os = \"macos\")]\` | ${line:-not compiled on this target} |"
              done
            fi
            if [ "${LOCAL_CHECK_LEG:-}" != nextest ]; then
              for t in e2e_host_claude_verdict_test e2e_receipt_not_run_test; do
                n=$(grep -cE "\(${t}\.[A-Za-z]+\.[a-z_0-9]+\) \.\.\. skipped" ci-unittest.log || true)
                r=$(grep -cE "\(${t}\.[A-Za-z]+\.[a-z_0-9]+\) \.\.\. ok" ci-unittest.log || true)
                echo "| \`${t}\` | \`skipUnless(sys.platform == \"darwin\" …)\` | ok ${r} · skipped ${n} |"
              done
            fi
          } >> "$summary"
          exit "$failed"
      # C-101 (SPEC-20261119-ci-smoke-step): the smoke harness the lanes and auditors share
      # (tools/smoke/run.sh, SPEC-20261119-smoke-harness) boots the debug binary this job
      # built in an empty temporary HOME and a temporary git project, so a lane's "I ran the
      # smoke" is checked here too. The install and update areas run on every full-scope run
      # (a few seconds each); a docs-only run skips it with the heavy steps above. The step
      # builds the binary first (a no-op when the check set left it) instead of relying on
      # where nextest leaves it, runs both areas even when the first fails, and fails the job
      # after the second. Each area's last line goes to the job summary.
      - name: Smoke harness (install, update)
        if: ${{ env.CI_SCOPE == 'full' }}
        shell: bash
        run: |
          set -u
          cargo build --offline --locked --bin moai-cli
          bin="${CARGO_TARGET_DIR:-target}/debug/moai-cli"
          failed=0
          for area in install update; do
            code=0
            tools/smoke/run.sh "$area" --bin "$bin" > "ci-smoke-$area.log" 2>&1 || code=$?
            cat "ci-smoke-$area.log"
            echo "- smoke $area: exit $code · \`$(tail -n 1 "ci-smoke-$area.log")\`" >> "$GITHUB_STEP_SUMMARY"
            [ "$code" -eq 0 ] || failed=1
          done
          exit "$failed"

  # C-83 (SPEC-20261117-ci-superseded-neutral, design D6 "superseded cancels are neutral"): on a
  # push, a macOS target replaced while waiting by a newer merge (D8 (a) above) leaves the matrix
  # result `cancelled` with no failed test; 40 of 80 push runs read red for that alone. Only
  # then this job asks tools/ci_superseded.py (tests/ci_superseded_test.py) whether every target
  # passed or was superseded; `state=superseded` skips `ci` (a neutral check), anything else
  # lets `ci` run and fail. Pull requests never run it, so `ci` behaves there as before.
  ci-verdict:
    name: ci-verdict
    if: ${{ !cancelled() && github.event_name == 'push' && needs.check.result == 'cancelled' }}
    needs: [check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      state: ${{ steps.verdict.outputs.state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Superseded or failed
        id: verdict
        env:
          EVENT: ${{ github.event_name }}
          CHECK_RESULT: ${{ needs.check.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I tools/ci_superseded.py | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  ci:
    name: ci
    # !cancelled() (#2312): a failed target must fail this check, not skip it (a job without
    # a status function gets the default success() and is skipped, which reads as neutral);
    # a run cancelled by cancel-in-progress stays cancelled instead of always() reporting it
    # as a failure. GitHub's recommended alternative to always():
    # https://docs.github.com/en/actions/reference/workflows-and-actions/expressions (2026-11-09).
    # C-83: skipped only when ci-verdict found the run superseded; ci-verdict skipped or failed
    # leaves the condition true, so the step below decides as before.
    if: ${{ !cancelled() && needs.ci-verdict.outputs.state != 'superseded' }}
    needs: [check, ci-verdict]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All targets passed
        shell: bash
        run: |
          echo "check: ${{ needs.check.result }}"
          echo "## ci: all targets ${{ needs.check.result }}" >> "$GITHUB_STEP_SUMMARY"
          [ "${{ needs.check.result }}" = "success" ]

  # E3 #2195 (decision 01:1x(11-09): Windows is build + self-replace only, support table
  # not_run). Windows x86_64 is a supported platform since 2026-11-17
  # (SPEC-20261117-supported-platforms); running its tests here is a later slice of that work.
  # Compile all targets, including portable test targets, without running tests.
  # Unix-only test setup is cfg(unix)-gated; Windows runtime replacement and host loading
  # remain not_run.
  # Standard GitHub-hosted runner, no secrets. Not part of the required `ci` check.
  # #2554 (U10): runs after merge (push to v2026.11.0) and on workflow_dispatch, not on PRs.
  windows-build:
    name: windows-build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: never
      # SPEC-20261117-headver-ci-number: HeadVer's build number is the run number on the
      # first attempt only; a re-run keeps run_number, so it builds unnumbered instead.
      MOAI_BUILD_NUMBER: ${{ github.run_attempt == '1' && github.run_number || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The scope step below diffs against HEAD~1; with the default depth of 1 that
          # commit is absent, the diff fails and every push ran full (#2554 comment
          # 6860912842, decision 6861024531). Two commits are enough for a push.
          fetch-depth: 2
      # Docs-only light CI (#2527, design comment 6822993459): same classifier as the
      # check job; fail-safe to full on any git or parse failure.
      - name: Scope (docs-only detection)
        shell: bash
        run: |
          CI_SCOPE=full
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          # --no-renames (#2538 B1): a rename must reach the classifier as
          # delete(old)+add(new) so renaming or deleting a test-consumed doc still
          # exposes the denied source path; plain --name-only omits the source.
          if paths="$(git diff --name-only --no-renames "${base}...${GITHUB_SHA}" 2>/dev/null)"; then
            result="$(printf '%s\n' "$paths" | python3 tools/ci_scope.py)"
            CI_SCOPE="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["scope"])')"
            printf '%s\n' "$result" | python3 -c 'import json,sys; [print("scope-reason:", r) for r in json.load(sys.stdin)["reasons"]]'
          else
            echo "scope-reason: git diff failed; defaulting to full"
          fi
          echo "CI_SCOPE=$CI_SCOPE" >> "$GITHUB_ENV"
          echo "scope: $CI_SCOPE"
      - name: Toolchain (rust-toolchain.toml)
        if: ${{ env.CI_SCOPE == 'full' }}
        shell: bash
        run: |
          rustc -V
          rustup show
      - name: Fetch (Cargo.lock)
        if: ${{ env.CI_SCOPE == 'full' }}
        shell: bash
        run: cargo fetch --locked
      - name: Build all targets (tests compiled, not run)
        if: ${{ env.CI_SCOPE == 'full' }}
        shell: bash
        run: |
          cargo build --offline --locked --all-targets
          {
            echo "## windows-build"
            echo
            echo "- toolchain: \`$(rustc --version)\` on \`$RUNNER_OS\` / \`$RUNNER_ARCH\`"
            echo "- \`cargo build --offline --locked --all-targets\`: exit 0 — tests compiled, not run"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Docs-only note
        if: ${{ env.CI_SCOPE == 'docs-only' }}
        shell: bash
        run: |
          echo "docs-only: build skipped (paths all under verified-safe doc roots; #2527)"
          echo "## windows-build" >> "$GITHUB_STEP_SUMMARY"
          echo "docs-only: build skipped (paths all under verified-safe doc roots; #2527)" >> "$GITHUB_STEP_SUMMARY"
