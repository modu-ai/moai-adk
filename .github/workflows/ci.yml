name: CI

# Template Internal-Content Isolation Policy:
# The 'Run tests with coverage' step in the `test` job below executes
# `go test ./...` which includes TestTemplateNoInternalContentLeak in
# internal/template/internal_content_leak_test.go. This test enforces
# CLAUDE.local.md §25 (Template Internal-Content Isolation): the template
# directory (internal/template/templates/) must not contain moai-adk
# dev-internal-content tokens (SPEC IDs, REQ/AC tokens, audit citations,
# internal session dates, internal archive paths, internal commit SHAs,
# internal memory hash references). Failure mode:
# TestTemplateNoInternalContentLeak reports offending file path + leak
# class. Policy rationale memory feedback:
# /Users/goos/.claude/projects/-Users-goos-MoAI-moai-adk-go/memory/feedback_template_internal_content_isolation.md

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]  # main으로 향하는 모든 PR에서 CI 실행
  # Enabling change only. A workflow_dispatch trigger becomes dispatchable
  # only once the file carrying it exists on the default branch, so this does
  # NOT make the workflow dispatchable against a feature branch today — it
  # makes a future card able to run this workflow on demand.
  workflow_dispatch:

# Least-privilege baseline. Job-level overrides (none needed here — this
# workflow only reads + uploads coverage to Codecov). Codecov upload does
# not require a write scope on GITHUB_TOKEN; the codecov-action uses its
# own CODECOV_TOKEN. Artifact upload (upload-artifact) needs no extra scope.
permissions:
  contents: read

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Detect: paths-filter to classify PR diff as docs-only or go-code
  # SPEC-V3R4-CI-FASTTRACK-001 REQ-CIFT-001 — AD-001/AD-002
  # ---------------------------------------------------------------------------
  detect:
    name: Detect (paths-filter)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go_code: ${{ steps.f.outputs.go_code }}
    steps:
      - uses: actions/checkout@v7
      # go_code covers BOTH Go sources AND the non-Go repo inputs the Go test
      # suite reads (`go test ./...` in the `test` job). A PR that moves or
      # edits any of the non-Go roots below can turn the suite red with zero
      # .go files changed; without them in the filter the skip-marker stub
      # satisfies the required check over a broken tree — exactly what #1557
      # did (moved .moai/config/astgrep-rules/ → .moai/astgrep-rules/, three
      # internal/astgrep tests went FAIL, filter read "no Go changes", stub
      # reported green). Evidence per root — the test file that reads it:
      #   .moai/**                        internal/astgrep/gar_rule_test.go (shipped rule file, fail-loud)
      #   internal/template/templates/**  internal/spec/catalog_hash_test.go + internal/template parity tests
      #   internal/template/catalog.yaml  internal/spec/catalog_hash_test.go (fail-loud)
      #   .claude/agents/**               internal/template/agent_askuser_audit_test.go (walks .claude/agents/**)
      #                                    + manager_lead_depth_test.go + haiku_effort_guard_test.go
      #   .claude/rules/moai/**           internal/config/token_budget_guard.go (always-loaded budget walk)
      #   .claude/output-styles/moai/**   internal/config/token_budget_guard.go (fixed surface slot)
      #   CLAUDE.md                       internal/config/token_budget_guard.go (fixed surface slot)
      #   .claude/settings.json           internal/config/toolpolicy/drift_check_test.go (permissions block vs tool-policy.yaml, fail-loud)
      #   scripts/ci-census/**            the test steps below shell out to it;
      #                                    without it here, a PR that edits the
      #                                    census alone gets the skip-marker
      #                                    stub and the edit is never exercised
      # dorny/paths-filter matches with picomatch {dot: true}, so `**` also
      # traverses the dot-directories inside templates/ (.claude/, .moai/).
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            go_code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - '.github/workflows/codeql.yml'
              - '.moai/**'
              - 'internal/template/templates/**'
              - 'internal/template/catalog.yaml'
              - '.claude/agents/**'
              - '.claude/rules/moai/**'
              - '.claude/output-styles/moai/**'
              - '.claude/settings.json'
              - 'CLAUDE.md'
              - 'scripts/ci-census/**'

  # ---------------------------------------------------------------------------
  # Test: Run tests with coverage (fast — NO race detector). The race
  # detector moved to the separate `test-race` job (advisory, non-required):
  # the ~9-min race runtime was dominated by internal/cli exec.Command tests
  # + internal/hook/mx ast-grep scans, which -race amplifies. This job keeps
  # ast-grep/vet/MX-assertion/coverage and remains the merge gate; it runs
  # WITHOUT -race (~2-3 min) for faster PR feedback.
  # Gated by detect: only runs when go_code changes are present
  # ---------------------------------------------------------------------------
  # SPEC-V3R6-CI-PR-SPEEDUP-001 — PR-scope test matrix is ubuntu-only.
  # GitHub Actions considers a workflow run unfinished until every non-cancelled
  # job completes, so the macOS/Windows legs ran to completion even though they
  # were never required checks — each PR's CI wall-time stretched toward an
  # hour, blocking any caller holding a `gh pr checks --watch`.
  # Cross-platform runtime coverage (macOS + Windows race + MX validator) moved
  # to release time via .github/workflows/release-pr-multi-os.yml (full 3-OS
  # matrix on `release/*` → main PRs). Cross-compilation coverage stays on every
  # PR via the `build` job below, which both builds the binary and vets the
  # packages (the vet step is what compiles _test.go for each target platform —
  # `go build ./cmd/moai/` does not).
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: detect
    if: needs.detect.outputs.go_code == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # SPEC-V3R4-CI-INFRA-FIX-001 D-3 (C-Scope-1): drift walker test 가 full git history 필요

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # ast-grep supplies the `sg` binary that the internal/cli and
      # internal/astgrep rewrite guards shell out to. Without it those guards
      # skip, and a reverted implementation still goes green — the guards have
      # to actually run here to mean anything.
      # The version is pinned because the rewrite path parses sg's output, so an
      # unreviewed upgrade can change behaviour. Bump it deliberately.
      - name: Install ast-grep (provides `sg`)
        run: npm install -g @ast-grep/cli@0.40.5

      # Ubuntu and Debian ship /usr/bin/sg as a newgrp alternative, so `sg` being
      # on PATH proves nothing about what it is. Assert the binary is ast-grep.
      # Failing loudly here is the point: a silent skip of every rewrite guard is
      # the failure this step exists to prevent.
      - name: Verify `sg` resolves to ast-grep
        shell: bash
        run: |
          if ! sg --version 2>&1 | grep -qi 'ast-grep'; then
            echo "FAIL: 'sg' on PATH is not ast-grep — every rewrite guard would silently skip."
            echo "resolved to: $(command -v sg || echo '<not found>')"
            sg --version 2>&1 || true
            exit 1
          fi
          echo "PASS: $(sg --version)"

      # internal/web's app.js data-loss guards shell out to the committed
      # testdata/appjs_fire_probe.py, and requirePython3 (appjs_fire_guard_test.go)
      # SKIPS when python3 is absent from PATH — measured: all three of
      # TestAppJsFireSandboxPairing / SandboxRouting / ReductionDeclaration skip and
      # the package still reports `ok`, so a runner that loses python3 empties the
      # guards while this job stays green. Same shape, same reason as the `sg` check
      # above: fail loudly here rather than pass on an unmeasured guard.
      - name: Verify python3 is present (app.js data-loss guards skip without it)
        shell: bash
        run: python3 --version

      - name: Run go vet
        run: go vet ./...

      # `shell: bash` is load-bearing: the windows runner defaults to PowerShell,
      # which parses `if [ ... ]; then` as a syntax error and fails the job before
      # any test runs. Every step in this job that uses POSIX shell syntax must
      # declare it explicitly (issue #1225).
      #
      # `shell: bash` also turns on `-o pipefail`, which the previous form of this
      # check could not survive: grep exits 1 when it matches nothing, and matching
      # nothing is exactly the passing state here. Capturing the matches once and
      # testing for emptiness keeps the check independent of grep's exit code.
      - name: Assert zero exec.Command in MX validator (AC-UTIL-001-04)
        shell: bash
        run: |
          matches=$(grep -rn "exec\.Command\|\"os/exec\"" internal/hook/mx/ --include="*.go" | grep -v "_test\.go" | grep -v "complexity/" || true)
          if [ -n "$matches" ]; then
            echo "FAIL: exec.Command found in internal/hook/mx/ (AC-UTIL-001-04):"
            echo "$matches"
            exit 1
          fi
          echo "PASS: zero exec.Command in internal/hook/mx/ (AC-UTIL-001-04)"

      # Windows-specific MX validator race test (AC-UTIL-001-05) was here.
      # Moved to release-pr-multi-os.yml's windows leg at release time
      # (SPEC-V3R6-CI-PR-SPEEDUP-001).

      # test-census.sh is a reporter: it exits 0 on any readable stream, so a
      # census whose output is wrong never turns the test step below red.
      # census-check.sh diffs the census output on a committed fixture against
      # the expected text, and is the only thing that fails when it breaks.
      - name: Check test census against its fixture
        shell: bash
        run: bash scripts/ci-census/census-check.sh

      # `-json` writes a per-test event stream to a FILE, so the console keeps
      # its one-line-per-package shape while the run stops being unreadable
      # after the fact: without it, rc=0 cannot distinguish "the test passed"
      # from "the test skipped" from "the selector matched nothing".
      #
      # `|| rc=$?` is load-bearing and MUST NOT be "simplified" to `; rc=$?`.
      # GitHub Actions runs this body under `bash --noprofile --norc -e -o
      # pipefail`; under `-e` the shell exits AT a failing `go test`, so the
      # census would never print on exactly the run where it is wanted. The
      # two forms are indistinguishable on a green run.
      #
      # stdout ONLY. Redirecting `2>&1` would corrupt the stream.
      # Coverage is unchanged: Codecov reads the coverage.out FILE, not stdout.
      - name: Run tests with coverage (fast — no race detector)
        shell: bash
        run: |
          rc=0
          go test -json -coverprofile=coverage.out -covermode=atomic ./... > test-stream.json || rc=$?
          bash scripts/ci-census/test-census.sh test-stream.json
          exit $rc

      # always() on both steps: the red run is the one whose stream is worth
      # reading, and the house artifact convention (ci.yml build job) does not
      # carry always() — that is this SPEC's own addition.
      - name: Compress test event stream
        if: always()
        shell: bash
        run: |
          if [ -f test-stream.json ]; then gzip -f test-stream.json; fi

      - name: Upload test event stream
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-stream-ci-test-ubuntu-latest
          path: test-stream.json.gz
          retention-days: 7
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Race Test: race detector in a separate advisory, non-required job.
  # Split from the required `test` job so the ~9-min race runtime no longer
  # blocks the PR feedback loop. NOT continue-on-error: a race failure must
  # surface as a visible failure on the PR. This is non-blocking because
  # "Race Test" is a NEW check name NOT in branch-protection required checks
  # (required: Test (ubuntu-latest), Lint, Build (linux/amd64), Analyze (Go),
  # Release PR Multi-OS Gate) — those stay green-mergeable regardless of this
  # job's result. (continue-on-error:true would HIDE race failures by forcing
  # success — the opposite of advisory+visible.)
  # Skipped on release/* PRs: those already run the same ubuntu race detector
  # (`go test -race ./...`) through release-pr-multi-os.yml's ubuntu leg, whose
  # `Release PR Multi-OS Gate` IS required — so this advisory job would only
  # duplicate ~9 min of an identical run (PR #1564 follow-up). push events to
  # main carry no head_ref, so !startsWith() is true there and they keep this
  # job as their only race run.
  # ---------------------------------------------------------------------------
  test-race:
    name: Race Test
    needs: detect
    if: needs.detect.outputs.go_code == 'true' && !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # ast-grep is needed because internal/cli rewrite-guard tests shell out
      # to `sg`; without it those tests skip and the race run misses the very
      # exec.Command paths that dominate race runtime (internal/cli ~379s/70%).
      - name: Install ast-grep (provides `sg`)
        run: npm install -g @ast-grep/cli@0.40.5

      # See the `test` job's test step for why `|| rc=$?` (not `; rc=$?`) and
      # why only stdout is redirected.
      - name: Run race detector across all packages
        shell: bash
        run: |
          rc=0
          # -timeout is per test binary, not per job: Go's 10m default kills
          # internal/cli, whose -race runtime measures 546-1183s. 20m clears that
          # ceiling while staying inside this job's timeout-minutes: 25 budget.
          go test -json -race -count=1 -timeout 20m ./... > test-stream.json || rc=$?
          bash scripts/ci-census/test-census.sh test-stream.json
          exit $rc

      - name: Compress test event stream
        if: always()
        shell: bash
        run: |
          if [ -f test-stream.json ]; then gzip -f test-stream.json; fi

      - name: Upload test event stream
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-stream-ci-race-ubuntu-latest
          path: test-stream.json.gz
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Test Skip-Marker: For docs-only PRs, emit SUCCESS for required check names
  # without running the actual Go test suite.
  # SPEC-V3R4-CI-FASTTRACK-001 REQ-CIFT-001 — branch-protection name match
  # Critical: name MUST match exactly "Test (${{ matrix.os }})" for required check compat
  # SPEC-V3R6-CI-PR-SPEEDUP-001 — matrix narrowed to ubuntu-latest to mirror the
  # real `test` job's matrix exactly. Required-check parity is name-based: this
  # job MUST emit the SAME check-name set as `test`, or branch protection waits
  # forever for a status that will not arrive.
  # ---------------------------------------------------------------------------
  test-skip-marker:
    name: Test (${{ matrix.os }})
    runs-on: ubuntu-latest
    needs: detect
    timeout-minutes: 5
    # Complement of the real `test` job, so exactly one of the two always runs
    # and the required context Test (ubuntu-latest) is ALWAYS reported.
    # EC-1 mutual exclusivity still holds: this is the strict negation of the real
    # job's `go_code == 'true'`, so a mixed PR (docs + Go) runs the real test only.
    #
    # Previously this was gated on `docs_only == 'true'`, which is NARROWER than
    # "not go_code": a PR touching only files in neither filter — .gitignore, a
    # shell script, e2e/**, any root config — matched neither job, so the required
    # context was never reported and the PR could never merge (GitHub waits
    # forever for a status that will not arrive). Gating on the negation closes
    # that hole for every non-Go change, not just documentation.
    if: needs.detect.outputs.go_code != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      # Observability for the stub path: the skip reason goes to the run
      # summary ($GITHUB_STEP_SUMMARY), not only a step log line, so a reviewer
      # opening the run sees WHY no Go test executed on this change. The
      # #1557 class of failure — stub green over a broken tree — was invisible
      # precisely because the skip carried no visible explanation. The filter
      # list is referenced by pointer (detect job), never duplicated here, so
      # the two surfaces cannot drift apart.
      - name: Skip (no Go-code inputs changed)
        shell: bash
        run: |
          echo "No Go-code changes per paths-filter — Go test matrix skipped; required check satisfied."
          {
            echo "### Test (ubuntu-latest): skipped by paths-filter"
            echo ""
            echo "The \`detect\` job classified this change as containing no \`go_code\`"
            echo "inputs, so the Go test matrix did not run and this stub job"
            echo "satisfies the required check."
            echo ""
            echo "- Filter definition: \`.github/workflows/ci.yml\` — job \`detect\`, step \`f\` (\`go_code\`)"
            echo "- If this change moved or edited a file the Go tests read (see the"
            echo "  non-Go input roots listed in that filter) and the suite should"
            echo "  have run, add the path to the filter — a skip here means NO Go"
            echo "  test ran on this change."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Integration Tests: Harness Learning Subsystem (SPEC-V3R3-HARNESS-LEARNING-001)
  # build tag `integration`으로 격리된 통합 테스트를 별도 job으로 실행한다.
  # Depends on test: if test is skipped (docs-only PR), this also skips naturally.
  # ---------------------------------------------------------------------------
  test-integration:
    name: Integration Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # SPEC-V3R4-CI-INFRA-FIX-001 D-3 (C-Scope-1): drift walker test 가 full git history 필요

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # See the `test` job's test step for why `|| rc=$?` (not `; rc=$?`) and
      # why only stdout is redirected. 3-OS matrix: the artifact name carries
      # matrix.os, or the three legs collide on upload.
      - name: Run harness integration tests
        shell: bash
        run: |
          rc=0
          go test -json -tags=integration -race -timeout 180s ./test/integration/harness/... > test-stream.json || rc=$?
          bash scripts/ci-census/test-census.sh test-stream.json
          exit $rc

      - name: Compress test event stream
        if: always()
        shell: bash
        run: |
          if [ -f test-stream.json ]; then gzip -f test-stream.json; fi

      - name: Upload test event stream
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-stream-ci-integration-${{ matrix.os }}
          path: test-stream.json.gz
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Lint: Static analysis with golangci-lint (always runs — fast, required check)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # SPEC-V3R4-CI-INFRA-FIX-001 D-3 (C-Scope-1): drift walker test 가 full git history 필요

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint from source
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      # templ codegen drift guard (SPEC-WEB-CONSOLE-006): the committed *_templ.go
      # files are source artifacts. Regenerate from the *.templ sources and fail if
      # the committed output is stale. golangci-lint skips the generated files via
      # their `// Code generated by templ - DO NOT EDIT.` header (default exclusion).
      - name: Verify templ codegen is not stale
        run: |
          go run github.com/a-h/templ/cmd/templ generate -path ./internal/web
          git diff --exit-code -- 'internal/web/*_templ.go'

      # Format gate: gofmt-clean is required on every push. Runs the same
      # predicate as `make fmt-check` (tracked .go files) — on a clean CI
      # checkout this is equivalent to whole-tree `gofmt -l .`.
      - name: Check formatting (gofmt)
        run: make fmt-check

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

      - name: Build moai binary for agent lint
        run: go build -o ./bin/moai ./cmd/moai/

      - name: Run moai agent lint
        run: ./bin/moai agent lint

  # ---------------------------------------------------------------------------
  # Build: Cross-compile for all target platforms (always runs — required check)
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # SPEC-V3R4-CI-INFRA-FIX-001 D-3 (C-Scope-1): drift walker test 가 full git history 필요

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # `go build ./cmd/moai/` below does NOT compile _test.go files, so before
      # this step the test tier compiled for NO platform on a PR: the test job
      # is ubuntu-only, and cross-compilation coverage stopped at non-test
      # sources. A test file that only builds on POSIX therefore reached main
      # green and broke the Windows leg at release time.
      # `go vet` type-checks the test files too, and cross-compiles on this same
      # ubuntu runner in seconds — no extra runner, no runtime execution.
      - name: Vet cross-platform (compiles _test.go, which `go build` does not)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Cross-compile binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          BINARY_NAME="moai-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          go build -ldflags="-s -w" -o "${BINARY_NAME}" ./cmd/moai/
          echo "Built ${BINARY_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: moai-${{ matrix.goos }}-${{ matrix.goarch }}
          path: moai-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Constitution Check: Verify FROZEN/EVOLVABLE zone registry integrity
  # SPEC-V3R2-CON-001 — continue-on-error so CI doesn't block on missing registry
  # Always runs (fast, advisory-only)
  # ---------------------------------------------------------------------------
  constitution-check:
    name: Constitution Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # SPEC-V3R4-CI-INFRA-FIX-001 D-3 (C-Scope-1): drift walker test 가 full git history 필요

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go build -ldflags="-s -w" -o bin/moai ./cmd/moai/

      - name: Verify zone registry (list)
        run: |
          MOAI_CONSTITUTION_REGISTRY=.claude/rules/moai/core/zone-registry.md \
            ./bin/moai constitution list --format json | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(f'entries: {len(d[\"entries\"])}')"

      - name: Verify zone registry (frozen entries)
        run: |
          MOAI_CONSTITUTION_REGISTRY=.claude/rules/moai/core/zone-registry.md \
            ./bin/moai constitution list --zone frozen | tail -1

      - name: Verify zone registry (validate — secondary signal)
        # SPEC-ZONE-REGISTRY-RESYNC-001 (M2): this job is continue-on-error: true,
        # so this step is a SECONDARY signal only — a failure here can never block
        # a PR (D6 / AC-ZRR-008). The blocking guard is TestRegistrySyncGuard in
        # internal/constitution/registry_sync_test.go, which rides the ordinary
        # `go test ./...` job (plan.md §F M2 design table).
        run: |
          MOAI_CONSTITUTION_REGISTRY=.claude/rules/moai/core/zone-registry.md \
            ./bin/moai constitution validate

  # ---------------------------------------------------------------------------
  # test-browser: app.js handler runtime fire guard — SPEC-APPJS-FIRE-GUARD-001
  # (card t1060). ADDITIVE ONLY (REQ-AFG-010): this job was appended at EOF and
  # touches no existing job or step; the guarded driver tests skip everywhere
  # else, so THIS job is the only CI verdict surface for the runtime fire axis.
  #
  # Green phase: the env-gated driver tests run against the in-process server
  # surface (MOAI_BROWSER_GUARD=1). Red phase: the committed mutation tool
  # re-introduces the historical IIFE-crossing defect, the binary is rebuilt
  # (app.js is //go:embed'ed), and the probe must exit 1 naming the collapsed
  # indicators; the tree is then restored and verified byte-identical before a
  # final green probe (0 → 1 → 0, REQ-AFG-008/009).
  #
  # Chrome is NOT trusted from the runner image (REQ-AFG-010): a
  # Chrome-for-Testing build is downloaded and sha256-pinned below. The pin
  # was measured 2026-09-22 by downloading this exact URL and hashing the
  # bytes. websockets is pinned for the same reason; it is the probe's only
  # third-party dependency and is NEVER a Go module (go.mod/go.sum unchanged).
  # ---------------------------------------------------------------------------
  test-browser:
    name: Test (browser fire guard)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned websockets (probe dependency — never a Go module)
        shell: bash
        run: |
          python3 -m pip --version >/dev/null 2>&1 || python3 -m ensurepip --upgrade
          python3 -m pip install --user --disable-pip-version-check --quiet "websockets==15.0.1"
          python3 -c "import websockets; print('websockets', websockets.__version__)"

      - name: Provision pinned Chrome for Testing (sha256-verified download)
        shell: bash
        run: |
          CFT_VERSION="153.0.8010.52"
          CFT_SHA256="e66f66d4802a46d4a022667e668aa950e277cadbfbed4b3777915b47413a0ef9"
          CFT_URL="https://storage.googleapis.com/chrome-for-testing-public/${CFT_VERSION}/linux64/chrome-linux64.zip"
          curl --fail --silent --show-error --location -o chrome-linux64.zip "$CFT_URL"
          echo "${CFT_SHA256}  chrome-linux64.zip" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/cft"
          unzip -q chrome-linux64.zip -d "$RUNNER_TEMP/cft"
          echo "MOAI_BROWSER_GUARD_CHROME=$RUNNER_TEMP/cft/chrome-linux64/chrome" >> "$GITHUB_ENV"

      # card t1087: Ubuntu 24.04 runners enforce AppArmor's
      # apparmor_restrict_unprivileged_userns — binaries without a profile are
      # denied user-namespace creation, and Chrome's sandbox needs userns. The
      # image's system Chrome launches because its package ships a profile; the
      # sha256-pinned CfT binary ships none and died in <0.5s before writing
      # DevToolsActivePort on the job's first runs (verdict:
      # .moai/reports/t1087/verdict.md — CI evidence runs 35761021136 /
      # 35735866560). This profile allows ONLY the pinned CfT path to create
      # user namespaces; the sandbox itself stays ON (the green-phase driver
      # deliberately launches without --no-sandbox, so --no-sandbox is not a
      # fix here — the red-phase script already launches with it).
      - name: Install AppArmor profile for pinned Chrome (unprofiled CfT dies under 24.04 userns restriction)
        shell: bash
        run: |
          CHROME="$RUNNER_TEMP/cft/chrome-linux64/chrome"
          [ -x "$CHROME" ] || { echo "pinned chrome not found at $CHROME" >&2; exit 1; }
          sudo tee /etc/apparmor.d/moai-cft-chrome > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>

          profile moai-cft-chrome "$CHROME" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/moai-cft-chrome

      - name: Lint the probe manifest (AC-AFG-009)
        shell: bash
        run: python3 internal/web/testdata/appjs_fire_probe.py --lint-manifest

      - name: Green phase — gated driver tests (in-process surface)
        env:
          MOAI_BROWSER_GUARD: "1"
          MOAI_BROWSER_GUARD_SETTLE_STAGE2: "1"
        shell: bash
        run: go test ./internal/web/ -run 'AppJs.*Fire' -v -count=1 -timeout 17m

      - name: Red phase — mutation cycle (0 → 1 → 0, real-binary surface)
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/fire-guard"
          PORT=18499
          mkdir -p "$RUN_DIR"

          start_server() {
            # card t1113: #glmKeyReveal renders only when a GLM key is stored;
            # seed the same fake key as fireGuardFakeGLMKey in
            # internal/web/appjs_fire_guard_test.go (MOAI_TEST_GLM_KEY seam).
            MOAI_TEST_GLM_KEY="test-fire-guard-fake-glm-key" \
              "$RUN_DIR/moai" web --port "$PORT" --no-open --no-reuse > "$RUN_DIR/server.log" 2>&1 &
            SERVER_PID=$!
            for i in $(seq 1 50); do
              curl -sf -o /dev/null "http://127.0.0.1:$PORT/" && return 0
              sleep 0.2
            done
            echo "server never became ready" >&2
            exit 1
          }
          stop_server() {
            if [ -n "${SERVER_PID:-}" ]; then
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
              SERVER_PID=""
            fi
          }
          expect_exit() {
            local want="$1"; shift
            set +e
            "$@" > "$RUN_DIR/last.out" 2>&1
            local got=$?
            set -e
            if [ "$got" -ne "$want" ]; then
              echo "EXPECTED exit $want, got $got for: $*" >&2
              tail -40 "$RUN_DIR/last.out" >&2 || true
              exit 1
            fi
          }

          go build -o "$RUN_DIR/moai" ./cmd/moai
          start_server

          rm -rf "$RUN_DIR/profile"
          # --no-sandbox: test-only browser over loopback on a CI VM.
          "$MOAI_BROWSER_GUARD_CHROME" --headless=new --remote-debugging-port=0 \
            --user-data-dir="$RUN_DIR/profile" --no-first-run --no-default-browser-check \
            --disable-gpu --no-sandbox about:blank > "$RUN_DIR/chrome.log" 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true; stop_server' EXIT

          CDP_PORT=""
          for i in $(seq 1 60); do
            if [ -f "$RUN_DIR/profile/DevToolsActivePort" ]; then
              CDP_PORT=$(head -1 "$RUN_DIR/profile/DevToolsActivePort")
              [ -n "$CDP_PORT" ] && break
            fi
            sleep 0.25
          done
          [ -n "$CDP_PORT" ] || { echo "Chrome never exposed a CDP port" >&2; exit 1; }

          expect_exit 0 python3 internal/web/testdata/appjs_fire_probe.py \
            --cdp-port "$CDP_PORT" --primary-entries-only "$PORT" t1060-ci-green

          expect_exit 0 python3 internal/web/testdata/appjs_fire_mutation.py \
            --pristine "$RUN_DIR/appjs.pristine"

          stop_server
          go build -o "$RUN_DIR/moai" ./cmd/moai
          start_server

          set +e
          python3 internal/web/testdata/appjs_fire_probe.py \
            --cdp-port "$CDP_PORT" --primary-entries-only "$PORT" t1060-ci-red > "$RUN_DIR/red.json" 2>&1
          RED_EXIT=$?
          set -e
          if [ "$RED_EXIT" -ne 1 ]; then
            echo "RED PHASE: expected probe exit 1 after mutation, got $RED_EXIT" >&2
            cat "$RUN_DIR/red.json" >&2 || true
            exit 1
          fi
          grep -q 'stampRefreshed' "$RUN_DIR/red.json" || {
            echo "red report lacks the expected stampRefreshed ReferenceError" >&2
            exit 1
          }

          stop_server
          cp "$RUN_DIR/appjs.pristine" internal/web/assets/app.js
          cmp internal/web/assets/app.js "$RUN_DIR/appjs.pristine"
          git diff --exit-code -- internal/web/assets/app.js
          echo "RESTORED_BYTE_IDENTICAL"

          go build -o "$RUN_DIR/moai" ./cmd/moai
          start_server
          expect_exit 0 python3 internal/web/testdata/appjs_fire_probe.py \
            --cdp-port "$CDP_PORT" --primary-entries-only "$PORT" t1060-ci-post-restore
