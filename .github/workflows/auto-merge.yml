name: Auto Merge

# CI가 PR에서 성공적으로 완료되면 자동으로 squash merge
#
# Two triggers (SPEC-CI-CODEX-REVIEW-001, REQ-CCR-022): the completed CI run, and the Codex app
# identity's issue comment on a pull request, which is created when a review starts and edited in
# place until it ends. A comment re-evaluates the same chain, so a review that completes after the
# CI window is still read. The comment path checks out the default branch only and runs no file,
# ref, or text of the pull request.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  issue_comment:
    types: [created, edited]

# The commit-status write scope is the one permission added, for the `auto-merge` status (REQ-CCR-025).
permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  auto-merge:
    # Trust gate at the job level (REQ-CCR-022): a successful CI run of a pull request, or a comment
    # of user id 199175422 (the Codex app identity) on a pull request. Any other comment starts a run
    # whose job is skipped before any step, token use, or checkout. The id is a cost and exposure
    # filter; the gate script still binds login, id, and type before any verdict.
    if: >
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.id == 199175422)
    # Auto-merge — one group per pull request, in-flight cancel would race a merge (REQ-CCR-023). The
    # key is the pull request number for a CI run and for the identity's comment; a comment of any other
    # author gets a unique per-run key, so a skipped run never shares a group with a real evaluation.
    concurrency:
      group: auto-merge-${{ github.event_name == 'issue_comment' && github.event.comment.user.id != 199175422 && format('run-{0}', github.run_id) || github.event.workflow_run.pull_requests[0].number || github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Get PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number }}
          PR_HEAD_BRANCH: ${{ github.event.workflow_run.pull_requests[0].head.ref }}
          PR_STATE: ${{ github.event.workflow_run.pull_requests[0].state }}
          PR_MERGED: ${{ github.event.workflow_run.pull_requests[0].merged }}
        run: |
          HEAD_SHA=""
          # Comment path (REQ-CCR-022): the event names only the pull request number. The state, the merged
          # flag, the head branch, and the head commit are read from the API; a read that fails leaves them
          # empty, which turns the job off below.
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            PULL="$(gh api "repos/$REPO/pulls/$PR_NUMBER" 2>/dev/null || true)"
            PR_STATE="$(printf '%s' "$PULL" | jq -r '.state // empty' 2>/dev/null || true)"
            PR_MERGED="$(printf '%s' "$PULL" | jq -r 'if .merged == true then "true" else "false" end' 2>/dev/null || true)"
            PR_HEAD_BRANCH="$(printf '%s' "$PULL" | jq -r '.head.ref // empty' 2>/dev/null || true)"
            HEAD_SHA="$(printf '%s' "$PULL" | jq -r '.head.sha // empty' 2>/dev/null || true)"
            case "$HEAD_SHA" in
              *[!0-9a-f]*) HEAD_SHA="" ;;
            esac
            if [ "${#HEAD_SHA}" -ne 40 ]; then HEAD_SHA=""; fi
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "branch=$PR_HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "state=$PR_STATE" >> "$GITHUB_OUTPUT"
          echo "merged=$PR_MERGED" >> "$GITHUB_OUTPUT"
          echo "PR #$PR_NUMBER ($PR_HEAD_BRANCH) - State: $PR_STATE, Merged: $PR_MERGED"
          # active gates every later step. The workflow_run payload's pull_requests[]
          # element does not always carry state or merged, so only a positive
          # signal (closed, merged, or no number) turns the job off; an absent
          # field is never read as "not open". On the comment path the API read is
          # the only source, so an unreadable pull request is never active.
          ACTIVE=true
          if [ -z "$PR_NUMBER" ] || [ "$PR_STATE" = "closed" ] || [ "$PR_MERGED" = "true" ]; then
            ACTIVE=false
          fi
          case "$PR_NUMBER" in
            *[!0-9]*) ACTIVE=false ;;
          esac
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            if [ "$PR_STATE" != "open" ] || [ -z "$HEAD_SHA" ]; then
              ACTIVE=false
            fi
          fi
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          # head_sha is the commit under evaluation on the comment path only; the workflow_run path
          # takes it from the CI run.
          if [ "$ACTIVE" = "true" ]; then
            echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "head_sha=" >> "$GITHUB_OUTPUT"
          fi
          # AC-CI-005: record the job start once; the merge step derives its
          # single overall deadline from this timestamp (start + 17 min,
          # inside the 20-minute job timeout).
          echo "merge_deadline=$(( $(date +%s) + 1020 ))" >> "$GITHUB_ENV"

      - name: Skip if not open or already merged
        if: steps.pr.outputs.active != 'true'
        run: |
          echo "Skipping: PR is not open or already merged"

      - name: Checkout repository
        if: steps.pr.outputs.active == 'true'
        uses: actions/checkout@v7

      # Guard (a) — head SHA re-verification.
      # workflow_run carries the commit CI actually ran against. If the PR head
      # moved since then, that CI result no longer describes what we would be
      # merging, and merging anyway strands the newer commit outside main.
      # Any uncertainty (API failure, empty value) withholds the merge.
      - name: Verify PR head still matches the CI-tested commit
        id: head
        if: steps.pr.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha || steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          CURRENT_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid' 2>/dev/null || true)"

          echo "CI tested : ${TESTED_SHA:-<empty>}"
          echo "PR head   : ${CURRENT_SHA:-<empty>}"

          if [ -z "$TESTED_SHA" ] || [ -z "$CURRENT_SHA" ]; then
            echo "::warning::Could not resolve both SHAs - withholding merge"
            echo "HEAD_REASON=unreadable" >> "${GITHUB_ENV:-/dev/null}"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$TESTED_SHA" != "$CURRENT_SHA" ]; then
            echo "::notice::PR head moved after CI ran - withholding merge"
            echo "HEAD_REASON=moved" >> "${GITHUB_ENV:-/dev/null}"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Check eligible PR author and same-repository head
        id: author
        if: steps.pr.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          PR_JSON="$(gh api "repos/$REPO/pulls/$PR_NUMBER" 2>/dev/null || true)"
          ELIGIBLE=false
          if [ -n "$PR_JSON" ] && printf '%s' "$PR_JSON" | jq -e '
            .user.login == "GoosLab" and
            .user.id == 6458969 and
            .user.type == "User" and
            (.head.repo.id | type) == "number" and
            (.base.repo.id | type) == "number" and
            .head.repo.id == .base.repo.id
          ' >/dev/null 2>&1; then
            ELIGIBLE=true
          fi
          echo "eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"
          if [ "$ELIGIBLE" != "true" ]; then
            echo "::notice::PR author or head repository is not eligible for auto-merge; it requires the user's test confirmation and explicit approval"
          fi

      - name: Check all required CI checks passed
        if: steps.pr.outputs.active == 'true' && steps.head.outputs.ok == 'true' && steps.author.outputs.eligible == 'true'
        id: checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          echo "Checking required CI checks for PR #$PR_NUMBER..."

          # AC-CI-004: the required-checks observation is a structured JSON
          # query with explicit failure handling — a lookup failure, an empty
          # response, or a partial check set withholds the merge instead of
          # being read as completion. Exit code 8 means "checks pending" (a
          # valid JSON body accompanies it) and is a WAIT signal, not an
          # error; any other non-zero exit is a lookup failure.
          MAX_WAIT=60
          WAIT=0

          while [ "$WAIT" -lt "$MAX_WAIT" ]; do
            rc=0
            CHECKS_JSON="$(gh pr checks "$PR_NUMBER" --required --json name,state,bucket 2>/dev/null)" || rc=$?

            if [ "$rc" -ne 0 ] && [ "$rc" -ne 8 ]; then
              echo "::warning::required-checks lookup failed (gh exit $rc) - withholding auto-merge"
              echo "should_merge=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ -z "$CHECKS_JSON" ]; then
              echo "::warning::empty required-checks response - withholding auto-merge"
              echo "should_merge=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # A nonempty response string can still contain an empty array
            # or an unrelated object. Require actual, well-formed checks
            # before an all-pass observation can authorize a merge.
            if ! printf '%s' "$CHECKS_JSON" | jq -e '              def state_bucket:
                if . == "SUCCESS" then "pass"
                elif IN("SKIPPED", "NEUTRAL") then "skipping"
                elif IN("ERROR", "FAILURE", "TIMED_OUT", "ACTION_REQUIRED") then "fail"
                elif . == "CANCELLED" then "cancel"
                elif IN("EXPECTED", "REQUESTED", "WAITING", "QUEUED", "PENDING", "IN_PROGRESS", "STALE") then "pending"
                else null end;
              type == "array" and length > 0 and all(.[];
                type == "object" and (.name | type == "string" and length > 0) and
                (.state | type == "string" and length > 0) and
                (.bucket | IN("pass", "fail", "pending", "skipping", "cancel")) and
              (.bucket == (.state | state_bucket)))' >/dev/null 2>&1; then
              echo "::warning::invalid or empty required-checks observation - withholding auto-merge"
              echo "should_merge=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            pending="$(printf '%s' "$CHECKS_JSON" | jq '[.[] | select(.bucket == "pending")] | length')"
            nonpass="$(printf '%s' "$CHECKS_JSON" | jq '[.[] | select(.bucket != "pass" and .bucket != "pending")] | length')"

            if [ "$rc" -eq 8 ] && [ "$pending" -eq 0 ]; then
              echo "::warning::pending exit status without pending checks - withholding auto-merge"
              echo "should_merge=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Check status: total=$(printf '%s' "$CHECKS_JSON" | jq 'length') pending=$pending nonpass=$nonpass"

            if [ "${nonpass:-0}" -gt 0 ]; then
              echo "Some checks did not pass - withholding auto-merge"
              echo "should_merge=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "${pending:-0}" -eq 0 ]; then
              echo "All checks completed!"
              echo "should_merge=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Waiting for checks to complete... ($WAIT/$MAX_WAIT, pending=$pending)"
            sleep 10
            WAIT=$((WAIT + 1))
          done

          echo "Timeout waiting for checks, skipping auto-merge"
          echo "should_merge=false" >> "$GITHUB_OUTPUT"

      # Guard (b) - changed-file list and tamper guard (SPEC-CI-CODEX-REVIEW-001).
      # Every page of the pull request's changed-file list is collected, count-checked against the
      # pull request's own count, and bound entry by entry to the verified head commit. Any change
      # under .github/workflows/ or to the gate script withholds the merge for a human. The head is
      # read before and after the list: a head that moved is never judged. A failure, a missing
      # gate script included, ends this step non-zero, so the step and the job fail and no later
      # step runs; only the pass exits 0.
      - name: Collect and check the changed-file list
        id: files
        if: steps.pr.outputs.active == 'true' && steps.head.outputs.ok == 'true' && steps.author.outputs.eligible == 'true' && steps.checks.outputs.should_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_SHA: ${{ steps.head.outputs.sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          GATE=scripts/ci/codex-review-gate.sh
          LIST="${RUNNER_TEMP:-/tmp}/codex-gate-files.ndjson"

          # The only place this step records its outputs: each key once, on the terminating path
          # (T-OUTPUTS), and the only place it chooses its exit status (T-CHAIN).
          conclude() {
            echo "ok=$1" >> "$GITHUB_OUTPUT"
            echo "state=$2" >> "$GITHUB_OUTPUT"
            exit "$3"
          }
          withhold() {
            echo "::error::changed-file check: $1 - merge withheld"
            echo "GATE_REASON=$(printf '%s' "$1" | tr '\r\n' '  ')" >> "${GITHUB_ENV:-/dev/null}"
            conclude false fail 1
          }
          read_pr() { gh api "repos/$REPO/pulls/$PR_NUMBER" 2>/dev/null; }
          field() { printf '%s' "$1" | jq -r "$2" 2>/dev/null || true; }
          reason() {
            r=""
            if [ "$rc" -eq 1 ]; then
              r="$(printf '%s\n' "$1" | sed -n 's/^CODEX_GATE_REFUSED: //p' | head -1 || true)"
            fi
            printf '%s' "${r:-gate-exit-$rc}"
          }

          # The consumer runs from the default branch checkout; a missing script is a refusal.
          if [ ! -f "$GATE" ]; then withhold "gate-script-missing"; fi

          FIRST="$(read_pr)" || withhold "files-unreadable"
          HEAD1="$(field "$FIRST" '.head.sha // empty')"
          COUNT1="$(field "$FIRST" '.changed_files // empty')"
          if [ -z "$HEAD1" ] || [ -z "$COUNT1" ]; then withhold "files-unreadable"; fi
          if [ "$HEAD1" != "$VERIFIED_SHA" ]; then withhold "head-moved:${HEAD1:0:10}"; fi

          rc=0
          OUT="$(bash "$GATE" fetch-pages --endpoint "repos/$REPO/pulls/$PR_NUMBER/files" --out "$LIST" --expect-count "$COUNT1" 2>&1)" || rc=$?
          echo "$OUT"
          if [ "$rc" -ne 0 ]; then withhold "$(reason "$OUT")"; fi

          SECOND="$(read_pr)" || withhold "files-unreadable-after-read"
          HEAD2="$(field "$SECOND" '.head.sha // empty')"
          COUNT2="$(field "$SECOND" '.changed_files // empty')"
          if [ "$HEAD2" != "$VERIFIED_SHA" ]; then withhold "head-moved-during-read"; fi
          if [ "$COUNT2" != "$COUNT1" ]; then withhold "count-moved-during-read"; fi

          rc=0
          OUT="$(bash "$GATE" gate-files-changed --file "$LIST" --head-sha "$VERIFIED_SHA" 2>&1)" || rc=$?
          echo "$OUT"
          if [ "$rc" -ne 0 ]; then withhold "$(reason "$OUT")"; fi

          conclude true pass 0

      # Guard (c) - native Codex review gate (SPEC-CI-CODEX-REVIEW-001).
      # The gate reads the Codex identity's single issue-comment state marker, both review legs,
      # the security marker, and corroborating review findings. Only a clean result bound to the
      # verified head can pass. A formal APPROVED review alone is never a pass. Time appears only
      # as the bound of the wait: no elapsed time, and no absence of a review, is ever a pass.
      # Exit classes: 0 pass; 1 fail; 10 not yet observed or still running, keep waiting;
      # 11 NOT RUN: a draft ends as the state not-run:draft with step exit 11 (never success, never
      # a review result), and no review when the window ends on a non-draft pull request is a
      # failure. Every other exit is a refusal. Every path but the clean pass ends the step
      # non-zero, so the step and the job fail and the merge step does not run. The one exception is
      # the comment path's single pass: a pending result (exit 10) is a "not yet" hold that ends
      # the step with exit 0, state pending, and no merge. The head is read again after the list reads.
      - name: Read the native Codex review
        id: review
        if: >
          steps.pr.outputs.active == 'true' &&
          steps.head.outputs.ok == 'true' &&
          steps.author.outputs.eligible == 'true' &&
          steps.checks.outputs.should_merge == 'true' &&
          steps.files.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_SHA: ${{ steps.head.outputs.sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          GATE=scripts/ci/codex-review-gate.sh
          REVIEWS="${RUNNER_TEMP:-/tmp}/codex-gate-reviews.ndjson"
          COMMENTS="${RUNNER_TEMP:-/tmp}/codex-gate-comments.ndjson"
          ISSUES="${RUNNER_TEMP:-/tmp}/codex-gate-issues.ndjson"
          # At most 60 passes of 15s (15 minutes). The window is bounded by the 17-minute overall
          # deadline; a long earlier checks wait, or the 20-minute job timeout, can shorten it, in
          # which case the merge is withheld. The comment path (REQ-CCR-023) is one pass with the
          # window open and no sleep: the identity's next edit of its comment starts the next evaluation.
          MAX_WAIT=60
          if [ "$EVENT_NAME" = "issue_comment" ]; then MAX_WAIT=1; fi

          # The only place this step records its outputs: each key once, on the terminating path
          # (T-OUTPUTS), and the only place it chooses its exit status (T-CHAIN). The reason of a
          # refusal is also handed to the status step through the job environment.
          conclude() {
            echo "ok=$1" >> "$GITHUB_OUTPUT"
            echo "state=$2" >> "$GITHUB_OUTPUT"
            exit "$3"
          }
          withhold() {
            echo "::error::native review gate: $1 - merge withheld"
            echo "GATE_REASON=$(printf '%s' "$1" | tr '\r\n' '  ')" >> "${GITHUB_ENV:-/dev/null}"
            conclude false fail 1
          }
          read_pr() { gh api "repos/$REPO/pulls/$PR_NUMBER" 2>/dev/null; }
          field() { printf '%s' "$1" | jq -r "$2" 2>/dev/null || true; }
          reason() {
            r=""
            if [ "$rc" -eq 1 ]; then
              r="$(printf '%s\n' "$1" | sed -n 's/^CODEX_GATE_REFUSED: //p' | head -1 || true)"
            fi
            printf '%s' "${r:-gate-exit-$rc}"
          }
          wait_next() {
            if [ "$WAIT" -lt "$MAX_WAIT" ]; then sleep 15; fi
          }
          # Pre-merge recheck, run once a pass is clean ($1 is that pass's state-marker summary line). The
          # lists are collected again between two reads of the pull request object. The issue-comment
          # count is refreshed at the start of this observation, used to verify the complete page
          # collection, then checked again with the head before the gate re-reads trusted artifacts.
          # Ordinary comments added since the clean pass do not change that pass's verdict; a changed
          # trusted artifact still changes or refuses the gate result. A few seconds remain before merge.
          recheck() {
            R3="$(read_pr)" || withhold "recheck-unreadable"
            if [ "$(field "$R3" '.head.sha // empty')" != "$VERIFIED_SHA" ]; then withhold "head-moved-before-merge"; fi
            if [ "$(field "$R3" '.review_comments // empty')" != "$RC_COUNT" ]; then withhold "review-comments-moved-before-merge"; fi
            IC_RECHECK_COUNT="$(field "$R3" '.comments // empty')"
            case "$IC_RECHECK_COUNT" in
              '' | *[!0-9]*) withhold "issue-comments-unreadable-before-merge" ;;
            esac
            rc=0
            OUT2="$(bash "$GATE" fetch-pages --endpoint "repos/$REPO/pulls/$PR_NUMBER/reviews" --out "$REVIEWS" 2>&1)" || rc=$?
            if [ "$rc" -ne 0 ]; then withhold "recheck-unreadable:$(reason "$OUT2")"; fi
            OUT2="$(bash "$GATE" fetch-pages --endpoint "repos/$REPO/pulls/$PR_NUMBER/comments" --out "$COMMENTS" --expect-count "$RC_COUNT" 2>&1)" || rc=$?
            if [ "$rc" -ne 0 ]; then withhold "recheck-unreadable:$(reason "$OUT2")"; fi
            OUT2="$(bash "$GATE" fetch-pages --endpoint "repos/$REPO/issues/$PR_NUMBER/comments" --out "$ISSUES" --expect-count "$IC_RECHECK_COUNT" 2>&1)" || rc=$?
            if [ "$rc" -ne 0 ]; then withhold "recheck-unreadable:$(reason "$OUT2")"; fi
            R4="$(read_pr)" || withhold "recheck-unreadable"
            if [ "$(field "$R4" '.head.sha // empty')" != "$VERIFIED_SHA" ]; then withhold "head-moved-before-merge"; fi
            if [ "$(field "$R4" '.review_comments // empty')" != "$RC_COUNT" ]; then withhold "review-comments-moved-before-merge"; fi
            if [ "$(field "$R4" '.comments // empty')" != "$IC_RECHECK_COUNT" ]; then withhold "issue-comments-moved-before-merge"; fi
            OUT2="$(bash "$GATE" read-native-review --reviews "$REVIEWS" --comments "$COMMENTS" --issue-comments "$ISSUES" --head-sha "$VERIFIED_SHA" --draft false --wait-closed true 2>&1)" || rc=$?
            if [ "$rc" -ne 0 ]; then withhold "review-changed-before-merge:$(reason "$OUT2")"; fi
            if [ "$OUT2" != "$1" ]; then withhold "selected-review-changed-before-merge"; fi
          }

          if [ ! -f "$GATE" ]; then withhold "gate-script-missing"; fi

          WAIT=0
          NOTE="no-pass-completed"
          while [ "$WAIT" -lt "$MAX_WAIT" ]; do
            WAIT=$((WAIT + 1))
            CLOSED=false
            if [ "$MAX_WAIT" -gt 1 ] && [ "$WAIT" -eq "$MAX_WAIT" ]; then CLOSED=true; fi
            rc=0

            PR_JSON="$(read_pr)" || { NOTE="unreadable"; wait_next; continue; }
            DRAFT="$(field "$PR_JSON" '.draft')"
            HEAD1="$(field "$PR_JSON" '.head.sha // empty')"
            RC_COUNT="$(field "$PR_JSON" '.review_comments // empty')"
            IC_COUNT="$(field "$PR_JSON" '.comments // empty')"
            case "$DRAFT" in
              true | false) ;;
              *) NOTE="unreadable"; wait_next; continue ;;
            esac

            if [ "$DRAFT" = "true" ]; then
              # A draft is NOT RUN before any list is fetched.
              OUT="$(bash "$GATE" read-native-review --head-sha "$VERIFIED_SHA" --draft true --wait-closed "$CLOSED" 2>&1)" || rc=$?
            else
              if [ "$HEAD1" != "$VERIFIED_SHA" ]; then withhold "head-moved:${HEAD1:0:10}"; fi
              if [ -z "$RC_COUNT" ] || [ -z "$IC_COUNT" ]; then NOTE="unreadable"; wait_next; continue; fi
              OUT="$(bash "$GATE" fetch-pages --endpoint "repos/$REPO/pulls/$PR_NUMBER/reviews" --out "$REVIEWS" 2>&1)" || rc=$?
              if [ "$rc" -ne 0 ]; then NOTE="unreadable:$(reason "$OUT")"; wait_next; continue; fi
              OUT="$(bash "$GATE" fetch-pages --endpoint "repos/$REPO/pulls/$PR_NUMBER/comments" --out "$COMMENTS" --expect-count "$RC_COUNT" 2>&1)" || rc=$?
              if [ "$rc" -ne 0 ]; then NOTE="unreadable:$(reason "$OUT")"; wait_next; continue; fi
              OUT="$(bash "$GATE" fetch-pages --endpoint "repos/$REPO/issues/$PR_NUMBER/comments" --out "$ISSUES" --expect-count "$IC_COUNT" 2>&1)" || rc=$?
              if [ "$rc" -ne 0 ]; then NOTE="unreadable:$(reason "$OUT")"; wait_next; continue; fi
              # The head is read again after the list reads; lists of another head are never judged.
              SECOND="$(read_pr)" || { NOTE="unreadable"; wait_next; continue; }
              HEAD2="$(field "$SECOND" '.head.sha // empty')"
              RC2="$(field "$SECOND" '.review_comments // empty')"
              IC2="$(field "$SECOND" '.comments // empty')"
              if [ -z "$HEAD2" ] || [ -z "$RC2" ]; then NOTE="unreadable"; wait_next; continue; fi
              if [ "$HEAD2" != "$VERIFIED_SHA" ]; then withhold "head-moved-during-read"; fi
              if [ "$RC2" != "$RC_COUNT" ]; then withhold "review-comments-moved-during-read"; fi
              if [ -z "$IC2" ]; then NOTE="unreadable"; wait_next; continue; fi
              if [ "$IC2" != "$IC_COUNT" ]; then NOTE="issue-comments-moved-during-read"; wait_next; continue; fi
              OUT="$(bash "$GATE" read-native-review --reviews "$REVIEWS" --comments "$COMMENTS" --issue-comments "$ISSUES" --head-sha "$VERIFIED_SHA" --draft false --wait-closed "$CLOSED" 2>&1)" || rc=$?
            fi

            case "$rc" in
              0)
                echo "$OUT"
                recheck "$OUT"
                conclude true pass 0
                ;;
              10)
                if [ "$EVENT_NAME" = "issue_comment" ]; then
                  # A review that is still running, or that has no state comment yet, is a "not yet" hold:
                  # exit 0, the merge step does not run, the job is not failed, and the next edit of the
                  # identity's comment starts the next evaluation (REQ-CCR-023).
                  HOLD="review-not-complete:no-state-comment"
                  case "$OUT" in
                    *"CODEX_GATE_REFUSED: pending:running"*) HOLD="review-not-complete:running" ;;
                  esac
                  echo "::notice::native review not complete ($HOLD) - merge not requested; the next review update re-evaluates"
                  echo "REVIEW_HOLD=$HOLD" >> "${GITHUB_ENV:-/dev/null}"
                  conclude false pending 0
                fi
                NOTE="pending"
                echo "native review not observed yet ($WAIT/$MAX_WAIT)"
                ;;
              11)
                if [ "$DRAFT" = "true" ]; then
                  echo "::notice::NOT RUN: draft - not a review result and never a pass; the merge is withheld"
                  conclude false not-run:draft 11
                fi
                echo "::error::native review gate: not-run:review-absent - no native review observed for the head commit"
                echo "GATE_REASON=not-run:review-absent" >> "${GITHUB_ENV:-/dev/null}"
                conclude false fail 1
                ;;
              *)
                withhold "$(reason "$OUT")"
                ;;
            esac
            wait_next
          done

          # The loop ended without a stop: only possible when the last pass could not read its lists.
          withhold "review-unreadable: $NOTE"

      - name: Auto merge PR
        if: >
          steps.pr.outputs.active == 'true' &&
          steps.checks.outputs.should_merge == 'true' &&
          steps.author.outputs.eligible == 'true' &&
          steps.head.outputs.ok == 'true' &&
          steps.files.outputs.ok == 'true' &&
          steps.review.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
          TESTED_SHA: ${{ steps.head.outputs.sha }}
        run: |
          # This step is reached only when every guard passed. Each outcome leaves one line in the job
          # summary naming the outcome and the head SHA, records it for the status step, and ends the
          # step: exit 0 only when the merge was requested (gh pr merge exited 0); every outcome where the
          # merge was reached and not executed ends exit 1, so the job result is a failure (REQ-CCR-024).
          summary() { echo "$1" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"; }
          finish() {
            summary "$2"
            echo "AUTO_MERGE_STATE=$1" >> "${GITHUB_ENV:-/dev/null}"
            echo "AUTO_MERGE_LINE=$(printf '%s' "$2" | tr '\r\n' '  ')" >> "${GITHUB_ENV:-/dev/null}"
            exit "$3"
          }
          echo "Auto-merging PR #$PR_NUMBER ($PR_BRANCH)..."

          # AC-CI-005: the single overall deadline is RE-EVALUATED at merge
          # time — never a comparison against a start-captured snapshot. The
          # merge proceeds only while the wall clock is still inside the
          # deadline (start + 17 min, recorded when the job started).
          now="$(date +%s)"
          if [ "$now" -gt "${merge_deadline:-9999999999}" ]; then
            echo "::notice::Overall deadline passed before merge (now=$now deadline=${merge_deadline:-unset}) - leaving PR #$PR_NUMBER open for review"
            finish failure "merge held: review window elapsed before merge - PR #$PR_NUMBER left open, head $TESTED_SHA" 1
          fi

          # AC-CI-003: re-verify the head IMMEDIATELY before merging and pin
          # the merge to the CI-tested commit, so a push landing between the
          # guards and this call can never be merged unverified.
          HEAD_NOW="$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')"
          if [ -z "$HEAD_NOW" ] || [ "$HEAD_NOW" != "$TESTED_SHA" ]; then
            echo "::notice::PR head moved (tested=${TESTED_SHA:-<empty>} now=${HEAD_NOW:-<empty>}) - leaving PR #$PR_NUMBER open for review"
            finish failure "merge not executed: head moved - PR #$PR_NUMBER left open, tested head ${TESTED_SHA:-<empty>}, current head ${HEAD_NOW:-<empty>}" 1
          fi

          # AC-CI-005 re-evaluation (post-head-query): the head query itself
          # takes wall-clock time — the deadline can cross BETWEEN the check
          # above and the merge call. Re-read the clock here; merging with a
          # stale pre-query evaluation is the defect this second check
          # closes (E26's served-time observation targets exactly this
          # window).
          now="$(date +%s)"
          if [ "$now" -gt "${merge_deadline:-9999999999}" ]; then
            echo "::notice::Overall deadline passed during head verification (now=$now deadline=${merge_deadline:-unset}) - leaving PR #$PR_NUMBER open for review"
            finish failure "merge held: review window elapsed during head verification - PR #$PR_NUMBER left open, head $TESTED_SHA" 1
          fi

          # Release/hotfix PRs preserve individual SPEC history via --merge.
          # All other branches use --squash (Enhanced GitHub Flow §18.3).
          if [[ "$PR_BRANCH" == release/* || "$PR_BRANCH" == hotfix/* ]]; then
            MERGE_FLAG="--merge"
            echo "Using --merge (release/hotfix branch — preserve history)"
          else
            MERGE_FLAG="--squash"
            echo "Using --squash (feature branch — squash WIP commits)"
          fi

          # No --auto fallback: a deferred merge lands at a later moment, against
          # whatever the head is by then, without re-running the guards above.
          # A failed merge here is left for a human rather than deferred.
          # --match-head-commit makes the merge fail server-side if the head
          # moved in the window between the re-check above and GitHub applying
          # the merge (the pinned AC-CI-003 precondition).
          merge_rc=0
          MERGE_OUT="$(gh pr merge "$PR_NUMBER" $MERGE_FLAG --match-head-commit "$TESTED_SHA" 2>&1)" || merge_rc=$?
          if [ -n "$MERGE_OUT" ]; then echo "$MERGE_OUT"; fi
          if [ "$merge_rc" -eq 0 ]; then
            echo "Successfully merged PR #$PR_NUMBER"
            finish success "merge requested: PR #$PR_NUMBER, head $TESTED_SHA" 0
          else
            echo "::notice::Merge command failed - leaving PR #$PR_NUMBER open for review"
            MERGE_REASON="$(printf '%s' "$MERGE_OUT" | head -n 1)"
            finish failure "merge failed: gh pr merge exit $merge_rc (${MERGE_REASON:-no output}) - PR #$PR_NUMBER left open, head $TESTED_SHA" 1
          fi

      # Evaluation status (REQ-CCR-025). Every evaluation of an open pull request whose evaluated head
      # commit is known posts exactly one commit status `auto-merge` on that commit: success when the merge
      # was requested, failure when the merge step ran and did not merge or files/review ended non-zero
      # (a draft excepted), pending for every other withheld outcome. The status reports the evaluation;
      # it is an output, never an input of any decision, and it is not a required check. A failed write
      # ends this step non-zero without changing the merge decision already taken.
      - name: Post the evaluation status
        id: status
        if: always() && steps.pr.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || steps.pr.outputs.head_sha }}
          HEAD_OK: ${{ steps.head.outputs.ok }}
          AUTHOR_ELIGIBLE: ${{ steps.author.outputs.eligible }}
          CHECKS_MERGE: ${{ steps.checks.outputs.should_merge }}
          FILES_STATE: ${{ steps.files.outputs.state }}
          REVIEW_STATE: ${{ steps.review.outputs.state }}
        run: |
          case "$SHA" in
            *[!0-9a-f]*) SHA="" ;;
          esac
          if [ "${#SHA}" -ne 40 ]; then
            echo "::notice::no evaluated head commit is known - no commit status is posted"
            exit 0
          fi
          STATE=pending
          DESC="not yet: evaluation incomplete"
          if [ -n "${AUTO_MERGE_STATE:-}" ]; then
            STATE="$AUTO_MERGE_STATE"
            DESC="${AUTO_MERGE_LINE:-merge step ended}"
          elif [ "$FILES_STATE" = "fail" ] || [ "$REVIEW_STATE" = "fail" ]; then
            STATE=failure
            DESC="gate refused: ${GATE_REASON:-unknown}"
          elif [ "$REVIEW_STATE" = "not-run:draft" ]; then
            DESC="not yet: draft"
          elif [ "$REVIEW_STATE" = "pending" ]; then
            DESC="${REVIEW_HOLD:-review-not-complete:running}"
          elif [ "$HEAD_OK" != "true" ]; then
            DESC="not yet: head ${HEAD_REASON:-not verified}"
          elif [ "$AUTHOR_ELIGIBLE" != "true" ]; then
            DESC="needs user approval: not an eligible author"
          elif [ "$CHECKS_MERGE" != "true" ]; then
            DESC="not yet: required checks not all passed"
          fi
          DESC="${DESC:0:140}"
          if ! gh api --method POST "repos/$REPO/statuses/$SHA" \
            -f state="$STATE" -f context=auto-merge -f description="$DESC" >/dev/null; then
            echo "::error::the auto-merge commit status could not be written"
            exit 1
          fi
          echo "auto-merge status $STATE on $SHA: $DESC"
