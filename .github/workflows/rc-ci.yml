# RC1 repository check set (00-E #2020). Runs on every PR to v2026.11.0 and reports
# the check `rc-ci` (08-D #2015 may add it to the required checks).
# For `pull_request`, GITHUB_REF is the PR merge branch (refs/pull/<n>/merge), so this runs
# before the RC branch reaches the default branch; first observed on the 00-E PR (AC-00E-2).
name: rc-ci

on:
  pull_request:
    branches: [v2026.11.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rc-ci:
    name: rc-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # `git diff --check` compares against the PR base commit
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install PyYAML (tests/github_assets_test.py)
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
      - name: Check set
        shell: bash
        run: |
          set -u
          summary="$GITHUB_STEP_SUMMARY"
          failed=0
          {
            echo "## rc-ci"
            echo
            echo "- tree: \`${{ github.event.pull_request.head.sha || github.sha }}\` (head) · merge ref \`$GITHUB_SHA\`"
            echo "- toolchain: \`$(rustc --version)\` · \`$(cargo --version)\` · \`$(python --version)\`"
            echo
            echo "| step | command | exit |"
            echo "| --- | --- | --- |"
          } >> "$summary"
          run() {
            local label="$1"; shift
            echo "::group::$label"
            "$@"; local code=$?
            echo "::endgroup::"
            echo "| $label | \`$*\` | $code |" >> "$summary"
            [ "$code" -eq 0 ] || failed=1
          }
          # Dependency strategy B (RC1 interim decision, 2026-11-08 17:4x; actions/cache is
          # re-evaluated in 08-D): fetch once against Cargo.lock, then run the set offline
          # exactly as lanes do locally.
          run fetch cargo fetch --locked
          echo "- dependencies: no cache; fetched with \`cargo fetch --locked\` before the offline steps" >> "$summary"
          run test cargo test --offline --locked
          run clippy cargo clippy --offline --locked --all-targets -- -D warnings
          run fmt cargo fmt --check
          run unittest python -m unittest discover -s tests -p '*_test.py'
          run diff-check git diff --check "${{ github.event.pull_request.base.sha || 'HEAD~1' }}...${{ github.event.pull_request.head.sha || 'HEAD' }}"
          exit "$failed"
