name: Release PR Multi-OS Verification

# SPEC-V3R4-CI-FASTTRACK-001 T6 (REVISED per user directive 2026-05-17)
# Rationale: macOS/Windows verification runs at release PR time (just-in-time),
# not as a nightly cron or post-merge tag trigger.
# - nightly cron: issues filed async, not visible at merge moment
# - release tag: post-merge, requires hotfix on regression
# - release PR: regression visible just before release, fix lands in same PR
# Original plan.md T6 described nightly-full-matrix.yml; user revised to this
# trigger pattern. Sync-phase will reconcile spec artifacts.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege: this workflow runs the Go test matrix and does not exercise
# any GITHUB_TOKEN write surface — no PR mutation, no `gh` call.
#
# It DOES upload a test-stream artifact (the "Upload test event stream" step
# below); an earlier revision of this comment said otherwise. That step needs no
# GITHUB_TOKEN permission, because actions/upload-artifact authenticates with the
# Actions runtime token rather than GITHUB_TOKEN. `contents: read` is therefore
# still the correct least privilege and MUST NOT be widened on its account
# (card t803).
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Detect: only proceed if this is a release/* branch PR or workflow_dispatch
  # ---------------------------------------------------------------------------
  detect-release:
    name: Detect Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: startsWith(github.head_ref, 'release/') || github.event_name == 'workflow_dispatch'
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      go_code: ${{ steps.f.outputs.go_code }}
    steps:
      - uses: actions/checkout@v7
      # Paths-filter classifies the release-PR diff as test-input vs docs-only
      # via the shared filter at .github/test-input-filters.yml (card t1536).
      # The previous inline copy was narrow, so a template/config-only release
      # PR read as docs-only and skipped this matrix while ci.yml excludes
      # release/* from its own Race Test — no race verification ran at all.
      # A genuinely docs-only release PR (e.g. a CHANGELOG-only re-push)
      # still skips the 13-min 3-OS matrix below while the required gate
      # reports success. Measured on release PR #1555: 26/40 files were .go,
      # so a real release PR runs the matrix.
      # continue-on-error plus full-matrix-test's `!= 'false'` comparison keep
      # the failure direction safe: if the filter cannot evaluate, go_code is
      # empty, the matrix RUNS — an abnormal filter can never silently skip
      # a required-gate verification. The matrix is skipped only on a
      # positively observed docs-only diff.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        continue-on-error: true
        with:
          # Shared single-source go_code filter — same list ci.yml and
          # codeql.yml consume, so the classifiers cannot drift (card t1536).
          filters: .github/test-input-filters.yml
      - id: gate
        run: echo "proceed=true" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # Full 3-OS matrix test. Only runs for release/* branch PRs or manual
  # workflow_dispatch — and, on PRs, only when the diff is not docs-only
  # (detect-release's paths-filter output). A docs-only release PR skips the
  # matrix; the required gate below still reports success via `if: always()`.
  # workflow_dispatch keeps its run-anytime semantics and always runs.
  #
  # ubuntu-latest stays in the matrix even though ci.yml also runs the race
  # detector on ubuntu on regular PRs — ci.yml skips its Race Test on
  # release/* PRs precisely because this leg supersedes it. ci.yml's
  # `Race Test` job is advisory by construction —
  # its check name is deliberately absent from branch protection, so a race
  # failure there is visible but does not block a merge. This job reports
  # through `Release PR Multi-OS Gate`, which IS a required check, so the
  # ubuntu leg here is the only ubuntu race run that can stop a release.
  # Dropping it would silently demote ubuntu race coverage to advisory at
  # exactly the moment it matters most.
  #
  # SHARDED RACE RUN (SPEC-CI-RELEASE-VERIFY-SHARD-001, card t1892). The race
  # suite used to be one `go test -race ./...` step per OS. On release PR #1830
  # (run 39180942620) all three legs were cancelled at this job's 40-minute
  # timeout inside that single step, and the one earlier leg that passed did so
  # in 38 min 10 s of the 40: the margin was never real. The suite now runs as
  # the same six shards ci.yml's Race Test legs use, on every OS: internal/cli in
  # four first-letter slices, the rosterguard package, and every other package
  # once (the remainder). That is 3 OS x 6 shards = 18 legs inside this one job
  # id, so `Release PR Multi-OS Gate` below still aggregates them through
  # `needs.full-matrix-test.result` and its text is unchanged (decision-index Q1).
  #
  # What did NOT change, on purpose: every `go test` keeps `-timeout 35m` and
  # this job keeps `timeout-minutes: 40` (no ceiling raised), no test is skipped
  # or excluded, no continue-on-error, no retry wrapper (Q5), and no required
  # status-check context of main is touched. The leg names are not required
  # contexts; `scripts/release.sh --require-matrix-run` reads them and was
  # changed in step with this matrix (Q2).
  #
  # The selectors below are copies of ci.yml's. They are kept equal, and every
  # internal/cli test name is kept covered exactly once, by
  # internal/template/release_verify_shard_parity_test.go (Q3). Edit a selector
  # here and in ci.yml together, or that test fails.
  #
  # macOS and Windows shard weights are unmeasured; the first full run is the
  # measurement. A shard that overruns its 35-minute ceiling is rebalanced by
  # selector, never given a longer timeout (Q8).
  # ---------------------------------------------------------------------------
  full-matrix-test:
    name: Release Verify (${{ matrix.os }}, ${{ matrix.shard }})
    needs: detect-release
    if: needs.detect-release.outputs.proceed == 'true' && (github.event_name == 'workflow_dispatch' || needs.detect-release.outputs.go_code != 'false')
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [cli-1, cli-2, cli-3, cli-4, rosterguard, remainder]
        # Exactly one include entry per shard, keyed by `shard` alone. Such an
        # entry only ADDS keys (pkg, run, vet) to the three combinations that
        # already carry that shard value; it overwrites nothing and creates no
        # extra leg. There is deliberately no `exclude`: the final leg set is
        # the full 18 pairs. `pkg: remainder` is a sentinel meaning "every
        # package except internal/cli and the rosterguard package".
        include:
          - shard: cli-1
            pkg: ./internal/cli/
            run: '^Test([A-E]|Fa)'
          # vet runs once per OS, on this shard's leg only (Q6).
          - shard: cli-2
            pkg: ./internal/cli/
            run: '^Test(F([^a]|$)|[G-I])'
            vet: true
          - shard: cli-3
            pkg: ./internal/cli/
            run: '^Test[J-R]'
          - shard: cli-4
            pkg: ./internal/cli/
            run: '^Test([S-Z]|[^A-Za-z])'
          - shard: rosterguard
            pkg: ./internal/harness/rosterguard/
            run: '^Test'
          - shard: remainder
            pkg: remainder
            run: ''
    runs-on: ${{ matrix.os }}
    # Every OS leg blocks the release gate. The windows leg was previously
    # pinned to continue-on-error while it carried 71 known failures across
    # 17 packages; that debt was cleared (PRs #1114, #1115, #1116), so a
    # windows regression must now stop a release rather than be reported
    # and ignored.

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # ast-grep supplies the `sg` binary that the internal/astgrep and
      # internal/hook/quality guards shell out to. Without it those guards
      # fail here rather than skipping, because they assert a match count
      # the scan can only produce when the real binary is present.
      # Mirrors ci.yml — keep the pinned version in step with it, since the
      # rewrite path parses sg's output.
      - name: Install ast-grep (provides `sg`)
        run: npm install -g @ast-grep/cli@0.40.5

      # Ubuntu and Debian ship /usr/bin/sg as a newgrp alternative, so `sg`
      # being on PATH proves nothing about what it is. Assert the binary is
      # ast-grep — a silent substitution is the failure this step prevents.
      #
      # `grep -i ... >/dev/null` rather than `grep -qi`: `shell: bash` runs the
      # step under `-eo pipefail`, and `grep -q` closes the pipe at the first
      # match, so a producer with more to write dies of SIGPIPE and the
      # pipeline resolves to 141 even though the match succeeded. Redirecting
      # instead keeps grep reading to EOF, so the exit status means what it
      # reads as. `sg --version` prints one short line and so does not trip
      # this today; the form is fixed because the next producer might.
      - name: Verify `sg` resolves to ast-grep
        shell: bash
        run: |
          if ! sg --version 2>&1 | grep -i 'ast-grep' >/dev/null; then
            echo "FAIL: 'sg' on PATH is not ast-grep — the rewrite guards cannot run."
            echo "resolved to: $(command -v sg || echo '<not found>')"
            sg --version 2>&1 || true
            exit 1
          fi
          echo "PASS: $(sg --version)"

      # `go vet ./...` covers the whole module, so it runs once per OS (on the
      # cli-2 leg, the only include entry carrying `vet: true`), not once per
      # shard. Every other leg skips it rather than repeat the same analysis.
      - name: Run go vet
        if: matrix.vet == true
        run: go vet ./...

      # -timeout raised above Go's 10m per-package default. internal/cli spends
      # most of its time in exec.Command tests, which the race detector and the
      # slower windows runner together push to ~10m — it panicked at 603s on a
      # run whose only other change was test-portability skips. The ceiling is
      # the job's own timeout-minutes; this value exists to stop a package from
      # being killed just under it.
      # --- t169 diagnostic (windows only, temporary) ------------------------
      # internal/hook and internal/cli tests have failed intermittently on the
      # windows leg because a `.moai/state` directory exists in an ANCESTOR of
      # the workspace, so the upward marker walk resolves outside the repo.
      # These two steps establish WHO creates it: the pre step shows the state
      # before any test runs, the post step (always()) shows it after. If the
      # pre step already lists a `.moai` and the post step does not differ, the
      # creator is the runner image or an earlier job step, not the test suite.
      # Remove both steps once the creator is identified.
      - name: 'Diagnose ancestor .moai (pre-test)'
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Show($label, $path) {
            Write-Host "=== $label : $path"
            if (Test-Path -LiteralPath $path) {
              Get-ChildItem -LiteralPath $path -Force -Recurse -Depth 2 -ErrorAction SilentlyContinue |
                Select-Object -First 60 |
                ForEach-Object { Write-Host "    $($_.FullName)" }
            } else {
              Write-Host "    <absent>"
            }
          }
          Show 'USERPROFILE' "$env:USERPROFILE\.moai"
          Show 'TEMP'        "$env:TEMP\.moai"
          # Workspace ancestors: the walk that actually escapes the repo.
          $d = Get-Item -LiteralPath $PWD.Path
          while ($null -ne $d) {
            Show "ANCESTOR" (Join-Path $d.FullName '.moai')
            $d = $d.Parent
          }
      # ---------------------------------------------------------------------

      # `-json` writes a per-test event stream to a FILE, keeping the console
      # log at its pre-change size while making a skipped or never-selected
      # test identifiable after the fact.
      #
      # `|| rc=$?` is load-bearing and MUST NOT be "simplified" to `; rc=$?`:
      # GitHub Actions runs this body under `bash --noprofile --norc -e -o
      # pipefail`, and under `-e` the shell exits AT a failing `go test`, so
      # the census would never print on exactly the run where it is wanted.
      # The two forms are indistinguishable on a green run.
      #
      # stdout ONLY — `2>&1` would corrupt the stream.
      # 3-OS x 6-shard matrix: the artifact name below carries both matrix.os
      # and matrix.shard, or the eighteen legs collide.
      #
      # Budget, recorded in place (SPEC-RELEASE-PIPELINE-001 REQ-RPC-007,
      # decision-index Q9 default: NO step-level ceiling is placed on this
      # step). A leg's 40 minutes hold: pre-step time (checkout, toolchain, `go
      # vet` on the cli-2 leg) + this step (compilation plus every package binary;
      # `-timeout 35m` bounds ONE binary, not the step) + the separate always()
      # compress/upload steps below. Measured in dispatched run 39729541531 -
      # a FAILING run (workflow_dispatch, branch WT-cloud-windows-portability-
      # repair, not main), n=1, windows legs only, so none of these figures
      # bounds a green leg: pre-step at most 4m21s (cli-2), this step up to
      # 37m28s (cli-1) on failing legs, evidence tail 6-8s, and cli-1 used
      # 39m09s of the 40. A future ceiling T on this step must satisfy
      # T + 5 (pre-step) + 1 (evidence) <= 40, i.e. T <= 34
      # (TestStageCeilingBelowJobBudget holds that arithmetic); which T, if any,
      # is decision-index Q9, and a green-run re-measurement is the unmeasured
      # follow-up that would establish the green-leg bound.
      #
      # The shard's selector and package reach the script ONLY through the
      # SHARD_RUN and SHARD_PKG environment variables. The selectors contain
      # `|`, `$`, `^` and `[^...]`; interpolating them into the script text would
      # have the shell re-parse those metacharacters.
      - name: Run tests with race detector
        shell: bash
        env:
          SHARD_RUN: ${{ matrix.run }}
          SHARD_PKG: ${{ matrix.pkg }}
        run: |
          rc=0
          # -timeout is per test binary, not per job. internal/cli under -race
          # was 1128s on the last green develop run (37135148076) and hit a 20m
          # cap on run 37161322193 (the same 3883 tests took 716s then 1024s,
          # +43%, on the same hosted runner class). Each shard keeps the ceiling
          # the former single `go test -race ./...` step had: 35m, inside this
          # job's timeout-minutes: 40 budget. It is NOT raised. The value is only
          # an upper bound; -count=1 keeps a cached result from standing in for
          # an observation made in this run.
          if [ "$SHARD_PKG" = "remainder" ]; then
            # Every package except internal/cli (the four cli shards) and the
            # rosterguard package (its own shard), so each package runs exactly
            # once per OS. Same exclusion list as ci.yml's remainder leg.
            # The guard is attached to the assignment itself: under -e -o
            # pipefail a failing `go list`, or a listing the filter emptied
            # (grep -v exits 1 on no output), would otherwise abort the step
            # silently before any message is printed.
            pkgs="$(go list ./... | grep -v -x -e 'github.com/modu-ai/moai-adk/internal/cli' -e 'github.com/modu-ai/moai-adk/internal/harness/rosterguard')" || { echo "FAIL: remainder package listing failed or came back empty (a bad listing is not evidence)"; exit 1; }
            # A listing that still contains an excluded package would run it a
            # second time unnoticed. grep -c prints 0 and exits 1 on no match,
            # so `|| true` keeps the count without tripping -e.
            leftover="$(printf '%s\n' "$pkgs" | grep -c -x -e 'github.com/modu-ai/moai-adk/internal/cli' -e 'github.com/modu-ai/moai-adk/internal/harness/rosterguard' || true)"
            test "$leftover" = "0" || { echo "FAIL: remainder package list still contains an excluded package ($leftover found); it would run twice"; exit 1; }
            go test -json -race -count=1 -timeout 35m $pkgs > test-stream.json || rc=$?
          else
            go test -json -race -count=1 -timeout 35m -run "$SHARD_RUN" "$SHARD_PKG" > test-stream.json || rc=$?
          fi
          bash scripts/ci-census/test-census.sh test-stream.json
          # A shard that ran no test is a silent green, not a pass: refuse it.
          grep -q '"Test":"' test-stream.json || { echo "FAIL: shard ran no test (empty sweep)"; rc=1; }
          exit $rc

      - name: Compress test event stream
        if: always()
        shell: bash
        run: |
          if [ -f test-stream.json ]; then gzip -f test-stream.json; fi

      - name: Upload test event stream
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-stream-release-verify-${{ matrix.os }}-${{ matrix.shard }}
          path: test-stream.json.gz
          retention-days: 7
          if-no-files-found: ${{ runner.os == 'Windows' && 'error' || 'warn' }}

      # --- t169 diagnostic (windows only, temporary) ------------------------
      # always(): the failing run is the one worth reading, so this must not be
      # skipped when the test step above fails.
      - name: 'Diagnose ancestor .moai (post-test)'
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          function Show($label, $path) {
            Write-Host "=== $label : $path"
            if (Test-Path -LiteralPath $path) {
              Get-ChildItem -LiteralPath $path -Force -Recurse -Depth 2 -ErrorAction SilentlyContinue |
                Select-Object -First 60 |
                ForEach-Object { Write-Host "    $($_.FullName)" }
            } else {
              Write-Host "    <absent>"
            }
          }
          Show 'USERPROFILE' "$env:USERPROFILE\.moai"
          Show 'TEMP'        "$env:TEMP\.moai"
          $d = Get-Item -LiteralPath $PWD.Path
          while ($null -ne $d) {
            Show "ANCESTOR" (Join-Path $d.FullName '.moai')
            $d = $d.Parent
          }
      # ---------------------------------------------------------------------


  # ---------------------------------------------------------------------------
  # Summary gate: ensures all OS legs passed (or were skipped for non-release
  # or docs-only PRs). This is the required check that branch protection
  # gates a release PR on, so the OS matrix above is what actually blocks a
  # bad release. A detect-release hard FAILURE also fails this gate: the job
  # now carries failable steps (checkout, paths-filter consumer), and a failed
  # detection would otherwise skip the matrix and reach this `if: always()`
  # aggregation as a mere 'skipped' — a required gate passing with zero
  # verification. detect-release SKIPPED (ordinary PR flow) still passes:
  # only a hard 'failure' blocks, never 'skipped'.
  # ---------------------------------------------------------------------------
  release-pr-gate:
    name: Release PR Multi-OS Gate
    needs: [full-matrix-test, detect-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exclusion: ${{ steps.verify.outputs.exclusion }}
    steps:
      - name: Verify all OS legs passed
        id: verify
        env:
          # A step/job output reaches the script through env, never through
          # `${{ }}` substitution into the script text.
          DETECT_GO_CODE: ${{ needs.detect-release.outputs.go_code }}
        run: |
          # AC-CI-001: the gate passes only when BOTH the detection and the
          # full matrix concluded success, or when the matrix produced no run
          # because of a positively identified intentional exclusion. Any
          # other conclusion (cancelled, timed_out, skipped without a named
          # exclusion, failure) fails the gate — a cancelled matrix is never
          # "PASSED".
          if [ "${{ needs.detect-release.result }}" != "success" ] && [ "${{ needs.detect-release.result }}" != "skipped" ]; then
            echo "::error::Release PR detection did not succeed before the matrix could run — not treating a skipped matrix as verification"
            exit 1
          fi

          if [ "${{ needs.detect-release.result }}" = "skipped" ]; then
            echo "exclusion=non-release-pr" >> "$GITHUB_OUTPUT"
            echo "::notice::Intentional exclusion: non-release PR (detect-release skipped by design) — matrix not required"
            exit 0
          fi

          if [ "${{ needs.full-matrix-test.result }}" = "success" ]; then
            echo "✓ Release PR multi-OS verification PASSED"
            exit 0
          fi

          if [ "${{ needs.full-matrix-test.result }}" = "skipped" ] && [ "${{ needs.detect-release.result }}" = "success" ] && [ "${DETECT_GO_CODE}" = "false" ]; then
            echo "exclusion=docs-only-release-pr" >> "$GITHUB_OUTPUT"
            echo "::notice::Intentional exclusion: docs-only release PR (paths-filter reported no code changes) — matrix not required"
            exit 0
          fi

          echo "::error::Release PR multi-OS verification concluded '${{ needs.full-matrix-test.result }}' (cancelled/timed_out/skipped-without-exclusion/failure) — not treating this as verification"
          exit 1
