version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - main: ./cmd/moai/
    binary: moai
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/modu-ai/moai-adk/pkg/version.Version={{.Version}}
      - -X github.com/modu-ai/moai-adk/pkg/version.Commit={{.Commit}}
      - -X github.com/modu-ai/moai-adk/pkg/version.Date={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Release notes are composed by the release harness (harness:release Phase 7),
# not auto-generated here. The auto-built commit list was a raw dump of every
# commit subject with its SHA and author handle, which buried the user-facing
# summary and published internal commit noise on a public page. GoReleaser now
# publishes an empty body; the harness fills it via `gh release edit
# --notes-file` immediately after this workflow completes.
changelog:
  disable: true

release:
  github:
    owner: modu-ai
    name: moai-adk
