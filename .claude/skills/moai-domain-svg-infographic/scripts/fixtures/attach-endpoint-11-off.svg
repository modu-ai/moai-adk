<!-- expect: -->
<!-- markerLen tolerance: both endpoints sit 11 units off the left edge (x = 229 against x = 240), outside the 10-unit standoff, so neither binds an edge and their 4-unit spacing is never compared. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200"
     role="img" aria-labelledby="attach-endpoint-11-off-title attach-endpoint-11-off-desc">
  <title id="attach-endpoint-11-off-title">Detached ends</title>
  <desc id="attach-endpoint-11-off-desc">Two connectors stop short of the box they point at.</desc>
  <defs>
    <marker id="attach-endpoint-11-off-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#6B6359"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="400" height="200" fill="#FAF9F5"/>
  <path d="M 40 98 H 229" stroke="#6B6359" stroke-width="1" fill="none" marker-end="url(#attach-endpoint-11-off-arrow)"/>
  <path d="M 40 102 H 229" stroke="#6B6359" stroke-width="1" fill="none" marker-end="url(#attach-endpoint-11-off-arrow)"/>
  <rect x="240" y="60" width="120" height="80" fill="#FBE9DF" stroke="#D97757"/>
  <text x="300" y="105" font-size="11" text-anchor="middle" fill="#141413">service</text>
</svg>
