<!-- expect: -->
<!-- C4: three arrivals at offset(k) = L*k/(N+1) on a 120-unit edge - 30 units apart, well over the 12-unit floor. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200"
     role="img" aria-labelledby="c4-attach-spread-title c4-attach-spread-desc">
  <title id="c4-attach-spread-title">Fan-in</title>
  <desc id="c4-attach-spread-desc">Several connectors arrive on one box edge.</desc>
  <defs>
    <marker id="c4-attach-spread-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#6B6359"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="400" height="200" fill="#FAF9F5"/>
  <path d="M 40 70 H 230" stroke="#6B6359" stroke-width="1" fill="none" marker-end="url(#c4-attach-spread-arrow)"/>
  <path d="M 40 100 H 230" stroke="#6B6359" stroke-width="1" fill="none" marker-end="url(#c4-attach-spread-arrow)"/>
  <path d="M 40 130 H 230" stroke="#6B6359" stroke-width="1" fill="none" marker-end="url(#c4-attach-spread-arrow)"/>
  <rect x="240" y="40" width="120" height="120" fill="#FBE9DF" stroke="#D97757"/>
  <text x="300" y="105" font-size="11" text-anchor="middle" fill="#141413">service</text>
</svg>
