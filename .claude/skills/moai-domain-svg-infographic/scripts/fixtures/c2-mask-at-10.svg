<!-- expect: -->
<!-- C2 boundary: clearance exactly 10, the inclusive upper edge of the 6-10 band. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200"
     role="img" aria-labelledby="c2-mask-at-10-title c2-mask-at-10-desc">
  <title id="c2-mask-at-10-title">Stage handoff</title>
  <desc id="c2-mask-at-10-desc">One connector carries a masked label between two stages.</desc>
  <defs>
    <marker id="c2-mask-at-10-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#6B6359"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="400" height="200" fill="#FAF9F5"/>
  <path d="M 60 120 H 340" stroke="#6B6359" stroke-width="1" fill="none" marker-end="url(#c2-mask-at-10-arrow)"/>
  <rect x="150" y="90" width="90" height="20" fill="#FFFFFF"/>
  <text x="195" y="104" font-size="11" text-anchor="middle" fill="#141413">handoff</text>
</svg>
