[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = []
# SBOM via cargo-cyclonedx (decision 01:1x: SBOM=cargo-dist ecosystem)
cargo-cyclonedx = true
cargo-auditable = true
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin"]
# The skill package and the base agents travel beside the binary: each folder lands at the
# archive root under its own name (paths relative to this file, no globs), and the installers
# copy them into <version>/skills/moai and <version>/agents, where `moai update` reads them
# (SPEC-20261117-dist-include-skill).
include = ["skills/", "agents/"]
